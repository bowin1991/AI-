<!-- 弹窗容器 -->
<div id="modal-root"></div>

<!-- 抽屉容器 -->
<div id="drawer-root"></div>

  <script src="js/common.js"></script>
  <script>
function renderPartnerListView(container) {
  let list = PARTNERS.filter(p => {
    if (listChannel !== 'ALL' && p.channel_type !== listChannel) return false;
    if (listStatus !== 'ALL' && p.status !== listStatus) return false;
    if (listKw) {
      const kw = listKw.toLowerCase();
      return p.name.toLowerCase().includes(kw) || p.phone.includes(kw) || p.code.includes(kw) || p.org.toLowerCase().includes(kw);
    }
    return true;
  });

  const pagedRows = pagedList('partners', list);

  container.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;">
      <div>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;">合伙人管理</h1>
      </div>
    </div>

    <!-- 筛选卡片 -->
    <div class="filter-card">
      <div class="filter-inputs-grid">
        <div class="filter-field" style="flex: 2; min-width: 240px;">
          <span class="field-label">关键词</span>
          <input class="input-control" type="text" placeholder="合伙人姓名、完整手机号、4位推荐码、机构" value="${listKw}" oninput="listKw=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))">
        </div>
        <div class="filter-field" style="flex: 1;">
          <span class="field-label">渠道类型</span>
          <select class="input-control" onchange="listChannel=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))">
            <option value="ALL" ${listChannel==='ALL'?'selected':''}>全部渠道</option>
            <option value="INTERNAL" ${listChannel==='INTERNAL'?'selected':''}>内部渠道 (员工/顾问)</option>
            <option value="EXTERNAL" ${listChannel==='EXTERNAL'?'selected':''}>外部渠道 (高校/博主)</option>
          </select>
        </div>
        <div class="filter-field" style="flex: 1;">
          <span class="field-label">账号状态</span>
          <select class="input-control" onchange="listStatus=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))">
            <option value="ALL" ${listStatus==='ALL'?'selected':''}>全部状态</option>
            <option value="NORMAL" ${listStatus==='NORMAL'?'selected':''}>正常</option>
            <option value="FROZEN" ${listStatus==='FROZEN'?'selected':''}>已冻结</option>
          </select>
        </div>
        <button class="btn btn-outline" onclick="listKw=''; listChannel='ALL'; listStatus='ALL'; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))">重置</button>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="table-container">
      <table class="official-table">
        <thead>
          <tr>
            <th>合伙人姓名</th>
            <th>账号状态</th>
            <th>单位</th>
            <th>手机号</th>
            <th>渠道</th>
            <th>推荐码</th>
            <th>个人订单首购比例</th>
            <th>个人订单续购比例</th>
            <th>个人订单总销售额</th>
            <th>机构订单总销售额</th>
            <th>加入时间</th>
            <th class="col-sticky" style="text-align: right;">操作</th>
          </tr>
        </thead>
        <tbody>
          ${list.length === 0 ? `
            <tr><td colspan="12" style="text-align:center; padding:48px; color:var(--muted-foreground);">暂无符合筛选条件的合伙人</td></tr>
          ` : pagedRows.map(p => `
            <tr>
              <td><span style="font-weight: 600;">${p.name}</span></td>
              <td>
                ${p.status === 'NORMAL' ? '<span class="badge badge-success">正常</span>' : ''}
                ${p.status === 'FROZEN' ? '<span class="badge badge-warning" title="'+p.freeze_reason+'">已冻结</span>' : ''}
              </td>
              <td><div style="font-size: 12px; color: var(--muted-foreground); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.org}</div></td>
              <td><strong class="num">${p.phone}</strong></td>
              <td>
                ${p.channel_type === 'INTERNAL' ? '<span class="badge badge-blue">内部</span>' : '<span class="badge badge-neutral">外部</span>'}
              </td>
              <td><span class="code-badge">${p.code}</span>${p.status === 'FROZEN' ? '<div style="font-size:10.5px; color:var(--destructive); margin-top:2px;">已失效</div>' : ''}</td>
              <td><strong class="num">${p.first_rate}%</strong></td>
              <td><strong class="num">${p.renew_rate}%</strong></td>
              <td><strong class="num">¥${formatNum(partnerSales(p, 'user'))}</strong></td>
              <td><strong class="num">¥${formatNum(partnerSales(p, 'org'))}</strong></td>
              <td style="color: var(--muted-foreground); font-size: 12px;">${p.join_time.split(' ')[0]}</td>
              <td class="col-sticky" style="text-align: right;">
                <button class="btn btn-outline btn-sm" onclick="navigate('partner/${p.id}/orders')">详情</button>
                <button class="btn btn-outline btn-sm" onclick="openModifyRateModal('${p.id}')">改比例</button>
                ${p.status === 'FROZEN' ? `
                  <button class="btn btn-outline btn-sm" style="color: #15803D;" onclick="unfreezePartner('${p.id}')">解冻</button>
                ` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${pagerBar('partners', list.length)}
    </div>
  `;
}

// ==========================================
// 3. 页面：合伙人详情穿透页 (PARTNER DETAIL)
// ==========================================

function renderCurrentPage() {
  renderPartnerListView(document.getElementById("main-view-container"));
}

function startPage() {
  initAdminNav('nav-list');
  renderCurrentPage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPage);
} else {
  startPage();
}
  </script>
</body>
</html>
