          </div>
          <button class="btn-ghost" style="padding:4px;" onclick="closeDrawer('drawer-app')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="drawer-body">
          <div class="form-group">
            <label class="form-group-label">真实姓名 <span class="req">*</span></label>
            <input class="form-input-full" id="dr-in-name" value="${app.name}">
          </div>

          <div class="form-group">
            <label class="form-group-label">所属单位 / 机构 <span class="req">*</span></label>
            <input class="form-input-full" id="dr-in-org" value="${app.org}">
          </div>

          <div class="form-group">
            <label class="form-group-label">身份属性 <span class="req">*</span></label>
            <input class="form-input-full" id="dr-in-role" value="${app.role}">
          </div>

          <div class="form-group">
            <label class="form-group-label">申请手机号 (账号标识，只读完整展示)</label>
            <input class="form-input-full num" value="${app.phone}" disabled>
            <div class="form-hint-note">合伙人前台登录凭据，不可更改。</div>
          </div>

          <div class="form-group">
            <label class="form-group-label">微信号</label>
            <input class="form-input-full" id="dr-in-wx" value="${app.wx || ''}" placeholder="未填写">
          </div>

          ${app.status === 'REJECTED' && app.reject_reason ? `
            <div style="background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 16px; font-size: 12.5px; color: #991B1B;">
              <strong>历史拒绝原因：</strong>${app.reject_reason}
            </div>
          ` : ''}
        </div>

        <div class="drawer-footer">
          <button class="btn btn-outline" onclick="closeDrawer('drawer-app')">取消</button>
          <button class="btn btn-primary" onclick="saveAppInfo('${app.id}')">保存修改</button>
        </div>
      </div>
    </div>
  `;
}

function saveAppInfo(appId) {
  const app = APPLICATIONS.find(a => a.id === appId);
  if (!app) return;
  const name = document.getElementById('dr-in-name').value.trim();
  const org = document.getElementById('dr-in-org').value.trim();
  const role = document.getElementById('dr-in-role').value.trim();
  const wx = document.getElementById('dr-in-wx').value.trim();

  if (!name || !org || !role) { alert('姓名、单位与身份属性必填'); return; }

  app.name = name; app.org = org; app.role = role; app.wx = wx;
  app.logs.unshift({
    time: nowTime(),
    operator: '张博文',
    action: '资料信息维护',
    detail: `修改为: ${name} / ${org}`
  });

  closeDrawer('drawer-app');
  toast('资料已成功更新');
  renderApplicationsView(document.getElementById('main-view-container'));
}

// 4. 修改比例弹窗
function openModifyRateModal(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-mask show" id="modal-rate">
      <div class="modal-dialog">
        <div class="modal-dialog-header">
          <h3>修改分成比例</h3>
          <button class="btn-ghost" style="padding:4px;" onclick="closeModal('modal-rate')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-dialog-body">
          <div style="background: #FAFAFA; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 16px; font-size: 13px;">
            合伙人：<strong>${p.name}</strong> (${p.phone} · 推荐码: ${p.code})
          </div>

          <div class="form-group">
            <label class="form-group-label">当前比例（首购 / 续购）</label>
            <input class="form-input-full num" value="${p.first_rate.toFixed(1)}% / ${p.renew_rate.toFixed(1)}%" disabled>
          </div>

          <div class="form-group">
            <label class="form-group-label">新分成比例（首购 / 续购） <span class="req">*</span></label>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <input class="form-input-full num" type="number" step="0.1" min="0" max="100" id="in-new-first-rate" value="${p.first_rate.toFixed(1)}" placeholder="首购比例">
              <input class="form-input-full num" type="number" step="0.1" min="0" max="100" id="in-new-renew-rate" value="${p.renew_rate.toFixed(1)}" placeholder="续购比例">
            </div>
            <div class="form-hint-note" style="color: #A16207;">
              ⚠️ 仅对修改后新产生订单生效，历史已带单分成不追溯重算。
            </div>
          </div>

          <div class="form-group">
            <label class="form-group-label">修改原因与审计备注 <span class="req">*</span></label>
            <textarea class="form-textarea-full" id="txt-rate-reason" placeholder="如：重点自媒体签约合作，特批上调分成比例..."></textarea>
          </div>
        </div>
        <div class="modal-dialog-footer">
          <button class="btn btn-outline" onclick="closeModal('modal-rate')">取消</button>
          <button class="btn btn-primary" onclick="confirmModifyRate('${p.id}')">确认修改</button>
        </div>
      </div>
    </div>
  `;
}

function confirmModifyRate(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;
  const firstRate = parseFloat(document.getElementById('in-new-first-rate').value);
  const renewRate = parseFloat(document.getElementById('in-new-renew-rate').value);
  const reason = document.getElementById('txt-rate-reason').value.trim();

  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100) { alert('请输入有效的首购与续购比例'); return; }
  if (!reason) { alert('请填写修改原因'); return; }

  const oldFirst = p.first_rate, oldRenew = p.renew_rate;
  p.first_rate = firstRate;
  p.renew_rate = renewRate;
  p.logs.unshift({
    time: nowTime(),
    operator: '张博文',
    action: '分成比例调整',
    before: `首购 ${oldFirst.toFixed(1)}% / 续购 ${oldRenew.toFixed(1)}%`,
    after: `首购 ${firstRate.toFixed(1)}% / 续购 ${renewRate.toFixed(1)}%`,
    reason: reason
  });

  closeModal('modal-rate');
  toast(`分成比例已调整为 首购 ${firstRate.toFixed(1)}% / 续购 ${renewRate.toFixed(1)}%`);
  renderActiveView();
}

// 5. 冻结 / 解冻
function openFreezeModal(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-mask show" id="modal-freeze">
      <div class="modal-dialog">
        <div class="modal-dialog-header">
          <h3>冻结合伙人账号</h3>
          <button class="btn-ghost" style="padding:4px;" onclick="closeModal('modal-freeze')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-dialog-body">
          <div style="background: #FEFCE8; border: 1px solid #FEF08A; border-radius: var(--radius-md); padding: 10px 12px; font-size: 12.5px; color: #A16207; margin-bottom: 14px;">
            冻结后该合伙人<strong>立即无法登录前台</strong>，推荐码 (${p.code}) 与专属推广链接同步失效，下单不再产生归属与佣金；解冻后恢复。历史可结算金额保留。
          </div>
          <div class="form-group">
            <label class="form-group-label">冻结原因 <span class="req">*</span></label>
            <textarea class="form-textarea-full" id="txt-freeze-reason" placeholder="请输入冻结原因..."></textarea>
          </div>
        </div>
        <div class="modal-dialog-footer">
          <button class="btn btn-outline" onclick="closeModal('modal-freeze')">取消</button>
          <button class="btn btn-primary" onclick="confirmFreeze('${p.id}')">确认冻结</button>
        </div>
      </div>
    </div>
  `;
}

function confirmFreeze(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;
  const reason = document.getElementById('txt-freeze-reason').value.trim();
  if (!reason) { alert('请填写冻结原因'); return; }

  p.status = 'FROZEN';
  p.freeze_reason = reason;
  p.logs.unshift({
    time: nowTime(),
    operator: '张博文',
    action: '冻结账号',
    before: '正常',
    after: '已冻结',
    reason: reason
  });

  closeModal('modal-freeze');
  toast(`合伙人【${p.name}】已冻结`);
  renderActiveView();
}

function unfreezePartner(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;
  if (!confirm(`确认解冻合伙人【${p.name}】吗？`)) return;

  p.status = 'NORMAL';
  p.freeze_reason = '';
  p.logs.unshift({
    time: nowTime(),
    operator: '张博文',
    action: '解冻账号',
    before: '已冻结',
    after: '正常',
    reason: '合规核实完毕恢复正常合作'
  });

  toast(`合伙人【${p.name}】已成功解冻`);
  renderActiveView();
}

// 6. 确认结算核销弹窗
// 7. 页面：系统设置 (SETTINGS)
let settingsEditing = { rates: false, freeze: false };
let pendingSettings = null;

function renderSettingsView(container) {
  const onR = settingsEditing.rates, onF = settingsEditing.freeze;
  const boxStyle = on => `display: flex; align-items: center; height: 36px; border: 1px solid ${on ? 'var(--input)' : 'var(--border)'}; border-radius: var(--radius-md); background: ${on ? '#fff' : '#F4F4F5'}; padding: 0 12px; gap: 8px;`;
  const numInput = (id, label, value, on) => `
    <div style="${boxStyle(on)}">
      <span style="flex: none; font-size: 12px; color: var(--muted-foreground);">${label}</span>
      <input class="num" type="number" step="0.1" min="0" max="100" id="${id}" value="${value}" ${on ? '' : 'disabled'} style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; text-align: right; color: ${on ? 'var(--foreground)' : 'var(--muted-foreground)'};">
    </div>`;
  const editActions = (key, saveFn) => `
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <button class="btn btn-outline" onclick="cancelSettingsEdit('${key}')">取消</button>
      <button class="btn btn-primary" onclick="${saveFn}">保存</button>
    </div>`;

  container.innerHTML = `
    <div style="margin-bottom: 22px;">
      <h1 style="font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;">系统设置</h1>
    </div>

    <div class="content-card" style="padding: 20px 22px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 14px; font-weight: 600;">默认分成比例</div>
        ${onR ? '' : `<button class="btn btn-outline btn-sm" onclick="startSettingsEdit('rates')">修改</button>`}
      </div>
      <div class="form-hint-note" style="margin: 4px 0 16px;">保存后同步为全系统所有管理者审核、建档时带出的默认比例；仅对后续新合伙人生效，已有合伙人比例保持不变。</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-group-label">内部渠道默认比例（%）</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${numInput('set-in-first', '首购', GLOBAL_CONFIG.internal_first_rate, onR)}
            ${numInput('set-in-renew', '续购', GLOBAL_CONFIG.internal_renew_rate, onR)}
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-group-label">外部渠道默认比例（%）</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${numInput('set-ext-first', '首购', GLOBAL_CONFIG.external_first_rate, onR)}
            ${numInput('set-ext-renew', '续购', GLOBAL_CONFIG.external_renew_rate, onR)}
          </div>
        </div>
      </div>
      ${onR ? editActions('rates', 'requestSaveRates()') : ''}
    </div>

    <div class="content-card" style="padding: 20px 22px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 14px; font-weight: 600;">冻结规则</div>
        ${onF ? '' : `<button class="btn btn-outline btn-sm" onclick="startSettingsEdit('freeze')">修改</button>`}
      </div>
      <div class="form-hint-note" style="margin: 4px 0 16px;">推广币解冻日 = 服务期结束日 + N 天（防退款观察期）。修改并保存后，全系统按新规则重算解冻日与冻结中金额。</div>
      <div class="form-group" style="max-width: 280px; margin-bottom: 0;">
        <label class="form-group-label">冻结观察期 T+N（天）</label>
        <input class="form-input-full num" type="number" step="1" min="0" max="60" id="set-unfreeze-days" value="${GLOBAL_CONFIG.unfreeze_days}" ${onF ? '' : 'disabled'}>
        <div class="form-hint-note">当前规则：T+${GLOBAL_CONFIG.unfreeze_days} 天。默认 7 天，可调整 0-60 天。</div>
      </div>
      ${onF ? editActions('freeze', 'requestSaveFreeze()') : ''}
    </div>
  `;
}

function startSettingsEdit(key) {
  settingsEditing[key] = true;
  renderActiveView();
}

function cancelSettingsEdit(key) {
  settingsEditing[key] = false;
  pendingSettings = null;
  renderActiveView();
}

function requestSaveRates() {
  const iF = parseFloat(document.getElementById('set-in-first').value);
  const iR = parseFloat(document.getElementById('set-in-renew').value);
  const eF = parseFloat(document.getElementById('set-ext-first').value);
  const eR = parseFloat(document.getElementById('set-ext-renew').value);
  if ([iF, iR, eF, eR].some(v => isNaN(v) || v < 0 || v > 100)) { alert('请输入有效的首购与续购比例 (0~100%)'); return; }

  const diffs = [];
  if (iF !== GLOBAL_CONFIG.internal_first_rate) diffs.push(`内部 首购 ${GLOBAL_CONFIG.internal_first_rate}% → ${iF}%`);
  if (iR !== GLOBAL_CONFIG.internal_renew_rate) diffs.push(`内部 续购 ${GLOBAL_CONFIG.internal_renew_rate}% → ${iR}%`);
  if (eF !== GLOBAL_CONFIG.external_first_rate) diffs.push(`外部 首购 ${GLOBAL_CONFIG.external_first_rate}% → ${eF}%`);
  if (eR !== GLOBAL_CONFIG.external_renew_rate) diffs.push(`外部 续购 ${GLOBAL_CONFIG.external_renew_rate}% → ${eR}%`);
  if (!diffs.length) { settingsEditing.rates = false; toast('未修改任何配置'); renderActiveView(); return; }

  pendingSettings = { type: 'rates', values: { iF, iR, eF, eR }, diffs };
  openSettingsConfirm('默认分成比例', diffs);
}

function requestSaveFreeze() {
  const days = parseInt(document.getElementById('set-unfreeze-days').value, 10);
  if (isNaN(days) || days < 0 || days > 60) { alert('请输入有效的冻结观察期天数 (0~60 天)'); return; }

  const diffs = [];
  if (days !== GLOBAL_CONFIG.unfreeze_days) diffs.push(`冻结观察期 T+${GLOBAL_CONFIG.unfreeze_days} → T+${days}`);
  if (!diffs.length) { settingsEditing.freeze = false; toast('未修改任何配置'); renderActiveView(); return; }

  pendingSettings = { type: 'freeze', values: { days }, oldDays: GLOBAL_CONFIG.unfreeze_days, diffs };
  openSettingsConfirm('冻结规则', diffs);
}

function openSettingsConfirm(title, diffs) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask show" id="modal-set-confirm">
      <div class="modal-dialog" style="max-width: 440px;">
        <div class="modal-dialog-header">
          <h3>确认修改 · ${title}</h3>
          <button class="btn-ghost" style="padding: 4px;" onclick="closeModal('modal-set-confirm')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-dialog-body">
          <p style="font-size: 13px; color: var(--muted-foreground); margin-bottom: 12px;">以下配置将被变更，请确认无误后保存：</p>
          ${diffs.map(d => `<div style="font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;">${d}</div>`).join('')}
        </div>
        <div class="modal-dialog-footer">
          <button class="btn btn-outline" onclick="closeModal('modal-set-confirm')">取消</button>
          <button class="btn btn-primary" onclick="applySettingsChanges()">确认保存</button>
        </div>
      </div>
    </div>`;
}

function applySettingsChanges() {
  const p = pendingSettings;
  if (!p) return;
  if (p.type === 'rates') {
    const { iF, iR, eF, eR } = p.values;
    GLOBAL_CONFIG.internal_first_rate = iF;
    GLOBAL_CONFIG.internal_renew_rate = iR;
    GLOBAL_CONFIG.external_first_rate = eF;
    GLOBAL_CONFIG.external_renew_rate = eR;
    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整默认比例：${p.diffs.join('；')}` });
    toast(`默认比例已更新：内部 ${iF}% / ${iR}%，外部 ${eF}% / ${eR}%`);
  } else {
    GLOBAL_CONFIG.unfreeze_days = p.values.days;
    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整冻结规则：T+${p.oldDays} → T+${p.values.days}` });
    toast(`冻结规则已更新：T+${p.values.days} 天`);
  }
  settingsEditing[p.type] = false;
  pendingSettings = null;
  closeModal('modal-set-confirm');
  recalcAll();
  renderActiveView();
}

// 通用助手函数
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
function closeDrawer(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
function toast(msg) {
  const el = document.getElementById('app-toast');
  const txt = document.getElementById('toast-text');
  if (!el || !txt) return;
  txt.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function nowTime() {
  const d = new Date();
  const pad = n => n < 10 ? '0' + n : n;
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatNum(n) {
  if (n === null || n === undefined) return '0';
  const v = Math.round(n * 100) / 100;
  return v.toLocaleString(undefined, Number.isInteger(v) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// 佣金一律按分取整（保留两位小数）
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmtC(n) {
  if (n === null || n === undefined) return '0.00';
  return round2(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

window.onload = function() {
  initRouter();
};
</script>
