          <button class="btn btn-outline btn-sm" style="color:#15803D;" onclick="unfreezePartner('${p.id}')">解冻恢复</button>

    </div>

    <!-- 档案基础 KV 卡片 -->
    <div class="content-card" style="padding: 16px 20px; margin-bottom: 22px;">
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; font-size: 13px;">
        <div>
          <span style="color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;">手机号码</span>
          <strong class="num">${p.phone}</strong>
        </div>
        <div>
          <span style="color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;">专属推荐码 (4位)</span>
          <span class="code-badge">${p.code}</span>
        </div>
        <div>
          <span style="color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;">当前分成比例（首购 / 续购）</span>
          <strong class="num">${p.first_rate}% / ${p.renew_rate}%</strong>
        </div>
        <div>
          <span style="color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;">微信号</span>

    <!-- 分段明细选项卡 -->
    <div class="segmented-tabs">
      <button class="seg-tab-btn ${activeTab==='orders'?'active':''}" onclick="navigate('partner/${p.id}/orders')">
        个人订单

      <button class="seg-tab-btn ${activeTab==='orgs'?'active':''}" onclick="navigate('partner/${p.id}/orgs')">
        机构订单

        结算历史
      </button>

    <!-- 金额汇总卡片（随选项卡维度切换） -->
    ${activeTab === 'settlements' ? '' : activeTab === 'orgs' ? `
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px;">
      <div class="content-card" style="margin-bottom:0; padding:16px 18px;">
        <div style="font-size: 12px; color: var(--muted-foreground);">累计总金额 (机构订单)</div>
        <div style="font-size: 24px; font-weight: 700; margin-top: 4px;" class="num">¥${fmtC(tabPts.total)}</div>

        <div style="font-size: 24px; font-weight: 700; color: var(--foreground); margin-top: 4px;" class="num">¥${fmtC(tabPts.settled)}</div>

    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px;">

        <div style="font-size: 24px; font-weight: 700; margin-top: 4px;" class="num">¥${fmtC(tabPts.total)}</div>
        <div style="font-size: 11px; color: var(--muted-foreground); margin-top: 4px;">历史净产生佣金总额</div>
      </div>
      <div class="content-card" style="margin-bottom:0; padding:16px 18px;">
        <div style="font-size: 12px; color: var(--muted-foreground);">当前可结算金额</div>
        <div style="font-size: 24px; font-weight: 700; color: #15803D; margin-top: 4px;" class="num">¥${fmtC(tabPts.withdrawable)}</div>
        <div style="font-size: 11px; color: var(--muted-foreground); margin-top: 4px;">随时可线下打款核销</div>
      </div>
      <div class="content-card" style="margin-bottom:0; padding:16px 18px;">
        <div style="font-size: 12px; color: var(--muted-foreground);">冻结中金额</div>
        <div style="font-size: 24px; font-weight: 700; color: #A16207; margin-top: 4px;" class="num">¥${fmtC(tabPts.frozen)}</div>
        <div style="font-size: 11px; color: var(--muted-foreground); margin-top: 4px;">到期 T+7 自动解冻</div>
      </div>
      <div class="content-card" style="margin-bottom:0; padding:16px 18px;">
        <div style="font-size: 12px; color: var(--muted-foreground);">累计已结算金额</div>
        <div style="font-size: 24px; font-weight: 700; color: var(--foreground); margin-top: 4px;" class="num">¥${fmtC(tabPts.settled)}</div>
        <div style="font-size: 11px; color: var(--muted-foreground); margin-top: 4px;">财务已转账核销履约</div>
      </div>
      <div class="content-card" style="margin-bottom:0; padding:16px 18px;">
        <div style="font-size: 12px; color: var(--muted-foreground);">待追回金额 (异常)</div>
        <div style="font-size: 24px; font-weight: 700; color: ${tabPts.unrecovered > 0 ? 'var(--destructive)' : 'var(--muted-foreground)'}; margin-top: 4px;" class="num">
          ¥${fmtC(tabPts.unrecovered)}
        </div>
        <div style="font-size: 11px; color: var(--muted-foreground); margin-top: 4px;">${tabPts.unrecovered > 0 ? '需在下期打款中扣减' : '账目正常无欠款'}</div>
      </div>
    </div>`}

    <!-- 表格内容 -->
    <div class="table-container">
      ${renderDetailTabTable(p, activeTab)}
    </div>
  `;
}

// 按维度（个人订单 / 机构订单）汇总合伙人佣金，用于详情页选项卡下方的金额卡片
function partnerTabPoints(p, kind) {
  let w = 0, f = 0, s = 0, short = 0;
  p.orders.forEach(o => {
    const isOrg = orderKind(o) === 'ORG';
    if ((kind === 'org') !== isOrg) return;
    orderLines(o, p).forEach(l => {
      s += l.settled;
      if (kind === 'org') {
        if (l.state !== 'SETTLED') w += l.remaining;
      } else if (l.state === 'UNLOCKED') w += l.remaining;
      else if (l.state === 'FROZEN') f += l.remaining;
    });
    if (kind !== 'org') short += (o._refundShort || 0);
  });
  return {
    total: round2(w + f + s), withdrawable: round2(w), frozen: round2(f), settled: round2(s),
    unrecovered: Math.max(0, round2(short - (p._offsetPaid || 0)))
  };
}

function renderDetailTabTable(p, tab) {
  if (tab === 'orders' || tab === 'orgs') {
    const isOrgTab = tab === 'orgs';
    const list = p.orders.filter(o => (orderKind(o) === 'ORG') === isOrgTab);
    const key = 'det-' + tab + '-' + p.id;
    const rows = pagedList(key, list);
    return `
      <table class="official-table">
        <thead>
          <tr>
            <th>订单编号</th>
            <th>${isOrgTab ? '机构名称' : '下单客户'}</th>
            ${isOrgTab ? '' : '<th>商品名称</th>'}
            <th>订单状态</th>
            <th>订单金额</th>
            <th>分成比例</th>
            <th>本单佣金</th>
            <th>下单时间</th>
            <th class="col-sticky" style="text-align:right;">操作</th>
          </tr>
        </thead>
        <tbody>
          ${list.length === 0 ? `<tr><td colspan="${isOrgTab ? 8 : 9}" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无${isOrgTab ? '机构' : '个人'}订单</td></tr>` : rows.map(o => {
            const lines = orderLines(o, p);
            const netPoints = Math.max(0, o.points - (o._recover || 0));
            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';
            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';
            const payBadge = isRefund
              ? '<span class="badge badge-danger" style="font-size:10.5px;">已退款</span>'
              : '<span class="badge badge-success" style="font-size:10.5px;">已支付</span>';
            const isOrg = o.kind === 'ORG';
            return `<tr>
              <td><span class="code-badge">${o.id}</span></td>
              <td>${isOrg ? `<strong>${o.org_name}</strong>` : `<strong class="num">${o.customer_phone}</strong>`}</td>
              ${isOrg ? '' : `<td style="font-size:12.5px;">${productName(o)}<div style="margin-top:3px;">${productTagHtml(o)}</div></td>`}
              <td>${payBadge}</td>
              <td class="num">¥${formatNum(o.pay_amount)}${refunded > 0 ? `<div style="font-size:10.5px; color:var(--muted-foreground); margin-top:2px;">已退 ¥${formatNum(refunded)}</div>` : ''}</td>
              <td class="num">${o.rate}%</td>
              <td><strong class="num" style="color:${pc};">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong></td>
              <td class="num" style="color:var(--muted-foreground); font-size:11.5px;">${o.created_at || o.start}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                <button class="btn btn-outline btn-sm" onclick="showOrderDetail('${o.id}')">订单详情</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${pagerBar(key, list.length)}
    `;
  }

  if (tab === 'settlements') {
    const key = 'det-settle-' + p.id;
    const rows = pagedList(key, p.settlements);
    return `
      <table class="official-table">
        <thead>
          <tr>
            <th>结算单号</th>
            <th>结算来源</th>
            <th>结算金额</th>
            <th>财务打款凭证号</th>
            <th>经办人</th>
            <th>核销时间</th>
            <th>打款备注</th>
          </tr>
        </thead>
        <tbody>
          ${p.settlements.length === 0 ? '<tr><td colspan="7" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无核销记录</td></tr>' :
          rows.map(s => {
            const hist = SETTLEMENT_HISTORY.find(h => h.settle_id === s.batch_no);
            return `
            <tr>
              <td><span class="code-badge">${s.batch_no}</span></td>
              <td>${hist && hist.source === 'ORG' ? '<span class="badge badge-blue">机构订单</span>' : '<span class="badge badge-neutral">个人订单</span>'}</td>
              <td><strong class="num" style="color: #15803D;">¥${fmtC(s.points)}</strong></td>
              <td><span class="code-badge">${s.voucher}</span></td>
              <td>${s.operator}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${s.time}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${s.remark}</td>
            </tr>
          `; }).join('')}
        </tbody>
      </table>
      ${pagerBar(key, p.settlements.length)}
    `;
  }

  return '';
}


function renderCurrentPage() {
  
var params = new URLSearchParams(location.search);
var pId = params.get('partnerId') || (PARTNERS[0] ? PARTNERS[0].id : 'p1');
