\">已通过</span>' : ''}\r\n                ${item.status === 'REJECTED' ? '<span class=\"badge badge-danger\">已拒绝</span>' : ''}\r\n              </td>\r\n              ${showOperatorCol ? `<td>${item.status === 'APPROVED' ? (item.approve_by || '-') : item.status === 'REJECTED' ? (item.reject_by || '-') : ''}</td>` : ''}\r\n              <td class=\"col-sticky\" style=\"text-align: right;\">\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"openAppDetailDrawer('${item.id}')\">详情</button>\r\n                ${item.status === 'PENDING' ? `\r\n                  <button class=\"btn btn-primary btn-sm\" onclick=\"openApproveModal('${item.id}')\">通过</button>\r\n                  <button class=\"btn btn-destructive btn-sm\" onclick=\"openRejectModal('${item.id}')\">拒绝</button>\r\n                ` : ''}\r\n                ${item.status === 'REJECTED' ? `\r\n                  <button class=\"btn btn-primary btn-sm\" onclick=\"openApproveModal('${item.id}', true)\">重新审核</button>\r\n                ` : ''}\r\n              </td>\r\n            </tr>\r\n          `).join('')}\r\n        </tbody>\r\n      </table>\r\n      ${pagerBar('apps', filtered.length)}\r\n    </div>\r\n  `;\r\n}\r\n\r\n// ---------------- 申请时间区间选择器（shadcn/ui 风格） ----------------\r\nfunction pad2(n) { return String(n).padStart(2, '0'); }\r\nfunction ymAdd(ym, delta) {\r\n  const [y, m] = ym.split('-').map(Number);\r\n  const d = new Date(y, m - 1 + delta, 1);\r\n  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;\r\n}\r\nfunction ymLabel(ym) {\r\n  const [y, m] = ym.split('-').map(Number);\r\n  return `${y} 年 ${m} 月`;\r\n}\r\nfunction monthCells(ym) {\r\n  const [y, m] = ym.split('-').map(Number);\r\n  const firstDow = new Date(y, m - 1, 1).getDay();\r\n  const daysInMonth = new Date(y, m, 0).getDate();\r\n  const prevDays = new Date(y, m - 1, 0).getDate();\r\n  const prevYm = ymAdd(ym, -1);\r\n  const nextYm = ymAdd(ym, 1);\r\n  const cells = [];\r\n  for (let i = firstDow - 1; i >= 0; i--) {\r\n    cells.push({ date: `${prevYm}-${pad2(prevDays - i)}`, day: prevDays - i, muted: true });\r\n  }\r\n  for (let d = 1; d <= daysInMonth; d++) {\r\n    cells.push({ date: `${ym}-${pad2(d)}`, day: d, muted: false });\r\n  }\r\n  let n = 1;\r\n  while (cells.length % 7 !== 0) {\r\n    cells.push({ date: `${nextYm}-${pad2(n)}`, day: n, muted: true });\r\n    n++;\r\n  }\r\n  return cells;\r\n}\r\nfunction calMonthHtml(ym) {\r\n  const chevronL = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"></path></svg>';\r\n  const chevronR = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"></path></svg>';\r\n  return `\r\n    <div>\r\n      <div class=\"cal-head\">\r\n        <button type=\"button\" class=\"cal-nav\" onclick=\"shiftAppCal(-1)\">${chevronL}</button>\r\n        <span>${ymLabel(ym)}</span>\r\n        <button type=\"button\" class=\"cal-nav\" onclick=\"shiftAppCal(1)\">${chevronR}</button>\r\n      </div>\r\n      <div class=\"cal-weekdays\">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div>${w}</div>`).join('')}</div>\r\n      <div class=\"cal-grid\">\r\n        ${monthCells(ym).map(c => {\r\n          const isFrom = c.date === appTmpFrom;\r\n          const isTo = c.date === appTmpTo;\r\n          const inRange = appTmpFrom && appTmpTo && c.date > appTmpFrom && c.date < appTmpTo;\r\n          const cls = ['cal-day', c.muted ? 'muted' : '', (isFrom || isTo) ? 'edge' : '', inRange ? 'in-range' : '', c.date === REF_DATE ? 'today' : ''].filter(Boolean).join(' ');\r\n          return `<button type=\"button\" class=\"${cls}\" onclick=\"pickAppDate('${c.date}')\">${c.day}</button>`;\r\n        }).join('')}\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction dateRangePickerHtml() {\r\n  return `\r\n    <div class=\"date-popover\" onclick=\"event.stopPropagation()\">\r\n      <div class=\"cal-wrap\">\r\n        ${calMonthHtml(appCalMonth)}\r\n        ${calMonthHtml(ymAdd(appCalMonth, 1))}\r\n      </div>\r\n      <div class=\"cal-footer\">\r\n        <div class=\"cal-presets\">\r\n          <button type=\"button\" class=\"cal-preset\" onclick=\"setAppRangePreset('7')\">近 7 天</button>\r\n          <button type=\"button\" class=\"cal-preset\" onclick=\"setAppRangePreset('month')\">本月</button>\r\n          <button type=\"button\" class=\"cal-preset\" onclick=\"clearAppDatePicker()\">清空</button>\r\n        </div>\r\n        <div style=\"display: flex; gap: 8px;\">\r\n          <button type=\"button\" class=\"btn btn-outline btn-sm\" onclick=\"closeAppDatePicker()\">取消</button>\r\n          <button type=\"button\" class=\"btn btn-primary btn-sm\" onclick=\"applyAppDatePicker()\">确定</button>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction appDocClick() {\r\n  appPickerOpen = false;\r\n  document.removeEventListener('click', appDocClick);\r\n  renderActiveView();\r\n}\r\nfunction toggleAppDatePicker() {\r\n  appPickerOpen = !appPickerOpen;\r\n  if (appPickerOpen) {\r\n    appTmpFrom = appFrom;\r\n    appTmpTo = appTo;\r\n    setTimeout(() => document.addEventListener('click', appDocClick), 0);\r\n  } else {\r\n    document.removeEventListener('click', appDocClick);\r\n  }\r\n  renderActiveView();\r\n}\r\nfunction closeAppDatePicker() {\r\n  appPickerOpen = false;\r\n  document.removeEventListener('click', appDocClick);\r\n  renderActiveView();\r\n}\r\nfunction applyAppDatePicker() {\r\n  appFrom = appTmpFrom;\r\n  appTo = appTmpTo;\r\n  appPickerOpen = false;\r\n  document.removeEventListener('click', appDocClick);\r\n  resetPage('apps');\r\n  renderActiveView();\r\n}\r\nfunction clearAppDatePicker() {\r\n  appTmpFrom = '';\r\n  appTmpTo = '';\r\n  renderActiveView();\r\n}\r\nfunction shiftAppCal(delta) {\r\n  appCalMonth = ymAdd(appCalMonth, delta);\r\n  renderActiveView();\r\n}\r\nfunction pickAppDate(date) {\r\n  if (!appTmpFrom || appTmpTo) {\r\n    appTmpFrom = date;\r\n    appTmpTo = '';\r\n  } else if (date < appTmpFrom) {\r\n    appTmpTo = appTmpFrom;\r\n    appTmpFrom = date;\r\n  } else {\r\n    appTmpTo = date;\r\n  }\r\n  renderActiveView();\r\n}\r\nfunction setAppRangePreset(type) {\r\n  const shift = offset => {\r\n    const d = new Date(REF_DATE + 'T00:00:00');\r\n    d.setDate(d.getDate() + offset);\r\n    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;\r\n  };\r\n  if (type === '7') {\r\n    appTmpFrom = shift(-6);\r\n    appTmpTo = REF_DATE;\r\n  } else if (type === 'month') {\r\n    appTmpFrom = REF_DATE.slice(0, 7) + '-01';\r\n    appTmpTo = REF_DATE;\r\n  }\r\n  renderActiveView();\r\n}\r\n\r\n// ==========================================\r\n// 2. 页面：合伙人管理 (PARTNER MANAGEMENT)\r\n// ==========================================\r\nlet listKw = '';\r\nlet listChannel = 'ALL';\r\nlet listStatus = 'ALL';\r\n\r\nfunction renderPartnerListView(container) {\r\n  let list = PARTNERS.filter(p => {\r\n    if (listChannel !== 'ALL' && p.channel_type !== listChannel) return false;\r\n    if (listStatus !== 'ALL' && p.status !== listStatus) return false;\r\n    if (listKw) {\r\n      const kw = listKw.toLowerCase();\r\n      return p.name.toLowerCase().includes(kw) || p.phone.includes(kw) || p.code.includes(kw) || p.org.toLowerCase().includes(kw);\r\n    }\r\n    return true;\r\n  });\r\n\r\n  const pagedRows = pagedList('partners', list);\r\n\r\n  container.innerHTML = `\r\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;\">\r\n      <div>\r\n        <h1 style=\"font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;\">合伙人管理</h1>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 筛选卡片 -->\r\n    <div class=\"filter-card\">\r\n      <div class=\"filter-title-row\">\r\n        <span class=\"filter-title\">筛选合伙人</span>\r\n        <button class=\"btn btn-outline btn-sm\" onclick=\"listKw=''; listChannel='ALL'; listStatus='ALL'; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))\">\r\n          <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg>\r\n          重置\r\n        </button>\r\n      </div>\r\n      <div class=\"filter-inputs-grid\">\r\n        <div class=\"filter-field\" style=\"flex: 2; min-width: 240px;\">\r\n          <span class=\"field-label\">关键词</span>\r\n          <input class=\"input-control\" type=\"text\" placeholder=\"合伙人姓名、完整手机号、4位推荐码、机构\" value=\"${listKw}\" oninput=\"listKw=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))\">\r\n        </div>\r\n        <div class=\"filter-field\" style=\"flex: 1;\">\r\n          <span class=\"field-label\">渠道类型</span>\r\n          <select class=\"input-control\" onchange=\"listChannel=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))\">\r\n            <option value=\"ALL\" ${listChannel==='ALL'?'selected':''}>全部渠道</option>\r\n            <option value=\"INTERNAL\" ${listChannel==='INTERNAL'?'selected':''}>内部渠道 (员工/顾问)</option>\r\n            <option value=\"EXTERNAL\" ${listChannel==='EXTERNAL'?'selected':''}>外部渠道 (高校/博主)</option>\r\n          </select>\r\n        </div>\r\n        <div class=\"filter-field\" style=\"flex: 1;\">\r\n          <span class=\"field-label\">账号状态</span>\r\n          <select class=\"input-control\" onchange=\"listStatus=this.value; resetPage('partners'); renderPartnerListView(document.getElementById('main-view-container'))\">\r\n            <option value=\"ALL\" ${listStatus==='ALL'?'selected':''}>全部状态</option>\r\n            <option value=\"NORMAL\" ${listStatus==='NORMAL'?'selected':''}>正常</option>\r\n            <option value=\"FROZEN\" ${listStatus==='FROZEN'?'selected':''}>已冻结</option>\r\n          </select>\r\n        </div>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 数据表格 -->\r\n    <div class=\"table-container\">\r\n      <table class=\"official-table\">\r\n        <thead>\r\n          <tr>\r\n            <th>合伙人姓名</th>\r\n            <th>账号状态</th>\r\n            <th>单位</th>\r\n            <th>手机号</th>\r\n            <th>渠道</th>\r\n            <th>推荐码</th>\r\n            <th>首购 / 续购比例</th>\r\n            <th>总销售额</th>\r\n            <th>累计总金额</th>\r\n            <th>加入时间</th>\r\n            <th class=\"col-sticky\" style=\"text-align: right;\">操作</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody>\r\n          ${list.length === 0 ? `\r\n            <tr><td colspan=\"11\" style=\"text-align:center; padding:48px; color:var(--muted-foreground);\">暂无符合筛选条件的合伙人</td></tr>\r\n          ` : pagedRows.map(p => `\r\n            <tr>\r\n              <td><span style=\"font-weight: 600;\">${p.name}</span></td>\r\n              <td>\r\n                ${p.status === 'NORMAL' ? '<span class=\"badge badge-success\">正常</span>' : ''}\r\n                ${p.status === 'FROZEN' ? '<span class=\"badge badge-warning\" title=\"'+p.freeze_reason+'\">已冻结</span>' : ''}\r\n              </td>\r\n              <td><div style=\"font-size: 12px; color: var(--muted-foreground); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">${p.org}</div></td>\r\n              <td><strong class=\"num\">${p.phone}</strong></td>\r\n              <td>\r\n                ${p.channel_type === 'INTERNAL' ? '<span class=\"badge badge-blue\">内部</span>' : '<span class=\"badge badge-neutral\">外部</span>'}\r\n              </td>\r\n              <td><span class=\"code-badge\">${p.code}</span>${p.status === 'FROZEN' ? '<div style=\"font-size:10.5px; color:var(--destructive); margin-top:2px;\">已失效</div>' : ''}</td>\r\n              <td><strong class=\"num\">${p.first_rate}%</strong> <span style=\"font-size:11px; color:var(--muted-foreground);\">/ 续 ${p.renew_rate}%</span></td>\r\n              <td><strong class=\"num\">¥${formatNum(partnerSales(p))}</strong></td>\r\n              <td><strong class=\"num\">¥${fmtC(p.points.total)}</strong></td>\r\n              <td style=\"color: var(--muted-foreground); font-size: 12px;\">${p.join_time.split(' ')[0]}</td>\r\n              <td class=\"col-sticky\" style=\"text-align: right;\">\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"navigate('partner/${p.id}/orders')\">详情</button>\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"openModifyRateModal('${p.id}')\">改比例</button>\r\n                ${p.status === 'FROZEN' ? `\r\n                  <button class=\"btn btn-outline btn-sm\" style=\"color: #15803D;\" onclick=\"unfreezePartner('${p.id}')\">解冻</button>\r\n                ` : ''}\r\n              </td>\r\n            </tr>\r\n          `).join('')}\r\n        </tbody>\r\n      </table>\r\n      ${pagerBar('partners', list.length)}\r\n    </div>\r\n  `;\r\n}\r\n\r\n// ==========================================\r\n// 3. 页面：合伙人详情穿透页 (PARTNER DETAIL)\r\n// ==========================================\r\nfunction renderPartnerDetailView(container, p, activeTab = 'orders') {\r\n  if (!['orders', 'settlements'].includes(activeTab)) activeTab = 'orders';\r\n  container.innerHTML = `\r\n    <!-- 顶部导航 -->\r\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;\">\r\n      <div>\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground); margin-bottom: 4px;\">\r\n          <a onclick=\"navigate('list')\" style=\"color: var(--muted-foreground); text-decoration:none; cursor:pointer;\">合伙人管理</a>\r\n          <span style=\"margin: 0 4px\">/</span>\r\n          <span>档案详情</span>\r\n        </div>\r\n        <h1 style=\"font-size: 24px; font-weight: 700; color: var(--foreground); display: flex; align-items: center; gap: 10px;\">\r\n          ${p.name}\r\n          ${p.channel_type === 'INTERNAL' ? '<span class=\"badge badge-blue\">内部渠道</span>' : '<span class=\"badge badge-neutral\">外部渠道</span>'}\r\n          ${p.status === 'NORMAL' ? '<span class=\"badge badge-success\">正常</span>' : ''}\r\n          ${p.status === 'FROZEN' ? '<span class=\"badge badge-warning\">已冻结</span>' : ''}\r\n        </h1>\r\n        <div style=\"font-size: 13px; color: var(--muted-foreground); margin-top: 4px;\">\r\n          ${p.org} · 加入时间: ${p.join_time}\r\n        </div>\r\n      </div>\r\n\r\n      <div style=\"display: flex; gap: 8px;\">\r\n        <button class=\"btn btn-outline btn-sm\" onclick=\"openModifyRateModal('${p.id}')\">修改分成比例</button>\r\n        ${p.status === 'NORMAL' ? `\r\n          <button class=\"btn btn-outline btn-sm\" style=\"color:#A16207;\" onclick=\"openFreezeModal('${p.id}')\">冻结账号</button>\r\n        ` : `\r\n          <button class=\"btn btn-outline btn-sm\" style=\"color:#15803D;\" onclick=\"unfreezePartner('${p.id}')\">解冻恢复</button>\r\n        `}\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 核心数据汇总卡片 -->\r\n    <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px;\">\r\n      <div class=\"content-card\" style=\"margin-bottom:0; padding:16px 18px;\">\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground);\">累计总金额 (扣除退款)</div>\r\n        <div style=\"font-size: 24px; font-weight: 700; margin-top: 4px;\" class=\"num\">¥${fmtC(p.points.total)}</div>\r\n        <div style=\"font-size: 11px; color: var(--muted-foreground); margin-top: 4px;\">历史净产生佣金总额</div>\r\n      </div>\r\n      <div class=\"content-card\" style=\"margin-bottom:0; padding:16px 18px;\">\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground);\">当前可结算金额</div>\r\n        <div style=\"font-size: 24px; font-weight: 700; color: #15803D; margin-top: 4px;\" class=\"num\">¥${fmtC(p.points.withdrawable)}</div>\r\n        <div style=\"font-size: 11px; color: var(--muted-foreground); margin-top: 4px;\">随时可线下打款核销</div>\r\n      </div>\r\n      <div class=\"content-card\" style=\"margin-bottom:0; padding:16px 18px;\">\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground);\">冻结中金额</div>\r\n        <div style=\"font-size: 24px; font-weight: 700; color: #A16207; margin-top: 4px;\" class=\"num\">¥${fmtC(p.points.frozen)}</div>\r\n        <div style=\"font-size: 11px; color: var(--muted-foreground); margin-top: 4px;\">到期 T+7 自动解冻</div>\r\n      </div>\r\n      <div class=\"content-card\" style=\"margin-bottom:0; padding:16px 18px;\">\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground);\">累计已结算金额</div>\r\n        <div style=\"font-size: 24px; font-weight: 700; color: var(--foreground); margin-top: 4px;\" class=\"num\">¥${fmtC(p.points.settled)}</div>\r\n        <div style=\"font-size: 11px; color: var(--muted-foreground); margin-top: 4px;\">财务已转账核销履约</div>\r\n      </div>\r\n      <div class=\"content-card\" style=\"margin-bottom:0; padding:16px 18px;\">\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground);\">待追回金额 (异常)</div>\r\n        <div style=\"font-size: 24px; font-weight: 700; color: ${p.points.unrecovered > 0 ? 'var(--destructive)' : 'var(--muted-foreground)'}; margin-top: 4px;\" class=\"num\">\r\n          ¥${fmtC(p.points.unrecovered)}\r\n        </div>\r\n        <div style=\"font-size: 11px; color: var(--muted-foreground); margin-top: 4px;\">${p.points.unrecovered > 0 ? '需在下期打款中扣减' : '账目正常无欠款'}</div>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 档案基础 KV 卡片 -->\r\n    <div class=\"content-card\" style=\"padding: 16px 20px; margin-bottom: 22px;\">\r\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; font-size: 13px;\">\r\n        <div>\r\n          <span style=\"color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;\">手机号码</span>\r\n          <strong class=\"num\">${p.phone}</strong>\r\n        </div>\r\n        <div>\r\n          <span style=\"color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;\">专属推荐码 (4位)</span>\r\n          <span class=\"code-badge\">${p.code}</span>\r\n        </div>\r\n        <div>\r\n          <span style=\"color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;\">当前分成比例（首购 / 续购）</span>\r\n          <strong class=\"num\">${p.first_rate}% / ${p.renew_rate}%</strong>\r\n        </div>\r\n        <div>\r\n          <span style=\"color: var(--muted-foreground); font-size: 12px; display:block; margin-bottom:2px;\">微信号</span>\r\n          <span>${p.wx || '-'}</span>\r\n        </div>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 分段明细选项卡 -->\r\n    <div class=\"segmented-tabs\">\r\n      <button class=\"seg-tab-btn ${activeTab==='orders'?'active':''}\" onclick=\"navigate('partner/${p.id}/orders')\">\r\n        归属订单\r\n      </button>\r\n      <button class=\"seg-tab-btn ${activeTab==='settlements'?'active':''}\" onclick=\"navigate('partner/${p.id}/settlements')\">\r\n        线下结算历史\r\n      </button>\r\n    </div>\r\n\r\n    <!-- 表格内容 -->\r\n    <div class=\"table-container\">\r\n      ${renderDetailTabTable(p, activeTab)}\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction renderDetailTabTable(p, tab) {\r\n  if (tab === 'orders') {\r\n    const key = 'det-orders-' + p.id;\r\n    const rows = pagedList(key, p.orders);\r\n    return `\r\n      <table class=\"official-table\">\r\n        <thead>\r\n          <tr>\r\n            <th>订单编号</th>\r\n            <th>下单客户 / 机构</th>\r\n            <th>商品名称</th>\r\n            <th>订单状态</th>\r\n            <th>订单金额</th>\r\n            <th>分成比例</th>\r\n            <th>本单佣金</th>\r\n            <th>下单时间</th>\r\n            <th class=\"col-sticky\" style=\"text-align:right;\">操作</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody>\r\n          ${p.orders.length === 0 ? '<tr><td colspan=\"9\" style=\"text-align:center; padding:32px; color:var(--muted-foreground);\">暂无归属订单</td></tr>' : rows.map(o => {\r\n            const lines = orderLines(o, p);\r\n            const netPoints = Math.max(0, o.points - (o._recover || 0));\r\n            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';\r\n            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';\r\n            const payBadge = isRefund\r\n              ? '<span class=\"badge badge-danger\" style=\"font-size:10.5px;\">已退款</span>'\r\n              : '<span class=\"badge badge-success\" style=\"font-size:10.5px;\">已支付</span>';\r\n            const isOrg = o.kind === 'ORG';\r\n            return `<tr>\r\n              <td><span class=\"code-badge\">${o.id}</span></td>\r\n              <td>${isOrg ? `<strong>${o.org_name}</strong>` : `<strong class=\"num\">${o.customer_phone}</strong>`}</td>\r\n              <td style=\"font-size:12.5px;\">${productName(o)}<div style=\"margin-top:3px;\">${productTagHtml(o)}${o.months ? ` <span class=\"badge badge-neutral\" style=\"font-size:10px;\">${o.months} 个月服务期</span>` : ''}</div></td>\r\n              <td>${payBadge}</td>\r\n              <td class=\"num\">¥${formatNum(o.pay_amount - refunded)}${refunded > 0 ? `<div style=\"font-size:10.5px; color:var(--muted-foreground); margin-top:2px;\">已退 ¥${formatNum(refunded)}</div>` : ''}</td>\r\n              <td class=\"num\">${o.rate}%</td>\r\n              <td><strong class=\"num\" style=\"color:${pc};\">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong></td>\r\n              <td class=\"num\" style=\"color:var(--muted-foreground); font-size:11.5px;\">${o.created_at || o.start}</td>\r\n              <td class=\"col-sticky\" style=\"text-align:right; white-space:nowrap;\">\r\n                ${lines.length ? `<button class=\"btn btn-outline btn-sm\" onclick=\"showOrderLines('${o.id}')\">分期明细</button>` : ''}\r\n                ${o.points > 0 && refunded < o.pay_amount ? `<button class=\"btn btn-outline btn-sm\" onclick=\"openRefundDrawer('${o.id}')\">退款登记</button>` : ''}\r\n              </td>\r\n            </tr>`;\r\n          }).join('')}\r\n        </tbody>\r\n      </table>\r\n      ${pagerBar(key, p.orders.length)}\r\n    `;\r\n  }\r\n\r\n  if (tab === 'settlements') {\r\n    const key = 'det-settle-' + p.id;\r\n    const rows = pagedList(key, p.settlements);\r\n    return `\r\n      <table class=\"official-table\">\r\n        <thead>\r\n          <tr>\r\n            <th>结算单号</th>\r\n            <th>核销金额</th>\r\n            <th>财务打款凭证号</th>\r\n            <th>经办人</th>\r\n            <th>核销时间</th>\r\n            <th>打款备注说明</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody>\r\n          ${p.settlements.length === 0 ? '<tr><td colspan=\"6\" style=\"text-align:center; padding:32px; color:var(--muted-foreground);\">暂无核销记录</td></tr>' :\r\n          rows.map(s => `\r\n            <tr>\r\n              <td><span class=\"code-badge\">${s.batch_no}</span></td>\r\n              <td><strong class=\"num\" style=\"color: #15803D;\">-¥${fmtC(s.points)}</strong></td>\r\n              <td><span class=\"code-badge\">${s.voucher}</span></td>\r\n              <td>${s.operator}</td>\r\n              <td style=\"color: var(--muted-foreground); font-size:12px;\">${s.time}</td>\r\n              <td style=\"color: var(--muted-foreground); font-size:12px;\">${s.remark}</td>\r\n            </tr>\r\n          `).join('')}\r\n        </tbody>\r\n      </table>\r\n      ${pagerBar(key, p.settlements.length)}\r\n    `;\r\n  }\r\n\r\n  return '';\r\n}\r\n\r\n// ==========================================\r\n// 4. 页面：结算管理 (SETTLEMENTS)\r\n// ==========================================\r\nlet settleSubTab = 'pending';\r\nlet settleKw = '';\r\n\r\nfunction renderSettlementsView(container) {\r\n  const pendingPartners = PARTNERS.filter(p => p.points.withdrawable > 0);\r\n  const tabBtn = (key, label) => `<button class=\"seg-tab-btn ${settleSubTab === key ? 'active' : ''}\" onclick=\"settleSubTab='${key}'; renderSettlementsView(document.getElementById('main-view-container'))\">${label}</button>`;\r\n  const headerBtn = '';\r\n\r\n  let body = '';\r\n  if (settleSubTab === 'pending') {\r\n    const pagedPending = pagedList('settle-pending', pendingPartners);\r\n    body = `\r\n      <div class=\"table-container\">\r\n        <table class=\"official-table\">\r\n          <thead><tr>\r\n            <th>合伙人姓名</th><th>单位</th><th>手机号</th><th>渠道</th><th>账号状态</th><th>可结算金额</th><th>最早解冻日</th>\r\n            <th class=\"col-sticky\" style=\"text-align:right;\">操作</th>\r\n          </tr></thead>\r\n          <tbody>\r\n            ${pendingPartners.length === 0 ? '<tr><td colspan=\"8\" style=\"text-align:center; padding:32px; color:var(--muted-foreground);\">暂无可结算明细</td></tr>' : pagedPending.map(p => {\r\n              const ls = partnerLines(p).filter(l => l.state === 'UNLOCKED');\r\n              const earliest = ls.map(l => l.unlock).sort()[0];\r\n              return `<tr>\r\n                <td><strong>${p.name}</strong></td>\r\n                <td style=\"font-size:12px; color:var(--muted-foreground);\">${p.org}</td>\r\n                <td><span class=\"num\">${p.phone}</span></td>\r\n                <td>${p.channel_type === 'INTERNAL' ? '<span class=\"badge badge-blue\">内部</span>' : '<span class=\"badge badge-neutral\">外部</span>'}</td>\r\n                <td>${p.status === 'NORMAL' ? '<span class=\"badge badge-success\">正常</span>' : '<span class=\"badge badge-warning\" title=\"账号已冻结，请审慎核销\">已冻结</span>'}</td>\r\n                <td><strong class=\"num\" style=\"color:#15803D; font-size:15px;\">¥${fmtC(p.points.withdrawable)}</strong></td>\r\n                <td style=\"color:var(--muted-foreground); font-size:12px;\">${earliest}</td>\r\n                <td class=\"col-sticky\" style=\"text-align:right;\">${p.status === 'FROZEN'\r\n                  ? `<button class=\"btn btn-outline btn-sm\" disabled title=\"该合伙人账号已冻结，请先解冻账号\">不可结算</button>`\r\n                  : `<button class=\"btn btn-primary btn-sm\" onclick=\"openSettleSheet('${p.id}')\">核对并结算</button>`}</td>\r\n              </tr>`; }).join('')}\r\n          </tbody>\r\n        </table>\r\n        ${pagerBar('settle-pending', pendingPartners.length)}\r\n      </div>`;\r\n  } else {\r\n    const pagedHistory = pagedList('settle-history', SETTLEMENT_HISTORY);\r\n    body = `\r\n      <div class=\"table-container\">\r\n        <table class=\"official-table\">\r\n          <thead><tr><th>结算单号</th><th>合伙人姓名</th><th>手机号</th><th>渠道</th><th>结算金额</th><th>财务打款凭证号</th><th>经办人</th><th>核销时间</th><th>打款备注</th><th class=\"col-sticky\" style=\"text-align:right;\">操作</th></tr></thead>\r\n          <tbody>${pagedHistory.map(s => {\r\n            return `<tr>\r\n              <td><span class=\"code-badge\">${s.settle_id}</span>${s.imported ? '<div><span class=\"badge badge-neutral\" style=\"font-size:10.5px;\">录入时已发放</span></div>' : ''}</td>\r\n              <td><strong>${s.partner_name}</strong></td>\r\n              <td><span class=\"num\">${s.partner_phone}</span></td>\r\n              <td>${s.channel_type === 'INTERNAL' ? '<span class=\"badge badge-blue\">内部</span>' : '<span class=\"badge badge-neutral\">外部</span>'}</td>\r\n              <td><strong class=\"num\" style=\"color:#15803D;\">-¥${fmtC(s.points)}</strong></td>\r\n              <td><span class=\"code-badge\">${s.voucher}</span></td>\r\n              <td>${s.operator}</td>\r\n              <td style=\"color:var(--muted-foreground); font-size:12px;\">${s.settle_time}</td>\r\n              <td style=\"color:var(--muted-foreground); font-size:12px; max-width:200px;\" title=\"${esc(s.remark)}\">${esc(s.remark)}</td>\r\n              <td class=\"col-sticky\" style=\"text-align:right; white-space:nowrap;\">\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"openSettleDetail('${s.settle_id}')\">查看明细</button>\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"navigate('partner/${s.partner_id}/settlements')\">合伙人详情</button>\r\n              </td></tr>`; }).join('')}\r\n          </tbody>\r\n        </table>\r\n        ${pagerBar('settle-history', SETTLEMENT_HISTORY.length)}\r\n      </div>`;\r\n  }\r\n\r\n  container.innerHTML = `\r\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;\">\r\n      <div>\r\n        <h1 style=\"font-size:24px; font-weight:700; color:var(--foreground); letter-spacing:-0.02em;\">结算管理</h1>\r\n      </div>\r\n      <div>${headerBtn}</div>\r\n    </div>\r\n    <div class=\"segmented-tabs\">\r\n      ${tabBtn('pending', '待结算')}\r\n      ${tabBtn('history', '结算历史')}\r\n    </div>\r\n    ${body}\r\n  `;\r\n}\r\n\r\n// ==========================================\r\n// 4.5 页面：订单管理 (ORDERS)\r\n// ==========================================\r\nlet orderSubTab = 'user';\r\nlet ordKw = '';\r\nlet ordStatus = 'ALL';\r\n\r\nfunction ordIsRefunded(o) {\r\n  return (o.refunds || []).length > 0 || o.status === 'VOID_REFUND';\r\n}\r\n\r\nfunction allUserOrders() {\r\n  const r = [];\r\n  PARTNERS.forEach(p => p.orders.forEach(o => { if (orderKind(o) !== 'ORG') r.push({ p, o, lines: orderLines(o, p) }); }));\r\n  return r.sort((a, b) => (b.o.created_at || '').localeCompare(a.o.created_at || ''));\r\n}\r\n\r\nfunction renderOrdersView(container) {\r\n  const userOrders = allUserOrders();\r\n  const orgOrders = allOrgOrders();\r\n  const tabBtn = (key, label) => `<button class=\"seg-tab-btn ${orderSubTab === key ? 'active' : ''}\" onclick=\"orderSubTab='${key}'; resetPage('orders-user'); resetPage('orders-org'); renderOrdersView(document.getElementById('main-view-container'))\">${label}</button>`;\r\n  const headerBtn = orderSubTab === 'user'\r\n    ? ''\r\n    : `<button class=\"btn btn-primary\" onclick=\"openOrgEntryDrawer()\">＋ 录入机构订单</button>`;\r\n  let body = '';\r\n  if (orderSubTab === 'user') {\r\n    const kw = ordKw.trim().toLowerCase();\r\n    const filteredUserOrders = userOrders.filter(({ p, o }) => {\r\n      if (ordStatus === 'PAID' && ordIsRefunded(o)) return false;\r\n      if (ordStatus === 'REFUNDED' && !ordIsRefunded(o)) return false;\r\n      if (!kw) return true;\r\n      return o.id.toLowerCase().includes(kw)\r\n        || o.customer_phone.includes(kw)\r\n        || p.name.toLowerCase().includes(kw);\r\n    });\r\n    const filteredUserPay = filteredUserOrders.reduce((a, { o }) => {\r\n      const refunded = (o.refunds || []).reduce((s, r) => s + r.amount, 0);\r\n      return a + Math.max(0, o.status === 'VOID_REFUND' ? 0 : (o.pay_amount || 0) - refunded);\r\n    }, 0);\r\n    const filteredUserPoints = filteredUserOrders.reduce((a, { o }) => a + Math.max(0, (o.points || 0) - (o._recover || 0)), 0);\r\n    const pagedUserOrders = pagedList('orders-user', filteredUserOrders);\r\n    body = `\r\n      <div class=\"filter-card\">\r\n        <div class=\"filter-title-row\">\r\n          <span class=\"filter-title\">筛选订单</span>\r\n          <button class=\"btn btn-outline btn-sm\" onclick=\"ordKw=''; ordStatus='ALL'; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))\">重置</button>\r\n        </div>\r\n        <div class=\"filter-inputs-grid\">\r\n          <div class=\"filter-field\" style=\"flex: 2; min-width: 280px;\">\r\n            <span class=\"field-label\">关键词</span>\r\n            <input class=\"input-control\" type=\"text\" placeholder=\"订单编号、客户手机号、合伙人姓名\" value=\"${ordKw}\" oninput=\"ordKw=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))\">\r\n          </div>\r\n          <div class=\"filter-field\" style=\"flex: 1;\">\r\n            <span class=\"field-label\">订单状态</span>\r\n            <select class=\"input-control\" onchange=\"ordStatus=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))\">\r\n              <option value=\"ALL\" ${ordStatus==='ALL'?'selected':''}>全部状态</option>\r\n              <option value=\"PAID\" ${ordStatus==='PAID'?'selected':''}>已支付</option>\r\n              <option value=\"REFUNDED\" ${ordStatus==='REFUNDED'?'selected':''}>已退款</option>\r\n            </select>\r\n          </div>\r\n        </div>\r\n      </div>\r\n      <div style=\"background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-xl); padding:14px 20px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:28px; align-items:center; font-size:13px;\">\r\n        <div>订单总数 <strong class=\"num\">${filteredUserOrders.length}</strong> 笔</div>\r\n        <div>总销售金额 <strong class=\"num\">¥${formatNum(filteredUserPay)}</strong></div>\r\n        <div>佣金合计 <strong class=\"num\">${filteredUserPoints < 0 ? '-¥' + fmtC(Math.abs(filteredUserPoints)) : '¥' + fmtC(filteredUserPoints)}</strong></div>\r\n      </div>\r\n      <div class=\"table-container\">\r\n        <table class=\"official-table\">\r\n          <thead><tr><th>订单编号</th><th>下单客户</th><th>商品名称</th><th>归属合伙人</th><th>订单状态</th><th>订单金额</th><th>分成比例</th><th>本单佣金</th><th>下单时间</th><th class=\"col-sticky\" style=\"text-align:right;\">操作</th></tr></thead>\r\n          <tbody>${filteredUserOrders.length === 0 ? '<tr><td colspan=\"10\" style=\"text-align:center; padding:32px; color:var(--muted-foreground);\">没有符合条件的订单</td></tr>' : pagedUserOrders.map(({ p, o, lines }) => {\r\n            const netPoints = Math.max(0, o.points - (o._recover || 0));\r\n            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';\r\n            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';\r\n            const payBadge = isRefund\r\n              ? '<span class=\"badge badge-danger\" style=\"font-size:10.5px;\">已退款</span>'\r\n              : '<span class=\"badge badge-success\" style=\"font-size:10.5px;\">已支付</span>';\r\n            return `<tr>\r\n              <td><span class=\"code-badge\">${o.id}</span></td>\r\n              <td><strong class=\"num\">${o.customer_phone}</strong></td>\r\n              <td style=\"font-size:12.5px;\">${productName(o)}<div style=\"margin-top:3px;\">${productTagHtml(o)}</div></td>\r\n              <td><strong>${p.name}</strong><div style=\"font-size:11.5px; color:var(--muted-foreground);\">${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道</div></td>\r\n              <td>${payBadge}</td>\r\n              <td class=\"num\">¥${formatNum(o.pay_amount - refunded)}${refunded > 0 ? `<div style=\"font-size:10.5px; color:var(--muted-foreground); margin-top:2px;\">已退 ¥${formatNum(refunded)}</div>` : ''}</td>\r\n              <td class=\"num\">${o.rate}%</td>\r\n              <td><strong class=\"num\" style=\"color:${pc};\">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong></td>\r\n              <td class=\"num\" style=\"color:var(--muted-foreground); font-size:11.5px;\">${o.created_at}</td>\r\n              <td class=\"col-sticky\" style=\"text-align:right; white-space:nowrap;\">\r\n                ${lines.length ? `<button class=\"btn btn-outline btn-sm\" onclick=\"showOrderLines('${o.id}')\">分期明细</button>` : ''}\r\n                ${o.points > 0 && refunded < o.pay_amount ? `<button class=\"btn btn-outline btn-sm\" onclick=\"openRefundDrawer('${o.id}')\">退款登记</button>` : ''}\r\n              </td></tr>`; }).join('')}\r\n          </tbody>\r\n        </table>\r\n        ${pagerBar('orders-user', userOrders.length)}\r\n      </div>`;\r\n  } else {\r\n    const pagedOrgOrders = pagedList('orders-org', orgOrders);\r\n    body = `\r\n      <div class=\"content-card\" style=\"padding:14px 20px; margin-bottom:16px; font-size:12.5px; color:var(--muted-foreground); line-height:1.7;\">\r\n        机构版为线下签合同，由运营<strong style=\"color:var(--foreground);\">手动录入</strong>：合同金额、分成比例、服务周期、已发放金额。录入后与年卡规则一致，按月分期解冻（服务月结束 +7 天）；解冻后的明细在「结算管理 · 待结算」中统一核对结算。\r\n      </div>\r\n      <div class=\"table-container\">\r\n        <table class=\"official-table\">\r\n          <thead><tr><th>订单编号</th><th>机构名称</th><th>商品名称</th><th>合伙人</th><th>订单状态</th><th>订单金额</th><th>分成比例</th><th>本单佣金</th><th>下单时间</th><th class=\"col-sticky\" style=\"text-align:right;\">操作</th></tr></thead>\r\n          <tbody>${orgOrders.length === 0 ? '<tr><td colspan=\"10\" style=\"text-align:center; padding:32px; color:var(--muted-foreground);\">暂无机构订单，点击右上角「录入机构订单」</td></tr>' : pagedOrgOrders.map(({ p, o, lines }) => {\r\n            const netPoints = Math.max(0, o.points - (o._recover || 0));\r\n            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n            const payBadge = (refunded > 0 || o.status === 'VOID_REFUND')\r\n              ? '<span class=\"badge badge-danger\" style=\"font-size:10.5px;\">已退款</span>'\r\n              : '<span class=\"badge badge-success\" style=\"font-size:10.5px;\">已支付</span>';\r\n            return `<tr>\r\n              <td><span class=\"code-badge\">${o.id}</span></td>\r\n              <td><strong>${o.org_name}</strong></td>\r\n              <td style=\"font-size:12.5px;\">${productName(o)}<div style=\"margin-top:3px;\">${productTagHtml(o)} <span class=\"badge badge-neutral\" style=\"font-size:10px;\">${o.months} 个月服务期</span></div></td>\r\n              <td><strong>${p.name}</strong><div style=\"font-size:11.5px; color:var(--muted-foreground);\">${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道</div></td>\r\n              <td>${payBadge}</td>\r\n              <td class=\"num\">¥${formatNum(o.pay_amount - refunded)}${refunded > 0 ? `<div style=\"font-size:10.5px; color:var(--muted-foreground); margin-top:2px;\">已退 ¥${formatNum(refunded)}</div>` : ''}</td>\r\n              <td class=\"num\">${o.rate}%</td>\r\n              <td><strong class=\"num\" style=\"color:${netPoints > 0 ? '#15803D' : 'var(--muted-foreground)'};\">${netPoints > 0 ? '+¥' : '¥'}${fmtC(Math.abs(netPoints))}</strong></td>\r\n              <td class=\"num\" style=\"color:var(--muted-foreground); font-size:11.5px;\">${o.created_at || o.start}</td>\r\n              <td class=\"col-sticky\" style=\"text-align:right; white-space:nowrap;\">\r\n                <button class=\"btn btn-outline btn-sm\" onclick=\"showOrderLines('${o.id}')\">分期明细</button>\r\n                ${o.points > 0 && refunded < o.pay_amount ? `<button class=\"btn btn-outline btn-sm\" onclick=\"openRefundDrawer('${o.id}')\">退款登记</button>` : ''}\r\n              </td></tr>`; }).join('')}\r\n          </tbody>\r\n        </table>\r\n        ${pagerBar('orders-org', orgOrders.length)}\r\n      </div>`;\r\n  }\r\n\r\n  container.innerHTML = `\r\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;\">\r\n      <div>\r\n        <h1 style=\"font-size:24px; font-weight:700; color:var(--foreground); letter-spacing:-0.02em;\">订单管理</h1>\r\n      </div>\r\n      <div>${headerBtn}</div>\r\n    </div>\r\n    <div class=\"segmented-tabs\">\r\n      ${tabBtn('user', '用户订单')}\r\n      ${tabBtn('org', '机构订单')}\r\n    </div>\r\n    ${body}\r\n  `;\r\n}\r\n\r\n// ==========================================\r\n// 5. 页面：数据报表 (REPORTS - 第二批)\r\n// ==========================================\r\nlet reportPeriod = 'MONTH';\r\n\r\nfunction renderReportsView(container) {\r\n  container.innerHTML = `\r\n    <!-- 标题区 -->\r\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;\">\r\n      <div>\r\n        <div style=\"font-size: 12px; color: var(--muted-foreground); margin-bottom: 4px;\">管理后台 · 渠道经营质量对比与激励风云榜</div>\r\n        <h1 style=\"font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;\">数据报表中心</h1>\r\n      </div>\r\n      <div style=\"display: flex; gap: 8px;\">\r\n        <select class=\"input-control\" onchange=\"reportPeriod=this.value; renderReportsView(document.getElementById('main-view-container'))\">\r\n          <option value=\"MONTH\" ${reportPeriod==='MONTH'?'selected':''}>本月度 (2026年11月)</option>\r\n          <option value=\"QUARTER\" ${reportPeriod==='QUARTER'?'selected':''}>本季度 (2026 Q4)</option>\r\n          <option value=\"YEAR\" ${reportPeriod==='YEAR'?'selected':''}>本年度 (2026 全年)</option>\r\n        </select>\r\n        <button class=\"btn btn-outline\" onclick=\"toast('渠道月度报表已成功导出')\">导出月度报表</button>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 宏观渠道对比大盘 (1:1 官方双卡片排布) -->\r\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;\">\r\n      <!-- 内部渠道 -->\r\n      <div class=\"content-card\" style=\"margin-bottom:0;\">\r\n        <div class=\"card-header-bar\">\r\n          <span class=\"card-header-title\">内部渠道大盘 (员工/顾问)</span>\r\n          <span class=\"badge badge-blue\">基准 15.0%</span>\r\n        </div>\r\n        <div class=\"card-body-padding\">\r\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">在册合伙人</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">1 <span style=\"font-size:12px; font-weight:normal; color:var(--muted-foreground);\">人</span></div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">发展客户总数</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">42 <span style=\"font-size:12px; font-weight:normal; color:var(--muted-foreground);\">人</span></div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">带单成交 GMV</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥34,130</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">产生佣金总额</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥5,120</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">单客客单价</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥2,133</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">年卡转化率</div>\r\n              <div style=\"font-size:20px; font-weight:700; color:#15803D; margin-top:2px;\" class=\"num\">38.1%</div>\r\n            </div>\r\n          </div>\r\n        </div>\r\n      </div>\r\n\r\n      <!-- 外部渠道 -->\r\n      <div class=\"content-card\" style=\"margin-bottom:0;\">\r\n        <div class=\"card-header-bar\">\r\n          <span class=\"card-header-title\">外部渠道大盘 (高校/博主)</span>\r\n          <span class=\"badge badge-neutral\">基准 30.0%</span>\r\n        </div>\r\n        <div class=\"card-body-padding\">\r\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">在册合伙人</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">3 <span style=\"font-size:12px; font-weight:normal; color:var(--muted-foreground);\">人</span></div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">发展客户总数</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">34 <span style=\"font-size:12px; font-weight:normal; color:var(--muted-foreground);\">人</span></div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">带单成交 GMV</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥41,800</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">产生佣金总额</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥9,490</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">单客客单价</div>\r\n              <div style=\"font-size:20px; font-weight:700; margin-top:2px;\" class=\"num\">¥3,483</div>\r\n            </div>\r\n            <div>\r\n              <div style=\"font-size:12px; color:var(--muted-foreground);\">年卡转化率</div>\r\n              <div style=\"font-size:20px; font-weight:700; color:#15803D; margin-top:2px;\" class=\"num\">44.1%</div>\r\n            </div>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 合伙人业绩风云榜 -->\r\n    <div class=\"table-container\">\r\n      <div class=\"table-toolbar\">\r\n        <div class=\"table-summary-text\"><strong>合伙人业绩风云榜 (TOP 带单榜)</strong></div>\r\n      </div>\r\n      <table class=\"official-table\">\r\n        <thead>\r\n          <tr>\r\n            <th style=\"width: 70px;\">排名</th>\r\n            <th>合伙人姓名 / 单位</th>\r\n            <th>手机号码</th>\r\n            <th>渠道分类</th>\r\n            <th>分成比例</th>\r\n            <th>带单有效订单数</th>\r\n            <th>带单成交金额 (GMV)</th>\r\n            <th>贡献总金额 (元)</th>\r\n            <th class=\"col-sticky\" style=\"text-align: right;\">档案穿透</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody>\r\n          <tr>\r\n            <td><span class=\"badge badge-warning\" style=\"font-weight:700;\">TOP 1</span></td>\r\n            <td><strong>李维国</strong> (北京航空航天大学计算机学院)</td>\r\n            <td><strong class=\"num\">13700001111</strong></td>\r\n            <td><span class=\"badge badge-neutral\">外部渠道</span></td>\r\n            <td><span class=\"num\">30.0%</span></td>\r\n            <td><span class=\"num\">7</span> 单</td>\r\n            <td><strong class=\"num\">¥24,630.00</strong></td>\r\n            <td><strong class=\"num\" style=\"color: #15803D;\">¥7,390</strong></td>\r\n            <td class=\"col-sticky\" style=\"text-align: right;\">\r\n              <button class=\"btn btn-outline btn-sm\" onclick=\"navigate('partner/PT-8866/orders')\">查看明细 →</button>\r\n            </td>\r\n          </tr>\r\n          <tr>\r\n            <td><span class=\"badge badge-blue\" style=\"font-weight:700;\">TOP 2</span></td>\r\n            <td><strong>宋建华</strong> (立理科技战略创新部)</td>\r\n            <td><strong class=\"num\">13800002222</strong></td>\r\n            <td><span class=\"badge badge-blue\">内部渠道</span></td>\r\n            <td><span class=\"num\">15.0%</span></td>\r\n            <td><span class=\"num\">16</span> 单</td>\r\n            <td><strong class=\"num\">¥34,130.00</strong></td>\r\n            <td><strong class=\"num\" style=\"color: #15803D;\">¥5,120</strong></td>\r\n            <td class=\"col-sticky\" style=\"text-align: right;\">\r\n              <button class=\"btn btn-outline btn-sm\" onclick=\"navigate('partner/PT-6601/orders')\">查看明细 →</button>\r\n            </td>\r\n          </tr>\r\n          <tr>\r\n            <td><span class=\"badge badge-neutral\" style=\"font-weight:700;\">TOP 3</span></td>\r\n            <td><strong>韩磊</strong> (南京大学人工智能学院)</td>\r\n            <td><strong class=\"num\">13911118888</strong></td>\r\n            <td><span class=\"badge badge-neutral\">外部渠道</span></td>\r\n            <td><span class=\"num\">28.0%</span></td>\r\n            <td><span class=\"num\">4</span> 单</td>\r\n            <td><strong class=\"num\">¥5,890.00</strong></td>\r\n            <td><strong class=\"num\" style=\"color: #15803D;\">¥1,650</strong></td>\r\n            <td class=\"col-sticky\" style=\"text-align: right;\">\r\n              <button class=\"btn btn-outline btn-sm\" onclick=\"navigate('partner/PT-9902/orders')\">查看明细 →</button>\r\n            </td>\r\n          </tr>\r\n        </tbody>\r\n      </table>\r\n    </div>\r\n  `;\r\n}\r\n\r\n// ==========================================\r\n// 弹窗与抽屉交互 (Modals & Drawer)\r\n// ==========================================\r\n\r\n// 1. 审核通过弹窗\r\nfunction openApproveModal(appId, isReapprove = false) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n\r\n  const autoCode = Math.floor(1000 + Math.random() * 8999).toString().replace(/4/g, '8');\r\n\r\n  const root = document.getElementById('modal-root');\r\n  root.innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-approve\">\r\n      <div class=\"modal-dialog\">\r\n        <div class=\"modal-dialog-header\">\r\n          <h3>${isReapprove ? '重新审核 · 设为已通过' : '合伙人申请审核通过'}</h3>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-approve')\">\r\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n        <div class=\"modal-dialog-body\">\r\n          <div style=\"background: #FAFAFA; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 18px; font-size: 13px;\">\r\n            <div style=\"display:flex; justify-content:space-between;\">\r\n              <span>申请人：<strong>${app.name}</strong></span>\r\n              <strong class=\"num\">${app.phone}</strong>\r\n            </div>\r\n            <div style=\"color: var(--muted-foreground); margin-top: 4px;\">所属单位：${app.org}</div>\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">渠道类型 <span class=\"req\">*</span></label>\r\n            <div class=\"choice-cards-grid\">\r\n              <div class=\"choice-card-item selected\" id=\"opt-ext\" onclick=\"pickChannelType('EXTERNAL')\">\r\n                <input type=\"radio\" name=\"ch\" value=\"EXTERNAL\" checked>\r\n                <span class=\"choice-title\">外部渠道</span>\r\n              </div>\r\n              <div class=\"choice-card-item\" id=\"opt-int\" onclick=\"pickChannelType('INTERNAL')\">\r\n                <input type=\"radio\" name=\"ch\" value=\"INTERNAL\">\r\n                <span class=\"choice-title\">内部渠道</span>\r\n              </div>\r\n            </div>\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">分成比例（首购 / 续购）<span class=\"req\">*</span></label>\r\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\">\r\n              <div style=\"display: flex; align-items: center; height: 36px; border: 1px solid var(--input); border-radius: var(--radius-md); background: #fff; padding: 0 12px; gap: 8px;\">\r\n                <span style=\"flex: none; font-size: 12px; color: var(--muted-foreground);\">首购</span>\r\n                <input class=\"num\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" id=\"in-approve-first-rate\" value=\"${GLOBAL_CONFIG.external_first_rate}\" style=\"flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; text-align: right;\">\r\n              </div>\r\n              <div style=\"display: flex; align-items: center; height: 36px; border: 1px solid var(--input); border-radius: var(--radius-md); background: #fff; padding: 0 12px; gap: 8px;\">\r\n                <span style=\"flex: none; font-size: 12px; color: var(--muted-foreground);\">续购</span>\r\n                <input class=\"num\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" id=\"in-approve-renew-rate\" value=\"${GLOBAL_CONFIG.external_renew_rate}\" style=\"flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; text-align: right;\">\r\n              </div>\r\n            </div>\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\r\n              <label class=\"form-group-label\" style=\"margin-bottom:0;\">专属推荐码 (4位纯数字) <span class=\"req\">*</span></label>\r\n              <button class=\"btn btn-ghost btn-sm\" style=\"height:22px; padding:0 6px;\" onclick=\"document.getElementById('in-approve-code').value=Math.floor(1000+Math.random()*8999).toString().replace(/4/g,'6')\">重新生成</button>\r\n            </div>\r\n            <input class=\"form-input-full num\" type=\"text\" maxlength=\"4\" id=\"in-approve-code\" value=\"${autoCode}\" style=\"letter-spacing: 4px; font-weight: 700; text-align: center; font-size:16px;\">\r\n            <div class=\"form-hint-note\">下单结算页输入或短链带入的 4 位唯一代码。</div>\r\n          </div>\r\n        </div>\r\n        <div class=\"modal-dialog-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeModal('modal-approve')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"confirmApprovePartner('${app.id}')\">确认通过</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction pickChannelType(type) {\r\n  const optExt = document.getElementById('opt-ext');\r\n  const optInt = document.getElementById('opt-int');\r\n  const firstIn = document.getElementById('in-approve-first-rate');\r\n  const renewIn = document.getElementById('in-approve-renew-rate');\r\n\r\n  if (type === 'EXTERNAL') {\r\n    optExt.classList.add('selected');\r\n    optInt.classList.remove('selected');\r\n    optExt.querySelector('input').checked = true;\r\n    firstIn.value = GLOBAL_CONFIG.external_first_rate;\r\n    renewIn.value = GLOBAL_CONFIG.external_renew_rate;\r\n  } else {\r\n    optInt.classList.add('selected');\r\n    optExt.classList.remove('selected');\r\n    optInt.querySelector('input').checked = true;\r\n    firstIn.value = GLOBAL_CONFIG.internal_first_rate;\r\n    renewIn.value = GLOBAL_CONFIG.internal_renew_rate;\r\n  }\r\n}\r\n\r\nfunction confirmApprovePartner(appId) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n\r\n  const isInt = document.getElementById('opt-int').classList.contains('selected');\r\n  const channel = isInt ? 'INTERNAL' : 'EXTERNAL';\r\n  const firstRate = parseFloat(document.getElementById('in-approve-first-rate').value);\r\n  const renewRate = parseFloat(document.getElementById('in-approve-renew-rate').value);\r\n  const code = document.getElementById('in-approve-code').value.trim();\r\n\r\n  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100 || !Number.isInteger(firstRate) || !Number.isInteger(renewRate)) { alert('首购与续购比例需为 0~100 的整数'); return; }\r\n  if (!/^\\d{4}$/.test(code)) { alert('专属推荐码必须为 4 位纯数字'); return; }\r\n  if (PARTNERS.some(p => p.code === code)) { alert('该推荐码已被其他合伙人占用'); return; }\r\n\r\n  const opTime = nowTime();\r\n  app.status = 'APPROVED';\r\n  app.approve_time = opTime;\r\n  app.approve_by = '张博文';\r\n  app.logs.unshift({\r\n    time: opTime,\r\n    operator: '张博文',\r\n    action: '审核通过',\r\n    detail: `设为${channel==='INTERNAL'?'内部渠道':'外部渠道'}，首购 ${firstRate}% / 续购 ${renewRate}%，推荐码 ${code}`\r\n  });\r\n\r\n  PARTNERS.unshift({\r\n    id: 'PT-' + code,\r\n    name: app.name,\r\n    org: app.org,\r\n    role: app.role,\r\n    phone: app.phone,\r\n    wx: app.wx,\r\n    channel_type: channel,\r\n    code: code,\r\n    first_rate: firstRate,\r\n    renew_rate: renewRate,\r\n    customers_count: 0,\r\n    paying_count: 0,\r\n    points: { total: 0, withdrawable: 0, frozen: 0, settled: 0, unrecovered: 0 },\r\n    status: 'NORMAL',\r\n    freeze_reason: '',\r\n    join_time: opTime,\r\n    orders: [], flow: [], settlements: [], customers: [],\r\n    logs: [\r\n      { time: opTime, operator: '张博文', action: '入驻建档', before: '待审核', after: '正常', reason: '资质审核通过' }\r\n    ]\r\n  });\r\n\r\n  closeModal('modal-approve');\r\n  toast(`合伙人【${app.name}】审核通过！推荐码：${code}`);\r\n  updateSidebarMenu();\r\n  renderApplicationsView(document.getElementById('main-view-container'));\r\n}\r\n\r\n// 2. 拒绝申请弹窗\r\nfunction openRejectModal(appId) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n\r\n  const root = document.getElementById('modal-root');\r\n  root.innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-reject\">\r\n      <div class=\"modal-dialog\">\r\n        <div class=\"modal-dialog-header\">\r\n          <h3>拒绝合伙人申请</h3>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-reject')\">\r\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n        <div class=\"modal-dialog-body\">\r\n          <p style=\"font-size: 13px; color: var(--muted-foreground); margin-bottom: 14px;\">\r\n            正在拒绝 <strong>${app.name}</strong> (${app.phone}) 的申请。确认后该申请标记为「已拒绝」，申请人状态页不再显示该申请可办理。\r\n          </p>\r\n\r\n        </div>\r\n        <div class=\"modal-dialog-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeModal('modal-reject')\">取消</button>\r\n          <button class=\"btn btn-destructive\" onclick=\"confirmRejectPartner('${app.id}')\">确认拒绝</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction confirmRejectPartner(appId) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n\r\n  const opTime = nowTime();\r\n  app.status = 'REJECTED';\r\n  app.reject_time = opTime;\r\n  app.reject_by = '张博文';\r\n  app.logs.unshift({\r\n    time: opTime,\r\n    operator: '张博文',\r\n    action: '拒绝申请',\r\n    detail: '操作人直接拒绝，未填写原因'\r\n  });\r\n\r\n  closeModal('modal-reject');\r\n  toast(`已拒绝【${app.name}】的申请`);\r\n  updateSidebarMenu();\r\n  renderApplicationsView(document.getElementById('main-view-container'));\r\n}\r\n\r\n// 3. 申请详情抽屉\r\nfunction openAppDetailDrawer(appId) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n\r\n  const root = document.getElementById('drawer-root');\r\n  root.innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-app\" onclick=\"if(event.target===this)closeDrawer('drawer-app')\">\r\n      <div class=\"drawer-panel\">\r\n        <div class=\"drawer-header\">\r\n          <div style=\"display: flex; align-items: center; gap: 8px;\">\r\n            <h3 style=\"font-size: 15px; font-weight: 600;\">申请档案详情</h3>\r\n            ${app.status==='PENDING'?'<span class=\"badge badge-warning\">待审核</span>':''}\r\n            ${app.status==='APPROVED'?'<span class=\"badge badge-success\">已通过</span>':''}\r\n            ${app.status==='REJECTED'?'<span class=\"badge badge-danger\">已拒绝</span>':''}\r\n          </div>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-app')\">\r\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n\r\n        <div class=\"drawer-body\">\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">真实姓名 <span class=\"req\">*</span></label>\r\n            <input class=\"form-input-full\" id=\"dr-in-name\" value=\"${app.name}\">\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">所属单位 / 机构 <span class=\"req\">*</span></label>\r\n            <input class=\"form-input-full\" id=\"dr-in-org\" value=\"${app.org}\">\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">申请手机号 (账号标识，只读)</label>\r\n            <input class=\"form-input-full num\" value=\"${app.phone}\" disabled>\r\n            <div class=\"form-hint-note\">合伙人前台登录凭据，不可更改。</div>\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">微信号</label>\r\n            <input class=\"form-input-full\" id=\"dr-in-wx\" value=\"${app.wx || ''}\" placeholder=\"未填写\">\r\n          </div>\r\n\r\n          ${app.status === 'REJECTED' && app.reject_reason ? `\r\n            <div style=\"background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 16px; font-size: 12.5px; color: #991B1B;\">\r\n              <strong>历史拒绝原因：</strong>${app.reject_reason}\r\n            </div>\r\n          ` : ''}\r\n        </div>\r\n\r\n        <div class=\"drawer-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeDrawer('drawer-app')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"saveAppInfo('${app.id}')\">保存修改</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction saveAppInfo(appId) {\r\n  const app = APPLICATIONS.find(a => a.id === appId);\r\n  if (!app) return;\r\n  const name = document.getElementById('dr-in-name').value.trim();\r\n  const org = document.getElementById('dr-in-org').value.trim();\r\n  const wx = document.getElementById('dr-in-wx').value.trim();\r\n\r\n  if (!name || !org) { alert('姓名与单位必填'); return; }\r\n\r\n  app.name = name; app.org = org; app.wx = wx;\r\n  app.logs.unshift({\r\n    time: nowTime(),\r\n    operator: '张博文',\r\n    action: '资料信息维护',\r\n    detail: `修改为: ${name} / ${org}`\r\n  });\r\n\r\n  closeDrawer('drawer-app');\r\n  toast('资料已成功更新');\r\n  renderApplicationsView(document.getElementById('main-view-container'));\r\n}\r\n\r\n// 4. 修改比例弹窗\r\nfunction openModifyRateModal(partnerId) {\r\n  const p = PARTNERS.find(item => item.id === partnerId);\r\n  if (!p) return;\r\n\r\n  const root = document.getElementById('modal-root');\r\n  root.innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-rate\">\r\n      <div class=\"modal-dialog\">\r\n        <div class=\"modal-dialog-header\">\r\n          <h3>修改分成比例</h3>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-rate')\">\r\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n        <div class=\"modal-dialog-body\">\r\n          <div style=\"background: #FAFAFA; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 16px; font-size: 13px;\">\r\n            合伙人：<strong>${p.name}</strong> (${p.phone} · 推荐码: ${p.code})\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">当前比例（首购 / 续购）</label>\r\n            <input class=\"form-input-full num\" value=\"${p.first_rate}% / ${p.renew_rate}%\" disabled>\r\n          </div>\r\n\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">新分成比例（首购 / 续购） <span class=\"req\">*</span></label>\r\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\">\r\n              <div style=\"display:flex; align-items:center; height:36px; border:1px solid var(--input); border-radius:var(--radius-md); background:#fff; padding:0 12px; gap:8px;\">\r\n                <span style=\"flex:none; font-size:12px; color:var(--muted-foreground);\">首购</span>\r\n                <input class=\"num\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" id=\"in-new-first-rate\" value=\"${p.first_rate}\" style=\"flex:1; min-width:0; height:100%; border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; text-align:right; color:var(--foreground);\">\r\n              </div>\r\n              <div style=\"display:flex; align-items:center; height:36px; border:1px solid var(--input); border-radius:var(--radius-md); background:#fff; padding:0 12px; gap:8px;\">\r\n                <span style=\"flex:none; font-size:12px; color:var(--muted-foreground);\">续购</span>\r\n                <input class=\"num\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" id=\"in-new-renew-rate\" value=\"${p.renew_rate}\" style=\"flex:1; min-width:0; height:100%; border:none; outline:none; background:transparent; font-family:inherit; font-size:13px; text-align:right; color:var(--foreground);\">\r\n              </div>\r\n            </div>\r\n            <div class=\"form-hint-note\" style=\"color: #A16207;\">\r\n              ⚠️ 仅对修改后新产生订单生效，历史已带单分成不追溯重算。\r\n            </div>\r\n          </div>\r\n        </div>\r\n        <div class=\"modal-dialog-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeModal('modal-rate')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"confirmModifyRate('${p.id}')\">确认修改</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction confirmModifyRate(partnerId) {\r\n  const p = PARTNERS.find(item => item.id === partnerId);\r\n  if (!p) return;\r\n  const firstRate = parseFloat(document.getElementById('in-new-first-rate').value);\r\n  const renewRate = parseFloat(document.getElementById('in-new-renew-rate').value);\r\n\r\n  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100 || !Number.isInteger(firstRate) || !Number.isInteger(renewRate)) { alert('首购与续购比例需为 0~100 的整数'); return; }\r\n\r\n  const oldFirst = p.first_rate, oldRenew = p.renew_rate;\r\n  p.first_rate = firstRate;\r\n  p.renew_rate = renewRate;\r\n  p.logs.unshift({\r\n    time: nowTime(),\r\n    operator: '张博文',\r\n    action: '分成比例调整',\r\n    before: `首购 ${oldFirst}% / 续购 ${oldRenew}%`,\r\n    after: `首购 ${firstRate}% / 续购 ${renewRate}%`\r\n  });\r\n\r\n  closeModal('modal-rate');\r\n  toast(`分成比例已调整为 首购 ${firstRate}% / 续购 ${renewRate}%`);\r\n  renderActiveView();\r\n}\r\n\r\n// 5. 冻结 / 解冻\r\nfunction openFreezeModal(partnerId) {\r\n  const p = PARTNERS.find(item => item.id === partnerId);\r\n  if (!p) return;\r\n\r\n  const root = document.getElementById('modal-root');\r\n  root.innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-freeze\">\r\n      <div class=\"modal-dialog\">\r\n        <div class=\"modal-dialog-header\">\r\n          <h3>冻结合伙人账号</h3>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-freeze')\">\r\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n        <div class=\"modal-dialog-body\">\r\n          <div style=\"background: #FEFCE8; border: 1px solid #FEF08A; border-radius: var(--radius-md); padding: 10px 12px; font-size: 12.5px; color: #A16207; margin-bottom: 14px;\">\r\n            冻结后该合伙人<strong>立即无法登录前台</strong>，推荐码 (${p.code}) 与专属推广链接同步失效，下单不再产生归属与佣金；解冻后恢复。历史可结算金额保留。\r\n          </div>\r\n          <div class=\"form-group\">\r\n            <label class=\"form-group-label\">冻结原因 <span class=\"req\">*</span></label>\r\n            <textarea class=\"form-textarea-full\" id=\"txt-freeze-reason\" placeholder=\"请输入冻结原因...\"></textarea>\r\n          </div>\r\n        </div>\r\n        <div class=\"modal-dialog-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeModal('modal-freeze')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"confirmFreeze('${p.id}')\">确认冻结</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction confirmFreeze(partnerId) {\r\n  const p = PARTNERS.find(item => item.id === partnerId);\r\n  if (!p) return;\r\n  const reason = document.getElementById('txt-freeze-reason').value.trim();\r\n  if (!reason) { alert('请填写冻结原因'); return; }\r\n\r\n  p.status = 'FROZEN';\r\n  p.freeze_reason = reason;\r\n  p.logs.unshift({\r\n    time: nowTime(),\r\n    operator: '张博文',\r\n    action: '冻结账号',\r\n    before: '正常',\r\n    after: '已冻结',\r\n    reason: reason\r\n  });\r\n\r\n  closeModal('modal-freeze');\r\n  toast(`合伙人【${p.name}】已冻结`);\r\n  renderActiveView();\r\n}\r\n\r\nfunction unfreezePartner(partnerId) {\r\n  const p = PARTNERS.find(item => item.id === partnerId);\r\n  if (!p) return;\r\n  if (!confirm(`确认解冻合伙人【${p.name}】吗？`)) return;\r\n\r\n  p.status = 'NORMAL';\r\n  p.freeze_reason = '';\r\n  p.logs.unshift({\r\n    time: nowTime(),\r\n    operator: '张博文',\r\n    action: '解冻账号',\r\n    before: '已冻结',\r\n    after: '正常',\r\n    reason: '合规核实完毕恢复正常合作'\r\n  });\r\n\r\n  toast(`合伙人【${p.name}】已成功解冻`);\r\n  renderActiveView();\r\n}\r\n\r\n// 6. 确认结算核销弹窗\r\n// 7. 页面：系统设置 (SETTINGS)\r\nlet settingsEditing = { rates: false, freeze: false };\r\nlet pendingSettings = null;\r\n\r\nfunction renderSettingsView(container) {\r\n  const onR = settingsEditing.rates, onF = settingsEditing.freeze;\r\n  const boxStyle = on => `display: flex; align-items: center; height: 36px; border: 1px solid ${on ? 'var(--input)' : 'var(--border)'}; border-radius: var(--radius-md); background: ${on ? '#fff' : '#F4F4F5'}; padding: 0 12px; gap: 8px;`;\r\n  const numInput = (id, label, value, on) => `\r\n    <div style=\"${boxStyle(on)}\">\r\n      <span style=\"flex: none; font-size: 12px; color: var(--muted-foreground);\">${label}</span>\r\n      <input class=\"num\" type=\"number\" step=\"1\" min=\"0\" max=\"100\" id=\"${id}\" value=\"${value}\" ${on ? '' : 'disabled'} style=\"flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; text-align: right; color: ${on ? 'var(--foreground)' : 'var(--muted-foreground)'};\">\r\n    </div>`;\r\n  const editActions = (key, saveFn) => `\r\n    <div style=\"display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;\">\r\n      <button class=\"btn btn-outline\" onclick=\"cancelSettingsEdit('${key}')\">取消</button>\r\n      <button class=\"btn btn-primary\" onclick=\"${saveFn}\">保存</button>\r\n    </div>`;\r\n\r\n  container.innerHTML = `\r\n    <div style=\"margin-bottom: 22px;\">\r\n      <h1 style=\"font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;\">系统设置</h1>\r\n    </div>\r\n\r\n    <div class=\"content-card\" style=\"padding: 20px 22px; margin-bottom: 16px;\">\r\n      <div style=\"display: flex; justify-content: space-between; align-items: center;\">\r\n        <div style=\"font-size: 14px; font-weight: 600;\">默认分成比例</div>\r\n        ${onR ? '' : `<button class=\"btn btn-outline btn-sm\" onclick=\"startSettingsEdit('rates')\">修改</button>`}\r\n      </div>\r\n      <div class=\"form-hint-note\" style=\"margin: 4px 0 16px;\">保存后同步为全系统所有管理者审核、建档时带出的默认比例；仅对后续新合伙人生效，已有合伙人比例保持不变。</div>\r\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\r\n        <div class=\"form-group\" style=\"margin-bottom: 0;\">\r\n          <label class=\"form-group-label\">内部渠道默认比例（%）</label>\r\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\r\n            ${numInput('set-in-first', '首购', GLOBAL_CONFIG.internal_first_rate, onR)}\r\n            ${numInput('set-in-renew', '续购', GLOBAL_CONFIG.internal_renew_rate, onR)}\r\n          </div>\r\n        </div>\r\n        <div class=\"form-group\" style=\"margin-bottom: 0;\">\r\n          <label class=\"form-group-label\">外部渠道默认比例（%）</label>\r\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\r\n            ${numInput('set-ext-first', '首购', GLOBAL_CONFIG.external_first_rate, onR)}\r\n            ${numInput('set-ext-renew', '续购', GLOBAL_CONFIG.external_renew_rate, onR)}\r\n          </div>\r\n        </div>\r\n      </div>\r\n      ${onR ? editActions('rates', 'requestSaveRates()') : ''}\r\n    </div>\r\n\r\n    <div class=\"content-card\" style=\"padding: 20px 22px; margin-bottom: 16px;\">\r\n      <div style=\"display: flex; justify-content: space-between; align-items: center;\">\r\n        <div style=\"font-size: 14px; font-weight: 600;\">冻结规则</div>\r\n        ${onF ? '' : `<button class=\"btn btn-outline btn-sm\" onclick=\"startSettingsEdit('freeze')\">修改</button>`}\r\n      </div>\r\n      <div class=\"form-hint-note\" style=\"margin: 4px 0 16px;\">推广币解冻日 = 服务期结束日 + N 天（防退款观察期）。修改并保存后，全系统按新规则重算解冻日与冻结中金额。</div>\r\n      <div class=\"form-group\" style=\"max-width: 280px; margin-bottom: 0;\">\r\n        <label class=\"form-group-label\">冻结观察期 T+N（天）</label>\r\n        <input class=\"form-input-full num\" type=\"number\" step=\"1\" min=\"0\" max=\"60\" id=\"set-unfreeze-days\" value=\"${GLOBAL_CONFIG.unfreeze_days}\" ${onF ? '' : 'disabled'}>\r\n        <div class=\"form-hint-note\">当前规则：T+${GLOBAL_CONFIG.unfreeze_days} 天。默认 7 天，可调整 0-60 天。</div>\r\n      </div>\r\n      ${onF ? editActions('freeze', 'requestSaveFreeze()') : ''}\r\n    </div>\r\n  `;\r\n}\r\n\r\nfunction startSettingsEdit(key) {\r\n  settingsEditing[key] = true;\r\n  renderActiveView();\r\n}\r\n\r\nfunction cancelSettingsEdit(key) {\r\n  settingsEditing[key] = false;\r\n  pendingSettings = null;\r\n  renderActiveView();\r\n}\r\n\r\nfunction requestSaveRates() {\r\n  const iF = parseFloat(document.getElementById('set-in-first').value);\r\n  const iR = parseFloat(document.getElementById('set-in-renew').value);\r\n  const eF = parseFloat(document.getElementById('set-ext-first').value);\r\n  const eR = parseFloat(document.getElementById('set-ext-renew').value);\r\n  if ([iF, iR, eF, eR].some(v => isNaN(v) || v < 0 || v > 100 || !Number.isInteger(v))) { alert('首购与续购比例需为 0~100 的整数'); return; }\r\n\r\n  const diffs = [];\r\n  if (iF !== GLOBAL_CONFIG.internal_first_rate) diffs.push(`内部 首购 ${GLOBAL_CONFIG.internal_first_rate}% → ${iF}%`);\r\n  if (iR !== GLOBAL_CONFIG.internal_renew_rate) diffs.push(`内部 续购 ${GLOBAL_CONFIG.internal_renew_rate}% → ${iR}%`);\r\n  if (eF !== GLOBAL_CONFIG.external_first_rate) diffs.push(`外部 首购 ${GLOBAL_CONFIG.external_first_rate}% → ${eF}%`);\r\n  if (eR !== GLOBAL_CONFIG.external_renew_rate) diffs.push(`外部 续购 ${GLOBAL_CONFIG.external_renew_rate}% → ${eR}%`);\r\n  if (!diffs.length) { settingsEditing.rates = false; toast('未修改任何配置'); renderActiveView(); return; }\r\n\r\n  pendingSettings = { type: 'rates', values: { iF, iR, eF, eR }, diffs };\r\n  openSettingsConfirm('默认分成比例', diffs);\r\n}\r\n\r\nfunction requestSaveFreeze() {\r\n  const days = parseInt(document.getElementById('set-unfreeze-days').value, 10);\r\n  if (isNaN(days) || days < 0 || days > 60) { alert('请输入有效的冻结观察期天数 (0~60 天)'); return; }\r\n\r\n  const diffs = [];\r\n  if (days !== GLOBAL_CONFIG.unfreeze_days) diffs.push(`冻结观察期 T+${GLOBAL_CONFIG.unfreeze_days} → T+${days}`);\r\n  if (!diffs.length) { settingsEditing.freeze = false; toast('未修改任何配置'); renderActiveView(); return; }\r\n\r\n  pendingSettings = { type: 'freeze', values: { days }, oldDays: GLOBAL_CONFIG.unfreeze_days, diffs };\r\n  openSettingsConfirm('冻结规则', diffs);\r\n}\r\n\r\nfunction openSettingsConfirm(title, diffs) {\r\n  document.getElementById('modal-root').innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-set-confirm\">\r\n      <div class=\"modal-dialog\" style=\"max-width: 440px;\">\r\n        <div class=\"modal-dialog-header\">\r\n          <h3>确认修改 · ${title}</h3>\r\n          <button class=\"btn-ghost\" style=\"padding: 4px;\" onclick=\"closeModal('modal-set-confirm')\">\r\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/></svg>\r\n          </button>\r\n        </div>\r\n        <div class=\"modal-dialog-body\">\r\n          <p style=\"font-size: 13px; color: var(--muted-foreground); margin-bottom: 12px;\">以下配置将被变更，请确认无误后保存：</p>\r\n          ${diffs.map(d => `<div style=\"font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;\">${d}</div>`).join('')}\r\n        </div>\r\n        <div class=\"modal-dialog-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeModal('modal-set-confirm')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"applySettingsChanges()\">确认保存</button>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n}\r\n\r\nfunction applySettingsChanges() {\r\n  const p = pendingSettings;\r\n  if (!p) return;\r\n  if (p.type === 'rates') {\r\n    const { iF, iR, eF, eR } = p.values;\r\n    GLOBAL_CONFIG.internal_first_rate = iF;\r\n    GLOBAL_CONFIG.internal_renew_rate = iR;\r\n    GLOBAL_CONFIG.external_first_rate = eF;\r\n    GLOBAL_CONFIG.external_renew_rate = eR;\r\n    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整默认比例：${p.diffs.join('；')}` });\r\n    toast(`默认比例已更新：内部 ${iF}% / ${iR}%，外部 ${eF}% / ${eR}%`);\r\n  } else {\r\n    GLOBAL_CONFIG.unfreeze_days = p.values.days;\r\n    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整冻结规则：T+${p.oldDays} → T+${p.values.days}` });\r\n    toast(`冻结规则已更新：T+${p.values.days} 天`);\r\n  }\r\n  settingsEditing[p.type] = false;\r\n  pendingSettings = null;\r\n  closeModal('modal-set-confirm');\r\n  recalcAll();\r\n  renderActiveView();\r\n}\r\n\r\n// 通用助手函数\r\nfunction closeModal(id) {\r\n  const el = document.getElementById(id);\r\n  if (el) el.classList.remove('show');\r\n}\r\nfunction closeDrawer(id) {\r\n  const el = document.getElementById(id);\r\n  if (el) el.classList.remove('show');\r\n}\r\nfunction toast(msg) {\r\n  const el = document.getElementById('app-toast');\r\n  const txt = document.getElementById('toast-text');\r\n  if (!el || !txt) return;\r\n  txt.textContent = msg;\r\n  el.classList.add('show');\r\n  setTimeout(() => el.classList.remove('show'), 2200);\r\n}\r\nfunction nowTime() {\r\n  const d = new Date();\r\n  const pad = n => n < 10 ? '0' + n : n;\r\n  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;\r\n}\r\nfunction formatNum(n) {\r\n  if (n === null || n === undefined) return '0';\r\n  const v = Math.round(n * 100) / 100;\r\n  return v.toLocaleString(undefined, Number.isInteger(v) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });\r\n}\r\n// 佣金一律按分取整（保留两位小数）\r\nfunction round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }\r\nfunction fmtC(n) {\r\n  if (n === null || n === undefined) return '0.00';\r\n  return round2(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });\r\n}\r\n\r\nwindow.onload = function() {\r\n  initRouter();\r\n};\r\n<\/script>\r\n</body>\r\n</html>\r\n"</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var isOps = params.get('role') === 'ops';

  // 注入到目标文档末尾：负责两端切换（不再依赖 iframe 与 postMessage 到父窗口）
  var SHIM = '<script>(function(){'
    + 'var isOps = location.search.indexOf("role=ops") > -1;'
    + 'window.addEventListener("message", function(e){'
    + '  var d = e.data || {};'
    + '  if (d.type === "lb-switch-role" && d.role === "ops" && !isOps) {'
    + '    location.href = location.pathname + "?role=ops";'
    + '  }'
    + '});'
    + 'if (isOps) {'
    + '  var b = document.createElement("button");'
    + '  b.type = "button";'
    + '  b.textContent = "返回合伙人端";'
    + '  b.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:99999;padding:8px 14px;border-radius:999px;'
    + 'border:1px solid #E5E7EB;background:#FFFFFF;color:#374151;font-size:12px;font-weight:600;'
    + 'box-shadow:0 4px 14px rgba(15,23,42,.12);cursor:pointer;font-family:inherit;";'
    + '  b.onclick = function(){ location.href = location.pathname + "?role=partner"; };'
    + '  document.body.appendChild(b);'
    + '}'
    + '})();<\/script>';

  function boot() {
    var role = isOps ? 'ops' : 'partner';
    var el = document.getElementById('doc-' + role);
    var html = el ? JSON.parse(el.textContent) : '';
    if (!html) return;
    if (html.indexOf('</body>') >= 0) html = html.replace('</body>', SHIM + '</body>');
    document.open();
    document.write(html);
    document.close();
    document.title = isOps ? '立理 S1 平台管理后台 Demo' : '立理 S1 合伙人端 Demo';
  }

  boot();
})();
</script>
