      <a class="sidebar-menu-item" href="settlements.html" id="nav-settlements">

        结算管理
      </a>
      <a class="sidebar-menu-item" href="reports.html" id="nav-reports">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        数据报表
      </a>
      <a class="sidebar-menu-item" href="settings.html" id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        系统设置
      </a>
    </div>

    <!-- 用户信息卡片 -->
    <div class="sidebar-footer">
      <div class="user-profile-summary">
        <div class="user-avatar-circle">张</div>
        <div class="user-meta-texts">
          <div class="user-meta-name">陈嘉禾</div>
          <div class="user-meta-role">超级管理员</div>
        </div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--muted-foreground);"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </aside>

  <!-- 主体工作区 -->
  <main id="app-main">
    <!-- 官方顶栏 -->
    <header id="app-header">
      <div class="header-left">
        <button class="btn-icon-square" title="Toggle Sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
      <div class="header-right">
        <div class="search-pill-box" onclick="toast('快捷搜索合伙人或订单 (⌘ K)')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>搜索</span>
          <span class="kbd-badge">⌘ K</span>
        </div>
        <button class="btn-round-icon" onclick="navigate('settings')" title="系统设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div class="user-avatar-circle" style="width:28px; height:28px; font-size:12px; cursor:pointer;" onclick="toast('当前管理员: 陈嘉禾 (超级管理员)')">张</div>
      </div>
    </header>

    <!-- 动态视图区域 -->
    <div id="main-view-container"></div>
  </main>
</div>

<!-- Toast 组件 -->
<div id="app-toast">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-text">操作已完成</span>
</div>

<!-- 弹窗容器 -->
<div id="modal-root"></div>

<!-- 抽屉容器 -->
<div id="drawer-root"></div>

  <script src="js/common.js"></script>
  <script>
function renderDashboardView(container) {
  const m = dashMetrics(PARTNERS);
  const userShare = m.gmv > 0 ? Math.round(m.userGmv / m.gmv * 100) : 0;
  const orgShare = 100 - userShare;
  const conv = m.cust > 0 ? Math.round(m.paying / m.cust * 1000) / 10 : 0;
  const ic = p => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const I = {
    trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    building: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
    receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>'
  };
  const mini = (label, value) => `<div style="background:#FAFAFA; border:1px solid var(--border); border-radius:8px; padding:8px 10px;">
      <div style="font-size:11px; color:var(--muted-foreground);">${label}</div>
      <div class="num" style="font-size:13px; font-weight:600; margin-top:2px;">${value}</div>
    </div>`;
  const tile = (label, value, sub, icon, big) => `<div class="content-card" style="margin-bottom:0; padding:16px 18px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:12.5px; color:var(--muted-foreground);">${label}</span>
        <span style="width:26px; height:26px; border-radius:8px; background:var(--muted); display:flex; align-items:center; justify-content:center; color:#3F3F46;">${icon}</span>
      </div>
      <div class="num" style="margin-top:8px; font-size:${big ? 26 : 22}px; font-weight:700; letter-spacing:-0.02em;">${value}</div>
      <div style="margin-top:4px; font-size:12px; color:var(--muted-foreground);">${sub}</div>
    </div>`;

  const dashUnits = availDashUnits().filter(u => dashUnitsSel.indexOf(u) >= 0);
  const unitCards = dashUnits.map(u => {
    const ps = PARTNERS.filter(p => p.unit === u);
    const d = dashMetrics(ps);
    return `<div class="content-card" style="margin-bottom:0;">
      <div class="card-header-bar" style="padding:13px 18px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:26px; height:26px; border-radius:8px; background:var(--muted); display:flex; align-items:center; justify-content:center; color:#3F3F46;">${ic(I.building)}</span>
          <span class="card-header-title">${u}</span>
        </div>
        <span class="badge badge-neutral" title="${ps.length} 位合伙人" style="display:inline-flex; align-items:center; gap:4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="num">${ps.length}</span>
        </span>
      </div>
      <div style="padding:14px 18px 16px;">
        <div style="font-size:12px; color:var(--muted-foreground);">总成交 GMV</div>
        <div class="num" style="font-size:22px; font-weight:700; letter-spacing:-0.02em; margin-top:2px;">¥${formatNum(d.gmv)}</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
          ${mini('个人成交', '¥' + formatNum(d.userGmv))}
          ${mini('机构成交', '¥' + formatNum(d.orgGmv))}
          ${mini('客户数 / 签单', d.cust + ' / ' + d.paying)}
          ${mini('机构签单数', d.orgDeals + ' 单')}
          ${mini('个人客单价', '¥' + formatNum(d.userAov))}
          ${mini('机构客单价', '¥' + formatNum(d.orgAov))}
        </div>
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-size:12px; color:var(--muted-foreground);">产生佣金总额</span>
            <span class="num" style="font-size:15px; font-weight:700;">¥${formatNum(d.fee)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted-foreground); margin-top:3px;">
            <span>个人订单 ¥${formatNum(d.userFee)}</span><span>机构订单 ¥${formatNum(d.orgFee)}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
      <div>
        <h1 style="font-size:22px; font-weight:700; letter-spacing:-0.02em;">数据看板</h1>
        <div style="font-size:12.5px; color:var(--muted-foreground); margin-top:4px;">最新数据截止 ${DASH_TODAY}</div>
      </div>
      <div style="position:relative;">
        <button type="button" class="input-control date-range-trigger" style="width:240px;" onclick="toggleDashDatePicker()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-foreground); flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
          <span style="flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${dashRangeBounds().label}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-foreground); flex-shrink:0;"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        ${dashPickerOpen ? dashPickerHtml() : ''}
      </div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:16px; margin-bottom:16px;">
      <div class="content-card" style="margin-bottom:0; padding:22px 24px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div style="font-size:13px; color:var(--muted-foreground);">总成交 GMV</div>
            <div class="num" style="font-size:40px; font-weight:800; letter-spacing:-0.03em; margin-top:6px;">¥${formatNum(m.gmv)}</div>
          </div>
          <span class="badge badge-neutral">${dashRangeBounds().full ? '累计' : '区间'}</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px;">
          <div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted-foreground);"><span>个人成交 GMV</span><span class="num">${userShare}%</span></div>
            <div class="num" style="font-size:18px; font-weight:700; margin-top:2px;">¥${formatNum(m.userGmv)}</div>
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted-foreground);"><span>机构成交 GMV</span><span class="num">${orgShare}%</span></div>
            <div class="num" style="font-size:18px; font-weight:700; margin-top:2px;">¥${formatNum(m.orgGmv)}</div>
          </div>
        </div>
        <div style="margin-top:14px; height:6px; border-radius:999px; background:#F4F4F5; overflow:hidden; display:flex;">
          <span style="width:${userShare}%; background:#09090B;"></span>
          <span style="flex:1; background:#D4D4D8;"></span>
        </div>
      </div>

      <div class="content-card" style="margin-bottom:0; padding:22px 24px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div style="font-size:13px; color:var(--muted-foreground);">产生佣金总额</div>
            <div class="num" style="font-size:32px; font-weight:800; letter-spacing:-0.03em; margin-top:6px;">¥${formatNum(m.fee)}</div>
          </div>
          <span style="width:28px; height:28px; border-radius:8px; background:var(--muted); display:flex; align-items:center; justify-content:center; color:#3F3F46;">${ic(I.coins)}</span>
        </div>
        <div style="margin-top:16px; display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:#FAFAFA; border:1px solid var(--border); border-radius:8px;">
            <span style="font-size:12px; color:var(--muted-foreground);">个人订单佣金</span>
            <span class="num" style="font-size:13px; font-weight:600;">¥${formatNum(m.userFee)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:#FAFAFA; border:1px solid var(--border); border-radius:8px;">
            <span style="font-size:12px; color:var(--muted-foreground);">机构订单佣金</span>
            <span class="num" style="font-size:13px; font-weight:600;">¥${formatNum(m.orgFee)}</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:26px;">
      ${tile('客户总数 / 签单客户数', m.cust + ' / ' + m.paying, '签单转化率 ' + conv + '%', ic(I.users), true)}
      ${tile('个人单客客单价', '¥' + formatNum(m.userAov), '个人 GMV ÷ 签单客户数', ic(I.user))}
      ${tile('机构单客客单价', '¥' + formatNum(m.orgAov), '机构 GMV ÷ 机构签单数', ic(I.building))}
      ${tile('机构签单数', m.orgDeals + ' 单', '已签约机构合同数', ic(I.receipt))}
    </div>

    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;">
      <h2 style="font-size:15px; font-weight:600;">分单位数据</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-outline btn-sm" style="display:inline-flex; align-items:center; gap:5px;" onclick="openDashUnitModal()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>设置</span>
        </button>
      </div>
    </div>
    ${dashUnits.length ? `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px;">
      ${unitCards}
    </div>` : `<div class="content-card" style="margin:0; padding:34px 20px; text-align:center;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--muted); display:flex; align-items:center; justify-content:center; margin:0 auto 10px; color:#3F3F46;">${ic(I.building)}</div>
      <div style="font-size:14px; font-weight:600;">尚未选择要展示的单位</div>
      <div style="font-size:12px; color:var(--muted-foreground); margin-top:4px;">勾选单位后，将在此按单位汇总成交、客户与佣金数据</div>
      <button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="openDashUnitModal()">选择单位</button>
    </div>`}
  `;
}

// ==========================================
// 4.4 看板日期区间选择器
// ==========================================
let dashPickerOpen = false;
let dashTmpFrom = dashRange.start;
let dashTmpTo = dashRange.end;
let dashCalMonth = (dashRange.start || DASH_TODAY).slice(0, 7);
const dpad2 = n => String(n).padStart(2, '0');
function dShiftYm(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + dpad2(d.getMonth() + 1);
}
function dashMonthCells(ym) {
  const [y, m] = ym.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m - 1, 0).getDate();
  const prevYm = dShiftYm(ym, -1), nextYm = dShiftYm(ym, 1);
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) cells.push({ date: `${prevYm}-${dpad2(prevDays - i)}`, day: prevDays - i, muted: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ date: `${ym}-${dpad2(d)}`, day: d, muted: false });
  let n = 1;
  while (cells.length % 7 !== 0) { cells.push({ date: `${nextYm}-${dpad2(n)}`, day: n, muted: true }); n++; }
  return cells;
}
function dashCalHtml(ym) {
  const cl = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';
  const cr = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>';
  const [y, m] = ym.split('-').map(Number);
  return `
    <div>
      <div class="cal-head">
        <button type="button" class="cal-nav" onclick="shiftDashCal(-1)">${cl}</button>
        <span>${y} 年 ${m} 月</span>
        <button type="button" class="cal-nav" onclick="shiftDashCal(1)">${cr}</button>
      </div>
      <div class="cal-weekdays">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">
        ${dashMonthCells(ym).map(c => {
          const isFrom = c.date === dashTmpFrom;
          const isTo = c.date === dashTmpTo;
          const inRange = dashTmpFrom && dashTmpTo && c.date > dashTmpFrom && c.date < dashTmpTo;
          const cls = ['cal-day', c.muted ? 'muted' : '', (isFrom || isTo) ? 'edge' : '', inRange ? 'in-range' : '', c.date === DASH_TODAY ? 'today' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" onclick="pickDashDate('${c.date}')">${c.day}</button>`;
        }).join('')}
      </div>
    </div>`;
}
function dashPickerHtml() {
  return `
    <div class="date-popover" onclick="event.stopPropagation()">
      <div class="cal-wrap">
        ${dashCalHtml(dashCalMonth)}
        ${dashCalHtml(dShiftYm(dashCalMonth, 1))}
      </div>
      <div class="cal-footer">
        <div class="cal-presets">
          <button type="button" class="cal-preset" onclick="setDashRangePreset('7')">近 7 天</button>
          <button type="button" class="cal-preset" onclick="setDashRangePreset('month')">本月</button>
          <button type="button" class="cal-preset" onclick="clearDashDatePicker()">清空</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeDashDatePicker()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="applyDashDatePicker()">确定</button>
        </div>
      </div>
    </div>`;
}
function dashDocClick() {
  dashPickerOpen = false;
  document.removeEventListener('click', dashDocClick);
  renderActiveView();
}
function toggleDashDatePicker() {
  dashPickerOpen = !dashPickerOpen;
  if (dashPickerOpen) {
    dashTmpFrom = dashRange.start;
    dashTmpTo = dashRange.end;
    dashCalMonth = (dashRange.start || DASH_TODAY).slice(0, 7);
    setTimeout(() => document.addEventListener('click', dashDocClick), 0);
  } else {
    document.removeEventListener('click', dashDocClick);
  }
  renderActiveView();
}
function closeDashDatePicker() {
  dashPickerOpen = false;
  document.removeEventListener('click', dashDocClick);
  renderActiveView();
}
function applyDashDatePicker() {
  dashPickerOpen = false;
  document.removeEventListener('click', dashDocClick);
  const year = DASH_TODAY.slice(0, 4);
  if (!dashTmpFrom && !dashTmpTo) {
    dashRange.start = year + '-01-01';
    dashRange.end = year + '-12-31';
  } else if (dashTmpFrom && !dashTmpTo) {
    dashRange.start = dashTmpFrom;
    dashRange.end = dashTmpFrom;
  } else {
    dashRange.start = dashTmpFrom;
    dashRange.end = dashTmpTo;
  }
  renderActiveView();
}
function clearDashDatePicker() {
  dashTmpFrom = '';
  dashTmpTo = '';
  renderActiveView();
}
function shiftDashCal(delta) {
  dashCalMonth = dShiftYm(dashCalMonth, delta);
  renderActiveView();
}
function pickDashDate(date) {
  if (!dashTmpFrom || dashTmpTo) {
    dashTmpFrom = date;
    dashTmpTo = '';
  } else if (date < dashTmpFrom) {
    dashTmpTo = dashTmpFrom;
    dashTmpFrom = date;
  } else {
    dashTmpTo = date;
  }
  renderActiveView();
}
function setDashRangePreset(type) {
  const shift = offset => {
    const d = new Date(DASH_TODAY + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return `${d.getFullYear()}-${dpad2(d.getMonth() + 1)}-${dpad2(d.getDate())}`;
  };
  if (type === '7') {
    dashTmpFrom = shift(-6);
    dashTmpTo = DASH_TODAY;
  } else if (type === 'month') {
    dashTmpFrom = DASH_TODAY.slice(0, 7) + '-01';
    dashTmpTo = DASH_TODAY;
  }
  renderActiveView();
}

// ==========================================
// 4.5 页面：订单管理 (ORDERS)
// ==========================================

function renderCurrentPage() {
  renderDashboardView(document.getElementById("main-view-container"));
}

function startPage() {
  initAdminNav('nav-dashboard');
  renderCurrentPage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPage);
} else {
  startPage();
}
  </script>
