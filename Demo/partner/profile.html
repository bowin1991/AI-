<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的资料 - 立理 S1 合伙人端</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/partner.css">
</head>
<body class="bg-surface-canvas text-slate-title antialiased selection:bg-brand-100 selection:text-brand-600 font-sans min-h-screen">

  <!-- 根挂载容器 -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- 全局 Toast 提示组件 -->
  <div id="toast">
    <div class="flex items-center space-x-2.5 bg-slate-title text-white text-xs font-semibold px-4 py-3 rounded-full shadow-dropdown max-w-sm border border-white/10">
      <i data-lucide="check-circle" class="w-4 h-4 text-brand-400 flex-shrink-0"></i>
      <span id="toast-text" class="truncate text-white">提示信息</span>
    </div>
  </div>

  <!-- ==================== 右下角独立演示控制助手 (FLOATING DEMO TOOLKIT) ==================== -->
  <div id="demo-toolkit" class="fixed bottom-5 right-5 z-40 flex flex-col items-end text-[#111827]">
    <!-- 展开的操作面板 -->
    <div id="demo-toolkit-panel" class="bg-white rounded-[20px] border border-[#E8ECF2] p-4 shadow-dropdown w-80 text-left transition-all mb-2.5">
      <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-[#F1F3F7]">
        <div class="flex items-center space-x-1.5">
          <div class="w-6 h-6 rounded-lg bg-[#FFF5F0] text-[#FF5C28] flex items-center justify-center shadow-2xs"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></div>
          <span class="font-bold text-xs text-[#111827]">演示控制助手</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-[#FAFAFC] text-[#4B5563] border border-[#E8ECF2] font-medium">Demo</span>
        </div>
        <button type="button" onclick="toggleDemoToolkit(false)" class="text-[#4B5563] hover:text-[#111827] p-1 rounded-md text-xs" title="收起面板">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- 快捷切换测试账号 -->
      <div class="space-y-1.5 mb-3">
        <div class="text-xs font-semibold text-[#4B5563] flex items-center justify-between">
          <span>快捷切换测试身份:</span>
          <span class="text-[#4B5563]">密码: Test1234</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5 text-xs">
          <button type="button" onclick="demoSwitchAccount('13800000003')" class="p-2 rounded-xl bg-[#FAFAFC] border border-[#E8ECF2] hover:border-[#FF5C28] hover:bg-white text-left transition-all group">
            <div class="font-bold text-[#111827] group-hover:text-[#FF5C28]">13800000003</div>
            <div class="text-emerald-600 font-semibold flex items-center text-xs"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 flex-shrink-0"></span>已通过 (正式)</div>
          </button>
          <button type="button" onclick="demoSwitchAccount('13800000001')" class="p-2 rounded-xl bg-[#FAFAFC] border border-[#E8ECF2] hover:border-[#FF5C28] hover:bg-white text-left transition-all group">
            <div class="font-bold text-[#111827] group-hover:text-[#FF5C28]">13800000001</div>
            <div class="text-amber-600 font-semibold flex items-center text-xs"><span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1 flex-shrink-0"></span>审核中 (Pending)</div>
          </button>
          <button type="button" onclick="demoSwitchAccount('13800000002')" class="p-2 rounded-xl bg-[#FAFAFC] border border-[#E8ECF2] hover:border-[#FF5C28] hover:bg-white text-left transition-all group">
            <div class="font-bold text-[#111827] group-hover:text-[#FF5C28]">13800000002</div>
            <div class="text-rose-600 font-semibold flex items-center text-xs"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1 flex-shrink-0"></span>已拒绝 (Rejected)</div>
          </button>
          <button type="button" onclick="demoSwitchAccount('13800000004')" class="p-2 rounded-xl bg-[#FAFAFC] border border-[#E8ECF2] hover:border-[#FF5C28] hover:bg-white text-left transition-all group">
            <div class="font-bold text-[#111827] group-hover:text-[#FF5C28]">13800000004</div>
            <div class="text-[#4B5563] font-semibold flex items-center text-xs"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 mr-1 flex-shrink-0"></span>已冻结 (Frozen)</div>
          </button>
        </div>
        <button type="button" onclick="demoFillOps()" class="mt-1.5 w-full p-2 rounded-xl bg-[#FAFAFC] border border-[#E8ECF2] hover:border-[#FF5C28] hover:bg-white text-left transition-all group">
          <div class="font-bold text-[#111827] group-hover:text-[#FF5C28] text-xs">运营账号 ops_admin</div>
          <div class="text-[#4B5563] font-semibold flex items-center text-xs"><span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-1 flex-shrink-0"></span>密码 Admin1234（进入运营工作台）</div>
        </button>
      </div>

      <!-- 快速模拟审核通过 -->
      <div class="pt-2.5 border-t border-[#F1F3F7] flex flex-col space-y-1.5">
        <button type="button" onclick="simulateApprove()" class="w-full py-2 px-3 rounded-full bg-[#FF5C28] hover:bg-[#E04816] text-white font-bold text-xs shadow-xs transition-all flex items-center justify-center space-x-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>模拟运营审核通过 (直达工作台)</span>
        </button>
      </div>
    </div>

    <!-- 收起状态下的浮动胶囊入口按钮 -->
    <button id="demo-toolkit-btn" onclick="toggleDemoToolkit()" class="flex items-center space-x-2 bg-[#111827] hover:bg-[#FF5C28] text-white text-xs font-bold px-3.5 py-2.5 rounded-full shadow-dropdown border border-white/10 transition-all hover:scale-105 group">
      <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
      <i data-lucide="sparkles" class="w-3.5 h-3.5 text-brand-400"></i><span>演示助手</span>
    </button>

  <script src="js/common.js"></script>
  <script>
function pProfile() {
  var u = S.user || { phone: '13800000003' };
  var a = appOf(u.phone);
  var rt = rateOf(u.phone);

  var contentHtml = [
    '<div class="max-w-3xl space-y-6">',
      '<div class="rounded-[20px] bg-surface-card border border-surface-border p-6 shadow-card flex items-center justify-between">',
        '<div class="flex items-center space-x-4">',
          '<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 text-white font-extrabold text-xl flex items-center justify-center shadow-hero">' + (a.name ? a.name.charAt(0) : '合') + '</div>',
          '<div>',
            '<h3 class="text-lg font-bold text-slate-title">' + esc(a.name) + '</h3>',
            '<p class="text-xs text-slate-muted mt-1">' + esc(a.org) + '</p>',
          '</div>',
        '</div>',
        '<button onclick="logout()" class="px-4 py-2 rounded-full border border-surface-border hover:border-rose-300 text-xs font-semibold text-rose-600 hover:bg-rose-50 transition-all flex items-center space-x-1">',
          '<i data-lucide="log-out" class="w-3.5 h-3.5"></i>',
          '<span>退出登录</span>',
        '</button>',
      '</div>',

      '<div class="rounded-[20px] bg-surface-card border border-surface-border p-6 shadow-card">',
        '<div class="divide-y divide-surface-border-subtle text-xs">',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">真实姓名</span><span class="font-bold text-slate-title">' + esc(a.name) + '</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">所属单位</span><span class="text-slate-title">' + esc(a.org) + '</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">手机号码</span><span class="font-mono text-slate-title">' + esc(u.phone) + '</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">微信号</span><span class="text-slate-title">' + esc(a.wx || '未填写') + '</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">申请入驻时间</span><span class="text-slate-title">' + esc(a.time) + '</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">专属推荐码</span><span class="font-mono font-bold text-brand-600">8866</span></div>',
          '<div class="py-3 flex justify-between"><span class="text-slate-muted font-medium">基准分润比例</span><span class="font-bold text-emerald-600">首购 ' + rt.first + '% / 续购 ' + rt.next + '%</span></div>',
        '</div>',
      '</div>',

      '<div class="rounded-[20px] bg-surface-card border border-surface-border p-6 shadow-card flex items-center justify-between">',
        '<div>',
          '<h4 class="font-bold text-sm text-slate-title">账号与安全密码</h4>',
          '<p class="text-xs text-slate-muted mt-0.5">定期更换密码有助于保护推广分佣资产安全</p>',
        '</div>',
        '<button onclick="go(\'forgot\')" class="px-4 py-2 rounded-full border border-surface-border bg-white text-xs font-semibold text-slate-title hover:bg-surface-subtle transition-all">修改登录密码</button>',
      '</div>',
    '</div>'
  ].join('');

  $('app').innerHTML = renderDashboardLayout('profile', '我的资料', '账号资质', contentHtml);
  renderIcons();
}


function renderCurrentPage() {
  pProfile();
}

function startPage() {
  initAuth(true);
  renderCurrentPage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPage);
} else {
  startPage();
}
  </script>
</body>
</html>
