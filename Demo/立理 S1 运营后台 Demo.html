<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立理 S1 平台管理后台 — 合伙人管理</title>
<style>
/* 
 * 立理 S1 官方统一设计规范 (Tailwind CSS v4 + shadcn/ui 官方逆向提取版)
 * 来源: https://ali-dev.s1.liliai.cn/admin/
 */
:root {
  --background: #FFFFFF;
  --foreground: #09090B;
  --muted: #F4F4F5;
  --muted-foreground: #71717A;
  --card: #FFFFFF;
  --card-foreground: #09090B;
  --popover: #FFFFFF;
  --popover-foreground: #09090B;
  --border: #E4E4E7;
  --input: #E4E4E7;
  --primary: #09090B;
  --primary-hover: #27272A;
  --primary-foreground: #FAFAFA;
  --secondary: #F4F4F5;
  --secondary-foreground: #18181B;
  --accent: #F4F4F5;
  --accent-foreground: #18181B;
  --destructive: #E11D48;
  --destructive-hover: #BE123C;
  --destructive-foreground: #FFFFFF;
  --ring: #71717A;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 9999px;
  --sidebar-w: 256px;
  --header-h: 56px;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background-color: #FAFAFA;
  color: var(--foreground);
  line-height: 1.5;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* 等宽数字排版 */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* 页面总布局 */
#app-layout { display: flex; min-height: 100vh; }

/* 左侧侧边栏 (1:1 复刻官方) */
aside#app-sidebar {
  width: var(--sidebar-w);
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 50;
}
.sidebar-brand {
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 19px;
  font-weight: 800;
  color: #09090B;
  letter-spacing: -0.02em;
}
.brand-badge {
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid #09090B;
  padding: 1px 5px;
  border-radius: 4px;
  line-height: 1.2;
}
.brand-sub {
  font-size: 11px;
  color: var(--muted-foreground);
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-menu-wrap {
  padding: 12px 12px;
  flex: 1;
  overflow-y: auto;
}
.menu-group-header {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted-foreground);
  padding: 8px 10px 4px;
}
.sidebar-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  color: var(--foreground);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 400;
  margin-bottom: 2px;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.sidebar-menu-item:hover { background-color: var(--muted); }
.sidebar-menu-item.active {
  background-color: var(--muted);
  font-weight: 600;
  color: var(--foreground);
}
.sidebar-menu-item svg {
  width: 16px; height: 16px;
  stroke: var(--foreground);
  flex-shrink: 0;
}
.sidebar-menu-item .menu-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  background: var(--destructive);
  color: #fff;
}
.sidebar-menu-item .menu-tag-pill {
  margin-left: auto;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  background: #E4E4E7;
  color: #52525B;
}

/* 侧边栏底部用户信息 (1:1 复刻官方张博文) */
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.user-profile-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.user-avatar-circle {
  width: 32px; height: 32px;
  border-radius: var(--radius-pill);
  background: #E4E4E7;
  color: #18181B;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
}
.user-meta-texts { min-width: 0; }
.user-meta-name { font-size: 13px; font-weight: 600; color: var(--foreground); line-height: 1.2; }
.user-meta-role { font-size: 11.5px; color: var(--muted-foreground); margin-top: 1px; }

/* 页面内容承载容器 */
main#app-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* 官方顶栏 (1:1 复刻) */
header#app-header {
  height: var(--header-h);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn-icon-square {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--foreground);
}
.btn-icon-square:hover { background: var(--muted); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.search-pill-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(244, 244, 245, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0 10px;
  height: 32px;
  width: 200px;
  color: var(--muted-foreground);
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.search-pill-box:hover { background: #fff; border-color: #A1A1AA; }
.kbd-badge {
  font-size: 10px;
  border: 1px solid #D4D4D8;
  border-radius: 4px;
  padding: 1px 4px;
  margin-left: auto;
  font-family: inherit;
  color: var(--muted-foreground);
}
.btn-round-icon {
  width: 32px; height: 32px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted-foreground);
}
.btn-round-icon:hover { background: var(--muted); color: var(--foreground); }

/* 主体容器 */
#main-view-container {
  padding: 24px 28px 48px;
  flex: 1;
}

/* 官方按钮组件规范 (Buttons) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  white-space: nowrap;
  text-decoration: none;
  font-family: inherit;
}
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }
/* 纯黑主按钮 (通过、新增、导出) */
.btn-primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  box-shadow: var(--shadow-xs);
}
.btn-primary:hover { background: var(--primary-hover); }

/* 白底细灰轮廓按钮 (详情、改比例、重置) */
.btn-outline {
  background: #FFFFFF;
  color: var(--foreground);
  border-color: var(--border);
  box-shadow: var(--shadow-xs);
}
.btn-outline:hover { background: var(--muted); border-color: #D4D4D8; }

/* 危险红底按钮 (拒绝、删除) */
.btn-destructive {
  background: var(--destructive);
  color: #FFFFFF;
  border-color: var(--destructive);
  box-shadow: var(--shadow-xs);
}
.btn-destructive:hover { background: var(--destructive-hover); }

/* 幽灵无框按钮 */
.btn-ghost {
  background: transparent;
  color: var(--muted-foreground);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--muted); color: var(--foreground); }

/* 状态 Badge 标签 (1:1 官方规范) */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1.5px 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-success { background: #F0FDF4; color: #15803D; border-color: #DCFCE7; }
.badge-warning { background: #FEFCE8; color: #A16207; border-color: #FEF08A; }
.badge-danger { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
.badge-neutral { background: #FFFFFF; color: #3F3F46; border-color: var(--border); }
.badge-blue { background: #EFF6FF; color: #1D4ED8; border-color: #DBEAFE; }

/* 官方卡片容器 (Cards) */
.content-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  margin-bottom: 20px;
  overflow: hidden;
}
.card-header-bar {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.card-header-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--foreground);
}
.card-body-padding { padding: 18px 20px; }

/* 筛选表单网格 (Filter Box) */
.filter-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  padding: 18px 20px;
  margin-bottom: 20px;
}
.filter-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.filter-title { font-size: 14px; font-weight: 600; color: var(--foreground); }
.filter-inputs-grid {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 140px;
}
.field-label { font-size: 11.5px; font-weight: 500; color: var(--muted-foreground); }
.input-control {
  height: 34px;
  background: #FFFFFF;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 0 10px;
  font-size: 13px;
  color: var(--foreground);
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input-control:focus {
  border-color: #09090B;
  box-shadow: 0 0 0 1px #09090B;
}

/* 官方数据表格 (Data Table) */
.table-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  overflow-x: auto;
}
.table-toolbar {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table-summary-text { color: var(--muted-foreground); }
.table-summary-text strong { color: var(--foreground); }

/* 表格底部翻页器 */
.table-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  background: var(--card);
}
.pager-total { color: var(--muted-foreground); }
.pager-actions { display: flex; align-items: center; gap: 8px; }
.pager-size {
  height: 28px;
  font-size: 12px;
  padding: 0 8px;
  border-radius: var(--radius-md);
  width: auto;
}
.pager-arrow {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--foreground);
  cursor: pointer;
}
.pager-arrow:hover:not(:disabled) { background: var(--accent); }
.pager-arrow:disabled { color: var(--muted-foreground); opacity: .55; cursor: not-allowed; }

/* 日期区间选择器（shadcn/ui 风格） */
.date-range-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
.date-popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  left: auto;
  z-index: 60;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .14);
  padding: 12px;
}
.cal-wrap { display: flex; gap: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; }
.cal-head span { font-size: 12.5px; font-weight: 600; color: var(--foreground); }
.cal-nav {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; border-radius: 6px;
  color: var(--muted-foreground); cursor: pointer;
}
.cal-nav:hover { background: var(--accent); color: var(--foreground); }
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 30px); }
.cal-weekdays div { text-align: center; font-size: 11px; color: var(--muted-foreground); padding: 4px 0; }
.cal-day {
  height: 30px; width: 30px;
  border: none; background: transparent; border-radius: 6px;
  font-size: 12.5px; color: var(--foreground); cursor: pointer;
}
.cal-day:hover { background: var(--accent); }
.cal-day.muted { color: var(--muted-foreground); opacity: .5; }
.cal-day.in-range { background: var(--accent); border-radius: 0; }
.cal-day.edge { background: var(--primary); color: var(--primary-foreground); border-radius: 6px; }
.cal-day.edge:hover { background: var(--primary); }
.cal-day.today { box-shadow: inset 0 0 0 1px var(--border); }
.cal-footer {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px;
}
.cal-presets { display: flex; gap: 2px; }
.cal-preset {
  border: none; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--muted-foreground); padding: 4px 8px; border-radius: 6px;
}
.cal-preset:hover { background: var(--accent); color: var(--foreground); }

table.official-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
table.official-table th {
  padding: 10px 16px;
  color: var(--muted-foreground);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.official-table td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--foreground);
  vertical-align: middle;
  white-space: nowrap;
}
table.official-table tr:last-child td { border-bottom: none; }
table.official-table tbody tr:hover { background: #FAFAFA; }

/* 黏性固定右侧操作列 */
th.col-sticky, td.col-sticky {
  position: sticky;
  right: 0;
  background: var(--card);
  box-shadow: -4px 0 8px rgba(0, 0, 0, 0.02);
  z-index: 2;
}
tbody tr:hover td.col-sticky { background: #FAFAFA; }

.code-badge {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  background: #F4F4F5;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  color: #18181B;
}

/* 分段选项卡 (Segmented Tabs，如计费/扣费页面) */
.segmented-tabs {
  display: inline-flex;
  background: #F4F4F5;
  padding: 3px;
  border-radius: var(--radius-md);
  gap: 2px;
  margin-bottom: 18px;
}
.seg-tab-btn {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted-foreground);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  background: transparent;
}
.seg-tab-btn:hover { color: var(--foreground); }
.seg-tab-btn.active {
  background: #FFFFFF;
  color: var(--foreground);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* 官方模态弹窗 (Modal) */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(9, 9, 11, 0.4);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }
.modal-dialog {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px;
  overflow: hidden;
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-mask.show .modal-dialog { transform: translateY(0) scale(1); }
.modal-dialog-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-dialog-header h3 { font-size: 15.5px; font-weight: 600; color: var(--foreground); }
.modal-dialog-body { padding: 20px; max-height: calc(85vh - 120px); overflow-y: auto; }
.modal-dialog-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: #FAFAFA;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 10px;
}

/* 官方右侧抽屉 (Drawer) */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(9, 9, 11, 0.35);
  backdrop-filter: blur(2px);
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer-panel {
  position: fixed; top: 0; bottom: 0; right: 0;
  width: 560px; max-width: 90vw;
  background: #FFFFFF;
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  z-index: 101;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer-mask.show .drawer-panel { transform: translateX(0); }
.drawer-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.drawer-body { padding: 22px; flex: 1; overflow-y: auto; }
.drawer-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  background: #FAFAFA;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 10px;
}

/* 表单控件通用 */
.form-group { margin-bottom: 16px; }
.form-group-label {
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--foreground);
  margin-bottom: 6px;
}
.form-group-label span.req { color: var(--destructive); margin-left: 2px; }
.form-input-full {
  width: 100%;
  height: 36px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 0 12px;
  font-size: 13px;
  color: var(--foreground);
  background: #fff;
  outline: none;
  font-family: inherit;
}
.form-input-full:focus {
  border-color: #09090B;
  box-shadow: 0 0 0 1px #09090B;
}
.form-input-full:disabled {
  background: #F4F4F5;
  color: var(--muted-foreground);
  cursor: not-allowed;
}
.form-textarea-full {
  width: 100%;
  min-height: 80px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  font-size: 13px;
  color: var(--foreground);
  outline: none;
  font-family: inherit;
  resize: vertical;
}
.form-textarea-full:focus {
  border-color: #09090B;

.choice-card-item {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  height: 38px;
  cursor: pointer;
  background: #FAFAFA;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
.choice-card-item:hover { border-color: #A1A1AA; }
.choice-card-item.selected {
  border-color: #09090B;
  background: #FFFFFF;
  box-shadow: 0 0 0 1px #09090B;
}
.choice-card-item input { accent-color: #09090B; margin: 0; }
.choice-title { font-weight: 500; font-size: 13px; }

/* Toast 轻提示 */
#app-toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #09090B;
  color: #FFFFFF;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px;
  z-index: 200;
  opacity: 0; transform: translateY(8px);
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
#app-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

// 佣金明细引擎：订单 → 分期明细 → 解冻 → 结算
// 月卡 1 期；年卡 12 期；机构订单按合同周期（月）分期；每期在服务月结束 +7 天解冻
// ==========================================
const REF_DATE = '2026-11-06';
const LINE_SETTLED = {};     // 明细 key -> 已结算金额
const LINE_SETTLE_ID = {};   // 明细 key -> 最近一次结算单号

function addMonthsDate(dateStr, m, extraDays) {
  const p = dateStr.slice(0, 10).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1 + m, +p[2] + extraDays)).toISOString().slice(0, 10);
}
function orderKind(o) {
  if (o.kind) return o.kind;
  if (o.status === 'VOID_REFUND' || !(o.points > 0)) return 'NONE';
  if (o.is_upgrade) return 'LUMP';
  if (/年卡/.test(o.product)) return 'YEAR';
  return 'MONTH';
}
function orderStart(o) { return o.start || (o.created_at || '').slice(0, 10); }

function rawKind(o) {
  if (o.kind) return o.kind;
  if (o.is_upgrade) return 'LUMP';
  if (/年卡/.test(o.product)) return 'YEAR';
  return 'MONTH';
}
function orderLines(o, p) {
  o._recover = 0; o._refundShort = 0;
  const voided = o.status === 'VOID_REFUND';
  const kind = voided ? rawKind(o) : orderKind(o);
  if (kind === 'NONE') return [];
  const n = kind === 'YEAR' ? 12 : (kind === 'ORG' ? o.months : 1);
  const total = voided ? Math.abs(o.points) : o.points, start = orderStart(o);
  const totalC = Math.round(total * 100);
  const baseC = Math.round(totalC / n);
  const lines = [];
  for (let k = 1; k <= n; k++) {
    const amt = (n === 1 ? totalC : (k < n ? baseC : totalC - baseC * (n - 1))) / 100;
    const unlock = kind === 'LUMP' ? o.unfreeze_at : addMonthsDate(start, k, GLOBAL_CONFIG.unfreeze_days);
    const key = o.id + '#' + k;
    const settled = voided ? 0 : Math.min(LINE_SETTLED[key] || 0, amt);
    const remaining = voided ? 0 : amt - settled;
    let state;
    if (voided) state = 'REFUND';
    else if (remaining === 0) state = 'SETTLED';
    else if (unlock <= REF_DATE) state = 'UNLOCKED';
    else state = 'FROZEN';
    lines.push({
      key, order_id: o.id, kind, k, n, amt, settled, remaining, unlock, state,
      source: kind === 'ORG' ? o.org_name : o.product,
      customer: kind === 'ORG' ? o.org_name : o.customer_phone,
      pay: o.pay_amount, rate: o.rate, order_total: total,
      period: addMonthsDate(start, k - 1, 0) + ' ~ ' + addMonthsDate(start, k, -1)
    });
  }
  // 退款登记：按退款后的实付重算应收佣金，从最后一期往前抵扣尚未解冻的期次；不足部分计入待追回
  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
  if (refunded > 0 && total > 0) {
    const recover = Math.max(0, round2(total - round2((o.pay_amount - refunded) * o.rate / 100)));
    let left = recover;
    for (let i = lines.length - 1; i >= 0 && left > 0; i--) {
      const l = lines[i];
      if (l.state !== 'FROZEN') continue;
      const cut = Math.min(left, l.remaining);
      const cutC = Math.round(cut * 100) / 100;
      l.remaining = Math.round((l.remaining - cutC) * 100) / 100;
      l.cut = cutC;
      left = Math.round((left - cutC) * 100) / 100;
      if (l.remaining <= 0) { l.remaining = 0; l.state = 'REFUND'; }
    }
    o._recover = recover;
    o._refundShort = left;
  }
  return lines;
}
function partnerLines(p) {
  let all = [];
  p.orders.forEach(o => { all = all.concat(orderLines(o, p)); });
  return all;
}
function recalcPartner(p) {
  let w = 0, f = 0, s = 0, short = 0;
  partnerLines(p).forEach(l => {
    s += l.settled;
    if (l.state === 'UNLOCKED') w += l.remaining;
    else if (l.state === 'FROZEN') f += l.remaining;
  });
  // 退款差额中已解冻/已结算、无法从期次扣回的部分，进入待追回，下次打款扣减
  p.orders.forEach(o => { short += (o._refundShort || 0); });
  p.points = { total: round2(w + f + s), withdrawable: round2(w), frozen: round2(f), settled: round2(s), unrecovered: Math.max(0, round2(short - (p._offsetPaid || 0))) };
}
function recalcAll() { PARTNERS.forEach(recalcPartner); }

// 总销售额：该合伙人所带订单的实付合计，扣除已登记退款
function partnerSales(p) {
  let gmv = 0;
  p.orders.forEach(o => {
    const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
    gmv += Math.max(0, (o.pay_amount || 0) - refunded);
  });
  return gmv;
}

function allocSettled(settleId, keys) {
  const rec = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId);
  const p = PARTNERS.find(x => x.id === rec.partner_id);
  rec.lines = [];
  keys.forEach(key => {
    const l = partnerLines(p).find(x => x.key === key);
    LINE_SETTLED[key] = l.amt;
    LINE_SETTLE_ID[key] = settleId;
    rec.lines.push({ key, order_id: l.order_id, k: l.k, n: l.n, kind: l.kind, source: l.source, amt: l.amt, unlock: l.unlock });
  });
}
function seqKeys(orderId, from, to) { const r = []; for (let k = from; k <= to; k++) r.push(orderId + '#' + k); return r; }

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 14px;">

            <div class="form-group"><label class="form-group-label">订单实付 / 剩余可退</label><div class="form-input-full num" style="background:#FAFAFA;">¥${formatNum(o.pay_amount)} / ¥${formatNum(o.pay_amount - refunded)}</div></div>
            <div class="form-group"><label class="form-group-label">本次退款金额（元）<span class="req">*</span></label><input class="form-input-full num" type="number" id="rf-amount" min="0" max="${o.pay_amount - refunded}" placeholder="如 ${formatNum(o.pay_amount - refunded)}" oninput="refreshRefundPreview()"></div>

        </div>
        <div class="drawer-footer" style="justify-content:space-between;">
          <div>${refunded > 0 ? `<button class="btn btn-outline" onclick="undoRefund('${o.id}')">撤销全部退款登记</button>` : '<span></span>'}</div>

            <button class="btn btn-outline" onclick="closeDrawer('drawer-refund')">取消</button>
            <button class="btn btn-primary" style="background:#DC2626; border-color:#DC2626;" onclick="confirmRefund()">确认退款登记</button>
          </div>
        </div>
      </div>
    </div>`;
  refreshRefundPreview();
}

function refreshRefundPreview() {
  const hit = findOrder(REFUND_ORDER_ID); if (!hit) return;
  const { p, o } = hit;
  const box = document.getElementById('rf-preview'); if (!box) return;
  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
  const amount = parseFloat(document.getElementById('rf-amount').value) || 0;
  const max = o.pay_amount - refunded;
  if (!(amount > 0)) { box.innerHTML = '<div style="margin-top:14px; font-size:12.5px; color:var(--muted-foreground);">填写退款金额后，这里会预览佣金扣回结果。</div>'; return; }
  if (amount > max) { box.innerHTML = `<div style="margin-top:14px; font-size:12.5px; color:#DC2626;">退款金额不能超过剩余可退金额 ¥${formatNum(max)}。</div>`; return; }
  const preview = Object.assign({}, o);
  preview.refunds = (o.refunds || []).concat([{ amount }]);
  const lines = orderLines(preview, p);
  const cuts = lines.filter(l => l.cut > 0);
  const applied = cuts.reduce((a, l) => a + l.cut, 0);
  const short = preview._refundShort || 0;
  box.innerHTML = `
    <div style="margin-top:14px; background:#FFF7ED; border:1px solid #FDBA74; border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.9;">
      应扣回佣金 <strong class="num">¥${fmtC(preview._recover)}</strong>
      · 可从未解冻期次扣回 <strong class="num" style="color:#15803D;">¥${fmtC(applied)}</strong>
      · 计入待追回 <strong class="num" style="color:#DC2626;">¥${fmtC(short)}</strong>
      ${cuts.length ? `<div style="margin-top:6px; color:var(--muted-foreground);">扣回期次：${cuts.map(l => `第 ${l.k}/${l.n} 期 −¥${fmtC(l.cut)}`).join('、')}</div>` : ''}
      ${short > 0 ? '<div style="margin-top:6px; color:#B45309;">该差额涉及已解冻或已结算佣金，将挂入该合伙人的待追回金额，下次打款时扣减。</div>' : ''}
      <div style="margin-top:6px; color:var(--muted-foreground);">退款后本单佣金：¥${fmtC(Math.max(0, o.points - preview._recover))}（原 ¥${fmtC(o.points)}）</div>
    </div>`;
}

function confirmRefund() {
  const hit = findOrder(REFUND_ORDER_ID); if (!hit) return;
  const { p, o } = hit;
  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
  const amount = parseFloat(document.getElementById('rf-amount').value) || 0;
  const date = document.getElementById('rf-date').value;
  const voucher = document.getElementById('rf-voucher').value.trim();
  const reason = document.getElementById('rf-reason').value.trim();
  if (!(amount > 0)) { toast('请填写本次退款金额'); return; }
  if (amount > o.pay_amount - refunded) { toast('退款金额不能超过剩余可退金额 ¥' + formatNum(o.pay_amount - refunded)); return; }
  if (!date) { toast('请选择退款日期'); return; }
  if (!reason) { toast('请填写退款原因'); return; }
  const beforeRecover = o._recover || 0;
  if (!o.refunds) o.refunds = [];
  o.refunds.push({ amount, date, voucher, reason, operator: '运营', time: nowTime() });
  orderLines(o, p);
  recalcPartner(p);
  const delta = o._recover - beforeRecover;
  const vcText = voucher ? ' · 凭证 ' + voucher : '';
  const shortMsg = o._refundShort > 0 ? ' · 差额 ¥' + fmtC(o._refundShort) + ' 计入待追回' : '';
  p.flow.unshift({ time: nowTime(), order_id: o.id, type: '退款扣除', points: delta > 0 ? '-¥' + fmtC(delta) : '¥0', status: `退款 ¥${formatNum(amount)}${vcText}${shortMsg}` });
  p.logs.unshift({ time: nowTime(), operator: '运营', action: '手工退款登记', before: `本单佣金 ¥${fmtC(Math.max(0, o.points - beforeRecover))}`, after: `本单佣金 ¥${fmtC(Math.max(0, o.points - o._recover))}`, reason: `退款 ¥${formatNum(amount)}${vcText}，扣回 ¥${fmtC(delta)}${shortMsg}` });
  recalcAll();
  closeDrawer('drawer-refund');
  toast(`退款登记成功：扣回佣金 ¥${fmtC(delta)}，合伙人端佣金已同步`);
  renderOrdersView(document.getElementById('main-view-container'));
}

function undoRefund(orderId) {
  const hit = findOrder(orderId); if (!hit) return;
  const { p, o } = hit;
  if (!confirm('确定撤销该订单的全部退款登记？撤销后将恢复原佣金与可结算金额。')) return;
  const before = o._recover || 0;
  o.refunds = [];
  orderLines(o, p);
  recalcPartner(p);
  p.flow.unshift({ time: nowTime(), order_id: o.id, type: '退款撤销', points: before > 0 ? '+¥' + fmtC(before) : '¥0', status: '撤销退款登记，恢复原订单佣金' });
  p.logs.unshift({ time: nowTime(), operator: '运营', action: '撤销退款登记', before: `本单佣金 ¥${fmtC(o.points - before)}`, after: `本单佣金 ¥${fmtC(o.points)}`, reason: '撤销手工退款登记' });
  recalcAll();
  closeDrawer('drawer-refund');
  toast('已撤销退款登记，佣金与可结算金额已恢复');
  renderOrdersView(document.getElementById('main-view-container'));
}

let SHEET = null;

function prevMonthEnd(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(1); d.setMonth(d.getMonth() - 1);
  const y = d.getFullYear(), m = d.getMonth();
  const last = new Date(y, m + 1, 0).getDate();
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(last).padStart(2, '0')}`;
}

function openSettleSheet(pid) {

  const autoVoucher = 'BCM' + REF_DATE.replace(/-/g, '') + Math.floor(1000 + Math.random() * 8999);

            <tbody>${lines.map(l => `

function updateSheetTotal() {
  const sel = SHEET.lines.filter(l => SHEET.checked.has(l.key));
  const gross = sel.reduce((a, l) => a + l.remaining, 0);
  const p = PARTNERS.find(x => x.id === SHEET.pid);
  const offset = p ? Math.min(p.points.unrecovered || 0, gross) : 0;
  document.getElementById('sheet-total').textContent = '¥' + fmtC(gross - offset);
  document.getElementById('sheet-offset').textContent = offset > 0 ? `明细合计 ¥${fmtC(gross)} · 扣减待追回 ¥${fmtC(offset)}` : '';
  document.getElementById('sheet-count').textContent = `（已选 ${sel.length}/${SHEET.lines.length} 条明细）`;
}
function toggleSheetLine(el) {
  if (el.checked) SHEET.checked.add(el.dataset.key); else SHEET.checked.delete(el.dataset.key);
  updateSheetTotal();
}
function sheetSelectAll(on) {
  document.querySelectorAll('.sheet-chk').forEach(el => {
    el.checked = on;
    if (on) SHEET.checked.add(el.dataset.key); else SHEET.checked.delete(el.dataset.key);
  });
  updateSheetTotal();
}
function confirmSettleSheet() {
  const p = PARTNERS.find(x => x.id === SHEET.pid); if (!p) return;
  const sel = SHEET.lines.filter(l => SHEET.checked.has(l.key));
  if (!sel.length) { toast('请至少勾选一条结算明细'); return; }
  const voucher = document.getElementById('sheet-voucher').value.trim();
  if (!voucher) { toast('请填写财务打款凭证流水号'); return; }
  const op = document.getElementById('sheet-op').value.trim() || '财务';
  const rem = document.getElementById('sheet-rem').value.trim();
  const total = sel.reduce((a, l) => a + l.remaining, 0);
  const offset = Math.min(p.points.unrecovered || 0, total);
  const net = total - offset;
  const before = p.points.withdrawable;
  const bNo = 'SETTLE-' + REF_DATE.slice(0, 7).replace('-', '') + '-' + Math.floor(100 + Math.random() * 899);
  sel.forEach(l => { LINE_SETTLED[l.key] = (LINE_SETTLED[l.key] || 0) + l.remaining; LINE_SETTLE_ID[l.key] = bNo; });
  const rec = {
    settle_id: bNo, partner_id: p.id, partner_name: p.name, partner_phone: p.phone, channel_type: p.channel_type,
    points: net, gross: total, offset, voucher, operator: op, settle_time: nowTime(), remark: rem,
    lines: sel.map(l => ({ key: l.key, order_id: l.order_id, k: l.k, n: l.n, kind: l.kind, source: l.source, amt: l.remaining, unlock: l.unlock }))
  };
  SETTLEMENT_HISTORY.unshift(rec);
  p._offsetPaid = (p._offsetPaid || 0) + offset;
  p.settlements.unshift({ batch_no: bNo, points: net, gross: total, offset, voucher, operator: op, time: rec.settle_time, remark: rem });
  p.flow.unshift({ time: rec.settle_time, order_id: bNo, type: '线下结算核销', points: '-¥' + fmtC(net), status: `凭证 ${voucher} 已完成打款（${sel.length} 条明细）${offset > 0 ? ' · 扣减退款待追回 ¥' + fmtC(offset) : ''}` });
  recalcPartner(p);
  p.logs.unshift({ time: rec.settle_time, operator: op, action: '线下结算打款核销', before: `可结算 ¥${fmtC(before)}`, after: `可结算 ¥${fmtC(p.points.withdrawable)}`, reason: `结算 ${sel.length} 条明细合计 ¥${fmtC(total)}${offset > 0 ? '，扣减退款待追回 ¥' + fmtC(offset) : ''}，实结 ¥${fmtC(net)}，凭证 ${voucher}` });
  closeDrawer('drawer-settle');
  toast(`结算成功：${sel.length} 条明细，实结 ¥${fmtC(net)}${offset > 0 ? '（已扣减退款待追回 ¥' + fmtC(offset) + '）' : ''}，已同步合伙人端`);
  renderSettlementsView(document.getElementById('main-view-container'));
}

function revokeSettlement(settleId) {
  const s = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId); if (!s) return;
  if (s.imported) { toast('该结算单为机构订单录入时已发放，不支持撤销'); return; }

function computeOrgPreview(f) {
  const res = { ok: false, msg: '', lines: [], total: 0, alloc: [] };
  if (!(f.amount > 0) || isNaN(f.rate) || f.rate < 0 || f.rate > 100 || !f.start || !(f.months >= 1 && f.months <= 60)) { res.msg = '填写合同金额、分成比例、服务起始日和周期后，这里会预览分期明细'; return res; }
  const total = round2(f.amount * f.rate / 100);
  const n = f.months;
  const totalC = Math.round(total * 100), baseC = Math.round(totalC / n);
  res.total = total;
  let left = f.paid, unlockedSum = 0;
  for (let k = 1; k <= n; k++) {
    const amt = (k < n ? baseC : totalC - baseC * (n - 1)) / 100;
    const unlock = addMonthsDate(f.start, k, GLOBAL_CONFIG.unfreeze_days);
    const done = unlock <= REF_DATE;
    if (done) unlockedSum += amt;
    let a = 0;
    if (left > 0) { a = Math.min(left, amt); left -= a; }
    res.lines.push({ k, n, amt, unlock, done, alloc: a, period: addMonthsDate(f.start, k - 1, 0) + ' ~ ' + addMonthsDate(f.start, k, -1) });
  }
  res.unlockedSum = unlockedSum;
  if (f.paid > total) res.msg = `已发放金额不能超过应分佣金总额 ¥${fmtC(total)}`;
  else if (f.paid > unlockedSum) res.msg = `已发放金额不能超过截至今日已解冻金额 ¥${fmtC(unlockedSum)}`;
  else res.ok = true;
  return res;
}

function parseRoute() {
  const hash = location.hash.replace(/^#/, '') || 'applications';
  const parts = hash.split('/');
  currentRoute = parts[0];
  if (parts[0] === 'partner' && parts[1]) {

// 通用列表翻页器
let pageState = {};
function pageMeta(key, total) {
  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });
  const pages = Math.max(1, Math.ceil(total / st.size));
  if (st.page > pages) st.page = pages;
  return { st, pages, start: (st.page - 1) * st.size };
}
function pagedList(key, arr) {
  const m = pageMeta(key, arr.length);
  return arr.slice(m.start, m.start + m.st.size);
}
function resetPage(key) {
  if (pageState[key]) pageState[key].page = 1;
}
function goPage(key, page) {
  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });
  st.page = Math.max(1, page);
  renderActiveView();
}
function setPageSize(key, size) {
  pageState[key] = { page: 1, size: parseInt(size, 10) || 20 };
  renderActiveView();
}
function pagerBar(key, total) {
  const { st, pages } = pageMeta(key, total);
  return `
    <div class="table-pager">
      <div class="pager-total">共 ${total} 条 · 第 ${st.page}/${pages} 页</div>
      <div class="pager-actions">
        <select class="input-control pager-size" onchange="setPageSize('${key}', this.value)">
          <option value="20" ${st.size === 20 ? 'selected' : ''}>20 条/页</option>
          <option value="50" ${st.size === 50 ? 'selected' : ''}>50 条/页</option>
        </select>
        <button class="pager-arrow" ${st.page <= 1 ? 'disabled' : ''} onclick="goPage('${key}', ${st.page - 1})">‹ 上一页</button>
        <button class="pager-arrow" ${st.page >= pages ? 'disabled' : ''} onclick="goPage('${key}', ${st.page + 1})">下一页 ›</button>
      </div>
    </div>`;
}

function renderActiveView() {
  const container = document.getElementById('main-view-container');
  if (currentRoute === 'applications') renderApplicationsView(container);

// ---------------- 申请时间区间选择器（shadcn/ui 风格） ----------------
function pad2(n) { return String(n).padStart(2, '0'); }
function ymAdd(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function ymLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${y} 年 ${m} 月`;
}
function monthCells(ym) {
  const [y, m] = ym.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m - 1, 0).getDate();
  const prevYm = ymAdd(ym, -1);
  const nextYm = ymAdd(ym, 1);
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    cells.push({ date: `${prevYm}-${pad2(prevDays - i)}`, day: prevDays - i, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: `${ym}-${pad2(d)}`, day: d, muted: false });
  }
  let n = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: `${nextYm}-${pad2(n)}`, day: n, muted: true });
    n++;
  }
  return cells;
}
function calMonthHtml(ym) {
  const chevronL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';
  const chevronR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>';
  return `
    <div>
      <div class="cal-head">
        <button type="button" class="cal-nav" onclick="shiftAppCal(-1)">${chevronL}</button>
        <span>${ymLabel(ym)}</span>
        <button type="button" class="cal-nav" onclick="shiftAppCal(1)">${chevronR}</button>
      </div>
      <div class="cal-weekdays">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">
        ${monthCells(ym).map(c => {
          const isFrom = c.date === appTmpFrom;
          const isTo = c.date === appTmpTo;
          const inRange = appTmpFrom && appTmpTo && c.date > appTmpFrom && c.date < appTmpTo;
          const cls = ['cal-day', c.muted ? 'muted' : '', (isFrom || isTo) ? 'edge' : '', inRange ? 'in-range' : '', c.date === REF_DATE ? 'today' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" onclick="pickAppDate('${c.date}')">${c.day}</button>`;
        }).join('')}
      </div>
    </div>`;
}
function dateRangePickerHtml() {
  return `
    <div class="date-popover" onclick="event.stopPropagation()">
      <div class="cal-wrap">
        ${calMonthHtml(appCalMonth)}
        ${calMonthHtml(ymAdd(appCalMonth, 1))}
      </div>
      <div class="cal-footer">
        <div class="cal-presets">
          <button type="button" class="cal-preset" onclick="setAppRangePreset('7')">近 7 天</button>
          <button type="button" class="cal-preset" onclick="setAppRangePreset('month')">本月</button>
          <button type="button" class="cal-preset" onclick="clearAppDatePicker()">清空</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeAppDatePicker()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="applyAppDatePicker()">确定</button>
        </div>
      </div>
    </div>`;
}
function appDocClick() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function toggleAppDatePicker() {
  appPickerOpen = !appPickerOpen;
  if (appPickerOpen) {
    appTmpFrom = appFrom;
    appTmpTo = appTo;
    setTimeout(() => document.addEventListener('click', appDocClick), 0);
  } else {
    document.removeEventListener('click', appDocClick);
  }
  renderActiveView();
}
function closeAppDatePicker() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function applyAppDatePicker() {
  appFrom = appTmpFrom;
  appTo = appTmpTo;
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  resetPage('apps');
  renderActiveView();
}
function clearAppDatePicker() {
  appTmpFrom = '';
  appTmpTo = '';
  renderActiveView();
}
function shiftAppCal(delta) {
  appCalMonth = ymAdd(appCalMonth, delta);
  renderActiveView();
}
function pickAppDate(date) {
  if (!appTmpFrom || appTmpTo) {
    appTmpFrom = date;
    appTmpTo = '';
  } else if (date < appTmpFrom) {
    appTmpTo = appTmpFrom;
    appTmpFrom = date;
  } else {
    appTmpTo = date;
  }
  renderActiveView();
}
function setAppRangePreset(type) {
  const shift = offset => {
    const d = new Date(REF_DATE + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  };
  if (type === '7') {
    appTmpFrom = shift(-6);
    appTmpTo = REF_DATE;
  } else if (type === 'month') {
    appTmpFrom = REF_DATE.slice(0, 7) + '-01';
    appTmpTo = REF_DATE;
  }
  renderActiveView();
}

          ${p.orders.length === 0 ? '<tr><td colspan="9" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无带单订单</td></tr>' : rows.map(o => `
            <tr>
              <td><span class="code-badge">${o.id}</span></td>
              <td>${o.kind === 'ORG' ? `<strong>${o.org_name}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">合同 ${o.contract_no}</div>` : `<strong class="num">${o.customer_phone}</strong>`}</td>
              <td>
                ${productName(o)}
                <div style="margin-top:3px;">${productTagHtml(o)}${o.months ? ` <span class="badge badge-neutral" style="font-size:10px;">${o.months} 个月服务期</span>` : ''}</div>
              </td>
              <td><span class="num">¥${o.pay_amount.toFixed(2)}</span></td>
              <td><span class="num">${o.rate.toFixed(1)}%</span></td>
              <td>
                <strong class="num" style="color: ${o.points > 0 ? '#15803D' : (o.points < 0 ? 'var(--destructive)' : 'var(--muted-foreground)')};">
                  ${o.points > 0 ? '+¥' : (o.points < 0 ? '-¥' : '¥')}${fmtC(Math.abs(o.points))}
                </strong>
              </td>
              <td>${orderStatusHtml(o, p)}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${orderUnfreezeText(o, p)}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${o.created_at}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${pagerBar(key, p.orders.length)}
    `;
  }

  if (tab === 'flow') {
    const key = 'det-flow-' + p.id;
    const rows = pagedList(key, p.flow);
    return `
      <table class="official-table">
        <thead>
          <tr>
            <th>入账时间</th>
            <th>关联单据</th>
            <th>明细类型</th>
            <th>变动金额</th>
            <th>状态说明与流水附言</th>
          </tr>
        </thead>
        <tbody>
          ${p.flow.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无流水</td></tr>' : rows.map(f => `
            <tr>
              <td style="color: var(--muted-foreground); font-size:12px;">${f.time}</td>
              <td><span class="code-badge">${f.order_id}</span></td>
              <td><strong>${f.type}</strong></td>
              <td>
                <strong class="num" style="color: ${f.points.startsWith('+') ? '#15803D' : 'var(--destructive)'};">
                  ${f.points.startsWith('+') ? '+¥' + f.points.slice(1) : (f.points.startsWith('-') ? '-¥' + f.points.slice(1) : '¥' + f.points)}
                </strong>
              </td>
              <td style="color: var(--muted-foreground); font-size:12px;">${f.status}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${pagerBar(key, p.flow.length)}
    `;
  }

  if (tab === 'settlements') {
    const key = 'det-settle-' + p.id;
    const rows = pagedList(key, p.settlements);
    return `
      <table class="official-table">
        <thead>
          <tr>
            <th>结算单号</th>
            <th>核销金额</th>
            <th>财务打款凭证号</th>
            <th>经办人</th>
            <th>核销时间</th>
            <th>打款备注说明</th>
          </tr>
        </thead>
        <tbody>
          ${p.settlements.length === 0 ? '<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无核销记录</td></tr>' :
          rows.map(s => `
            <tr>
              <td><span class="code-badge">${s.batch_no}</span></td>
              <td><strong class="num" style="color: #15803D;">-¥${fmtC(s.points)}</strong></td>
              <td><span class="code-badge">${s.voucher}</span></td>
              <td>${s.operator}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${s.time}</td>
              <td style="color: var(--muted-foreground); font-size:12px;">${s.remark}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${pagerBar(key, p.settlements.length)}
    `;
  }

  if (tab === 'logs') {
    const key = 'det-logs-' + p.id;
    const rows = pagedList(key, p.logs);
    return `
      <div style="padding: 18px 20px;">
        ${rows.map(log => `
          <div style="padding: 10px 0; border-bottom: 1px solid var(--border); font-size:13px;">
            <div style="display:flex; justify-content:space-between; color:var(--muted-foreground); font-size:11.5px;">
              <span>${log.time} · 操作人: <strong>${log.operator}</strong></span>
              <span>${log.action}</span>
            </div>
            <div style="margin-top: 4px; font-weight: 500;">
              ${log.before ? `变更: [${log.before} → ${log.after}]` : ''}
              <span style="color: var(--muted-foreground); font-weight:normal; margin-left:6px;">说明: ${log.reason}</span>
            </div>
          </div>
        `).join('')}
      </div>
      ${pagerBar(key, p.logs.length)}
    `;
  }

  return '';
}

// ==========================================
// 4. 页面：结算管理 (SETTLEMENTS)
// ==========================================
let settleSubTab = 'pending';
let settleKw = '';

function renderSettlementsView(container) {
  const pendingPartners = PARTNERS.filter(p => p.points.withdrawable > 0);
  const totalPending = pendingPartners.reduce((s, p) => s + p.points.withdrawable, 0);
  const sumLines = (p, kind) => partnerLines(p).filter(l => l.state === 'UNLOCKED' && (kind === 'ORG' ? l.kind === 'ORG' : l.kind !== 'ORG')).reduce((a, l) => a + l.remaining, 0);
  const orgPending = pendingPartners.reduce((s, p) => s + sumLines(p, 'ORG'), 0);
  const tabBtn = (key, label, cnt) => `<button class="seg-tab-btn ${settleSubTab === key ? 'active' : ''}" onclick="settleSubTab='${key}'; renderSettlementsView(document.getElementById('main-view-container'))">${label} (${cnt})</button>`;
  const headerBtn = settleSubTab === 'pending'
    ? ''
    : `<button class="btn btn-outline" onclick="toast('已导出历史对账报表')">导出结算台账</button>`;

  let body = '';
  if (settleSubTab === 'pending') {
    const pagedPending = pagedList('settle-pending', pendingPartners);
    body = `
      <div style="background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-xl); padding:14px 20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:13.5px;">当前共有 <strong>${pendingPartners.length}</strong> 位合伙人有可结算明细，待打款合计 <strong class="num" style="font-size:17px; color:#15803D;">¥${fmtC(totalPending)}</strong>
          <span style="color:var(--muted-foreground); font-size:12.5px;">（线上套餐 ¥${fmtC(totalPending - orgPending)} · 机构订单 ¥${fmtC(orgPending)}）</span></div>
        <div style="font-size:12px; color:var(--muted-foreground);">结算周期：每月仅结算上月最后一日（含）前解冻的佣金</div>
      </div>
      <div class="table-container">
        <table class="official-table">
          <thead><tr>
            <th>合伙人 / 单位</th><th>渠道</th><th>账号状态</th><th>可结算构成</th><th>可结算金额</th><th>最早解冻日</th>
            <th class="col-sticky" style="text-align:right;">操作</th>
          </tr></thead>
          <tbody>
            ${pendingPartners.length === 0 ? '<tr><td colspan="7" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无可结算明细</td></tr>' : pagedPending.map(p => {
              const ls = partnerLines(p).filter(l => l.state === 'UNLOCKED');
              const orders = new Set(ls.map(l => l.order_id)).size;
              const earliest = ls.map(l => l.unlock).sort()[0];
              const on = sumLines(p, 'ONLINE'), og = sumLines(p, 'ORG');
              return `<tr>
                <td><strong>${p.name}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">${p.org}</div><div class="num" style="font-size:11.5px; color:var(--muted-foreground);">${p.phone}</div></td>
                <td>${p.channel_type === 'INTERNAL' ? '<span class="badge badge-blue">内部</span>' : '<span class="badge badge-neutral">外部</span>'}</td>
                <td>${p.status === 'NORMAL' ? '<span class="badge badge-success">正常</span>' : '<span class="badge badge-warning" title="账号已冻结，请审慎核销">已冻结</span>'}</td>
                <td style="font-size:12.5px;">${on > 0 ? `线上套餐 <span class="num">¥${fmtC(on)}</span>` : ''}${on > 0 && og > 0 ? '<br>' : ''}${og > 0 ? `机构订单 <span class="num">¥${fmtC(og)}</span>` : ''}
                  <div style="font-size:11.5px; color:var(--muted-foreground);">${orders} 笔订单 · ${ls.length} 期明细</div></td>
                <td><strong class="num" style="color:#15803D; font-size:15px;">¥${fmtC(p.points.withdrawable)}</strong></td>
                <td style="color:var(--muted-foreground); font-size:12px;">${earliest}</td>
                <td class="col-sticky" style="text-align:right;">${p.status === 'FROZEN'
                  ? `<button class="btn btn-outline btn-sm" disabled title="该合伙人账号已冻结，请先解冻账号">不可结算</button>`
                  : `<button class="btn btn-primary btn-sm" onclick="openSettleSheet('${p.id}')">核对并结算</button>`}</td>
              </tr>`; }).join('')}
          </tbody>
        </table>
        ${pagerBar('settle-pending', pendingPartners.length)}
      </div>`;
  } else {
    const pagedHistory = pagedList('settle-history', SETTLEMENT_HISTORY);
    body = `
      <div class="table-container">
        <table class="official-table">
          <thead><tr><th>结算单号</th><th>合伙人</th><th>渠道</th><th>结算金额</th><th>结算内容</th><th>财务打款凭证号</th><th>经办人</th><th>核销时间</th><th>打款备注</th><th class="col-sticky" style="text-align:right;">操作</th></tr></thead>
          <tbody>${pagedHistory.map(s => {
            const ls = s.lines || [];
            const hasOrg = ls.some(l => l.kind === 'ORG'), hasOn = ls.some(l => l.kind !== 'ORG');
            return `<tr>
              <td><span class="code-badge">${s.settle_id}</span>${s.imported ? '<div><span class="badge badge-neutral" style="font-size:10.5px;">录入时已发放</span></div>' : ''}</td>
              <td><strong>${s.partner_name}</strong><div class="num" style="font-size:11.5px; color:var(--muted-foreground);">${s.partner_phone}</div></td>
              <td>${s.channel_type === 'INTERNAL' ? '<span class="badge badge-blue">内部</span>' : '<span class="badge badge-neutral">外部</span>'}</td>
              <td><strong class="num" style="color:#15803D;">-¥${fmtC(s.points)}</strong></td>
              <td style="font-size:12.5px;">${ls.length} 期明细<div style="font-size:11.5px; color:var(--muted-foreground);">${[hasOn ? '线上套餐' : '', hasOrg ? '机构订单' : ''].filter(Boolean).join(' + ')}</div></td>
              <td><span class="code-badge">${s.voucher}</span></td>
              <td>${s.operator}</td>
              <td style="color:var(--muted-foreground); font-size:12px;">${s.settle_time}</td>
              <td style="color:var(--muted-foreground); font-size:12px; max-width:200px;" title="${esc(s.remark)}">${esc(s.remark)}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                <button class="btn btn-outline btn-sm" onclick="openSettleDetail('${s.settle_id}')">查看明细</button>
                <button class="btn btn-outline btn-sm" onclick="openEditVoucherModal('${s.settle_id}')">修改备注</button>
                ${s.imported ? '' : `<button class="btn btn-outline btn-sm" onclick="revokeSettlement('${s.settle_id}')">撤销结算</button>`}
                <button class="btn btn-outline btn-sm" onclick="navigate('partner/${s.partner_id}/settlements')">合伙人详情</button>
              </td></tr>`; }).join('')}
          </tbody>
        </table>
        ${pagerBar('settle-history', SETTLEMENT_HISTORY.length)}
      </div>`;
  }

  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;">
      <div>
        <h1 style="font-size:24px; font-weight:700; color:var(--foreground); letter-spacing:-0.02em;">结算管理</h1>
      </div>
      <div>${headerBtn}</div>
    </div>
    <div class="segmented-tabs">
      ${tabBtn('pending', '待结算', pendingPartners.length)}
      ${tabBtn('history', '结算历史', SETTLEMENT_HISTORY.length)}
    </div>
    ${body}
  `;
}

// ==========================================
// 4.5 页面：订单管理 (ORDERS)
// ==========================================
let orderSubTab = 'user';
let ordKw = '';
let ordStatus = 'ALL';
let ordKindFilter = 'ALL';

function ordIsRefunded(o) {
  return (o.refunds || []).length > 0 || o.status === 'VOID_REFUND';
}
function ordCategory(o) {
  if (o.is_upgrade) return 'LUMP';
  if (/加油包/.test(o.product)) return 'PACK';
  return orderKind(o);
}

function allUserOrders() {
  const r = [];
  PARTNERS.forEach(p => p.orders.forEach(o => { if (orderKind(o) !== 'ORG') r.push({ p, o, lines: orderLines(o, p) }); }));
  return r.sort((a, b) => (b.o.created_at || '').localeCompare(a.o.created_at || ''));
}

function renderOrdersView(container) {
  const userOrders = allUserOrders();
  const orgOrders = allOrgOrders();
  const tabBtn = (key, label, cnt) => `<button class="seg-tab-btn ${orderSubTab === key ? 'active' : ''}" onclick="orderSubTab='${key}'; resetPage('orders-user'); resetPage('orders-org'); renderOrdersView(document.getElementById('main-view-container'))">${label} (${cnt})</button>`;
  const headerBtn = orderSubTab === 'user'
    ? ''
    : `<button class="btn btn-primary" onclick="openOrgEntryDrawer()">＋ 录入机构订单</button>`;
  let body = '';
  if (orderSubTab === 'user') {
    const kw = ordKw.trim().toLowerCase();
    const filteredUserOrders = userOrders.filter(({ p, o }) => {
      if (ordStatus === 'PAID' && ordIsRefunded(o)) return false;
      if (ordStatus === 'REFUNDED' && !ordIsRefunded(o)) return false;
      if (ordKindFilter !== 'ALL' && ordCategory(o) !== ordKindFilter) return false;
      if (!kw) return true;
      return o.id.toLowerCase().includes(kw)
        || o.customer_phone.includes(kw)
        || p.name.toLowerCase().includes(kw)
        || (p.code || '').toLowerCase().includes(kw)
        || productName(o).toLowerCase().includes(kw);
    });
    const filteredUserPay = filteredUserOrders.reduce((a, { o }) => {
      const refunded = (o.refunds || []).reduce((s, r) => s + r.amount, 0);
      return a + Math.max(0, o.status === 'VOID_REFUND' ? 0 : (o.pay_amount || 0) - refunded);
    }, 0);
    const filteredUserPoints = filteredUserOrders.reduce((a, { o }) => a + Math.max(0, (o.points || 0) - (o._recover || 0)), 0);
    const pagedUserOrders = pagedList('orders-user', filteredUserOrders);
    body = `
      <div class="filter-card">
        <div class="filter-title-row">
          <span class="filter-title">筛选订单</span>
          <button class="btn btn-outline btn-sm" onclick="ordKw=''; ordStatus='ALL'; ordKindFilter='ALL'; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">重置</button>
        </div>
        <div class="filter-inputs-grid">
          <div class="filter-field" style="flex: 2; min-width: 280px;">
            <span class="field-label">关键词</span>
            <input class="input-control" type="text" placeholder="订单编号、客户手机号、合伙人姓名、推荐码、套餐名" value="${ordKw}" oninput="ordKw=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">
          </div>
          <div class="filter-field" style="flex: 1;">
            <span class="field-label">订单状态</span>
            <select class="input-control" onchange="ordStatus=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">
              <option value="ALL" ${ordStatus==='ALL'?'selected':''}>全部状态</option>
              <option value="PAID" ${ordStatus==='PAID'?'selected':''}>已支付</option>
              <option value="REFUNDED" ${ordStatus==='REFUNDED'?'selected':''}>已退款</option>
            </select>
          </div>
          <div class="filter-field" style="flex: 1;">
            <span class="field-label">套餐类型</span>
            <select class="input-control" onchange="ordKindFilter=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">
              <option value="ALL" ${ordKindFilter==='ALL'?'selected':''}>全部套餐</option>
              <option value="MONTH" ${ordKindFilter==='MONTH'?'selected':''}>月卡</option>
              <option value="YEAR" ${ordKindFilter==='YEAR'?'selected':''}>年卡</option>
              <option value="PACK" ${ordKindFilter==='PACK'?'selected':''}>加油包</option>
              <option value="LUMP" ${ordKindFilter==='LUMP'?'selected':''}>升级补差</option>
            </select>
          </div>
        </div>
      </div>
      <div style="background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-xl); padding:14px 20px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:28px; align-items:center; font-size:13px;">
        <div>订单总数 <strong class="num">${filteredUserOrders.length}</strong> 笔</div>
        <div>总销售金额 <strong class="num">¥${formatNum(filteredUserPay)}</strong></div>
        <div>佣金合计 <strong class="num">${filteredUserPoints < 0 ? '-¥' + fmtC(Math.abs(filteredUserPoints)) : '¥' + fmtC(filteredUserPoints)}</strong></div>
      </div>
      <div class="table-container">
        <table class="official-table">
          <thead><tr><th>订单编号</th><th>下单客户</th><th>商品名称</th><th>归属合伙人</th><th>订单状态</th><th>订单金额</th><th>分成比例</th><th>本单佣金</th><th>下单时间</th><th class="col-sticky" style="text-align:right;">操作</th></tr></thead>
          <tbody>${filteredUserOrders.length === 0 ? '<tr><td colspan="10" style="text-align:center; padding:32px; color:var(--muted-foreground);">没有符合条件的订单</td></tr>' : pagedUserOrders.map(({ p, o, lines }) => {
            const netPoints = Math.max(0, o.points - (o._recover || 0));
            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';
            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';
            const payBadge = isRefund
              ? '<span class="badge badge-danger" style="font-size:10.5px;">已退款</span>'
              : '<span class="badge badge-success" style="font-size:10.5px;">已支付</span>';
            return `<tr>
              <td><span class="code-badge">${o.id}</span></td>
              <td><strong class="num">${o.customer_phone}</strong></td>
              <td style="font-size:12.5px;">${productName(o)}<div style="margin-top:3px;">${productTagHtml(o)}</div></td>
              <td><strong>${p.name}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道</div></td>
              <td>${payBadge}</td>
              <td class="num">¥${formatNum(o.pay_amount)}</td>
              <td class="num">${o.rate.toFixed(1)}%</td>
              <td><strong class="num" style="color:${pc};">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong>${o._recover > 0 ? `<div style="font-size:11px; color:var(--destructive);">原 +¥${fmtC(o.points)} · 扣回 ¥${fmtC(o._recover)}</div>` : ''}</td>
              <td class="num" style="color:var(--muted-foreground); font-size:11.5px;">${o.created_at}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                ${lines.length ? `<button class="btn btn-outline btn-sm" onclick="showOrderLines('${o.id}')">分期明细</button>` : ''}
                ${o.points > 0 && refunded < o.pay_amount ? `<button class="btn btn-outline btn-sm" onclick="openRefundDrawer('${o.id}')">退款登记</button>` : ''}
              </td></tr>`; }).join('')}
          </tbody>
        </table>
        ${pagerBar('orders-user', userOrders.length)}
      </div>`;
  } else {
    const pagedOrgOrders = pagedList('orders-org', orgOrders);
    body = `
      <div class="content-card" style="padding:14px 20px; margin-bottom:16px; font-size:12.5px; color:var(--muted-foreground); line-height:1.7;">
        机构版为线下签合同，由运营<strong style="color:var(--foreground);">手动录入</strong>：合同金额、分成比例、服务周期、已发放金额。录入后与年卡规则一致，按月分期解冻（服务月结束 +7 天）；解冻后的明细在「结算管理 · 待结算」中统一核对结算。
      </div>
      <div class="table-container">
        <table class="official-table">
          <thead><tr><th>合同编号</th><th>机构名称</th><th>商品名称</th><th>合伙人</th><th>订单状态</th><th>订单金额</th><th>分成比例</th><th>本单佣金</th><th>下单时间</th><th class="col-sticky" style="text-align:right;">操作</th></tr></thead>
          <tbody>${orgOrders.length === 0 ? '<tr><td colspan="10" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无机构订单，点击右上角「录入机构订单」</td></tr>' : pagedOrgOrders.map(({ p, o, lines }) => {
            const netPoints = Math.max(0, o.points - (o._recover || 0));
            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
            const payBadge = (refunded > 0 || o.status === 'VOID_REFUND')
              ? '<span class="badge badge-danger" style="font-size:10.5px;">已退款</span>'
              : '<span class="badge badge-success" style="font-size:10.5px;">已支付</span>';
            return `<tr>

                <input type="radio" name="ch" value="EXTERNAL" checked>
                <span class="choice-title">外部渠道</span>
              </div>
              <div class="choice-card-item" id="opt-int" onclick="pickChannelType('INTERNAL')">
                <input type="radio" name="ch" value="INTERNAL">
                <span class="choice-title">内部渠道</span>

            </div>
          </div>

function pickChannelType(type) {
  const optExt = document.getElementById('opt-ext');
  const optInt = document.getElementById('opt-int');
  const firstIn = document.getElementById('in-approve-first-rate');
  const renewIn = document.getElementById('in-approve-renew-rate');
  const hint = document.getElementById('rate-source-hint');

  if (type === 'EXTERNAL') {
    optExt.classList.add('selected');
    optInt.classList.remove('selected');
    optExt.querySelector('input').checked = true;
    firstIn.value = GLOBAL_CONFIG.external_first_rate;
    renewIn.value = GLOBAL_CONFIG.external_renew_rate;
    hint.textContent = `带出默认值 (首购 ${GLOBAL_CONFIG.external_first_rate}% / 续购 ${GLOBAL_CONFIG.external_renew_rate}%)`;
  } else {
    optInt.classList.add('selected');
    optExt.classList.remove('selected');
    optInt.querySelector('input').checked = true;
    firstIn.value = GLOBAL_CONFIG.internal_first_rate;
    renewIn.value = GLOBAL_CONFIG.internal_renew_rate;
    hint.textContent = `带出默认值 (首购 ${GLOBAL_CONFIG.internal_first_rate}% / 续购 ${GLOBAL_CONFIG.internal_renew_rate}%)`;
  }
}

function confirmApprovePartner(appId) {
  const app = APPLICATIONS.find(a => a.id === appId);
  if (!app) return;

  const isInt = document.getElementById('opt-int').classList.contains('selected');
  const channel = isInt ? 'INTERNAL' : 'EXTERNAL';
  const firstRate = parseFloat(document.getElementById('in-approve-first-rate').value);
  const renewRate = parseFloat(document.getElementById('in-approve-renew-rate').value);
  const code = document.getElementById('in-approve-code').value.trim();

  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100) { alert('请输入有效的首购与续购比例 (0~100%)'); return; }
  if (!/^\d{4}$/.test(code)) { alert('专属推荐码必须为 4 位纯数字'); return; }
  if (PARTNERS.some(p => p.code === code)) { alert('该推荐码已被其他合伙人占用'); return; }

  const opTime = nowTime();
  app.status = 'APPROVED';
  app.approve_time = opTime;
  app.approve_by = '张博文';
  app.logs.unshift({
    time: opTime,
    operator: '张博文',
    action: '审核通过',
    detail: `设为${channel==='INTERNAL'?'内部渠道':'外部渠道'}，首购 ${firstRate.toFixed(1)}% / 续购 ${renewRate.toFixed(1)}%，推荐码 ${code}`
  });

  PARTNERS.unshift({
    id: 'PT-' + code,
    name: app.name,
    org: app.org,
    role: app.role,
    phone: app.phone,
    wx: app.wx,
    channel_type: channel,
    code: code,
    first_rate: firstRate,
    renew_rate: renewRate,
    customers_count: 0,
    paying_count: 0,
    points: { total: 0, withdrawable: 0, frozen: 0, settled: 0, unrecovered: 0 },
    status: 'NORMAL',
    freeze_reason: '',
    join_time: opTime,
    orders: [], flow: [], settlements: [], customers: [],
    logs: [
      { time: opTime, operator: '张博文', action: '入驻建档', before: '待审核', after: '正常', reason: '资质审核通过' }
    ]
  });

  closeModal('modal-approve');
  toast(`合伙人【${app.name}】审核通过！推荐码：${code}`);
  updateSidebarMenu();
  renderApplicationsView(document.getElementById('main-view-container'));
}
