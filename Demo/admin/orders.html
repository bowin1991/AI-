  <script src="js/common.js"></script>
  <script>
function renderOrdersView(container) {
  const userOrders = allUserOrders();
  const tabBtn = (key, label) => `<button class="seg-tab-btn ${orderSubTab === key ? 'active' : ''}" onclick="orderSubTab='${key}'; resetPage('orders-user'); resetPage('orders-org'); renderOrdersView(document.getElementById('main-view-container'))">${label}</button>`;
  let body = '';
  if (orderSubTab === 'user') {
    const kw = ordKw.trim().toLowerCase();
    const filteredUserOrders = userOrders.filter(({ p, o }) => {
      if (ordStatus === 'PAID' && ordIsRefunded(o)) return false;
      if (ordStatus === 'REFUNDED' && !ordIsRefunded(o)) return false;
      if (!kw) return true;
      return o.id.toLowerCase().includes(kw)
        || o.customer_phone.includes(kw)
        || p.name.toLowerCase().includes(kw);
    });
    const pagedUserOrders = pagedList('orders-user', filteredUserOrders);
    body = `
      <div class="filter-card">
        <div class="filter-inputs-grid">
          <div class="filter-field" style="flex: 2; min-width: 280px;">
            <span class="field-label">关键词</span>
            <input class="input-control" type="text" placeholder="订单编号、客户手机号、合伙人姓名" value="${ordKw}" oninput="ordKw=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">
          </div>
          <div class="filter-field" style="flex: 1;">
            <span class="field-label">订单状态</span>
            <select class="input-control" onchange="ordStatus=this.value; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">
              <option value="ALL" ${ordStatus==='ALL'?'selected':''}>全部状态</option>
              <option value="PAID" ${ordStatus==='PAID'?'selected':''}>已支付</option>
              <option value="REFUNDED" ${ordStatus==='REFUNDED'?'selected':''}>已退款</option>
            </select>
          </div>
          <button class="btn btn-outline" onclick="ordKw=''; ordStatus='ALL'; resetPage('orders-user'); renderOrdersView(document.getElementById('main-view-container'))">重置</button>
        </div>
      </div>
      <div class="table-container">
        <table class="official-table">
          <thead><tr><th>订单编号</th><th>下单客户</th><th>商品名称</th><th>归属合伙人</th><th>订单状态</th><th>订单金额</th><th>分成比例</th><th>本单佣金</th><th>下单时间</th><th class="col-sticky" style="text-align:right;">操作</th></tr></thead>
          <tbody>${filteredUserOrders.length === 0 ? '<tr><td colspan="10" style="text-align:center; padding:32px; color:var(--muted-foreground);">没有符合条件的订单</td></tr>' : pagedUserOrders.map(({ p, o, lines }) => {
            const netPoints = Math.max(0, o.points - (o._recover || 0));
            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';
            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';
            const payBadge = isRefund
              ? '<span class="badge badge-danger" style="font-size:10.5px;">已退款</span>'
              : '<span class="badge badge-success" style="font-size:10.5px;">已支付</span>';
            return `<tr>
              <td><span class="code-badge">${o.id}</span></td>
              <td><strong class="num">${o.customer_phone}</strong></td>
              <td style="font-size:12.5px;">${productName(o)}<div style="margin-top:3px;">${productTagHtml(o)}</div></td>
              <td><strong>${p.name}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道</div></td>
              <td>${payBadge}</td>
              <td class="num">¥${formatNum(o.pay_amount)}${refunded > 0 ? `<div style="font-size:10.5px; color:var(--muted-foreground); margin-top:2px;">已退 ¥${formatNum(refunded)}</div>` : ''}</td>
              <td class="num">${o.rate}%</td>
              <td><strong class="num" style="color:${pc};">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong></td>
              <td class="num" style="color:var(--muted-foreground); font-size:11.5px;">${o.created_at}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                ${lines.length ? `<button class="btn btn-outline btn-sm" onclick="showOrderLines('${o.id}')">订单详情</button>` : ''}
              </td></tr>`; }).join('')}
          </tbody>
        </table>
        ${pagerBar('orders-user', userOrders.length)}
      </div>`;
  } else {
    const filteredOrgReqs = ORG_REQUESTS.filter(r => orgStatusTab === 'ALL' || orgReqState(r) === orgStatusTab)
      .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    const pagedOrgReqs = pagedList('orders-org', filteredOrgReqs);
    const subTab = (key, label) => `<button class="seg-tab-btn ${orgStatusTab === key ? 'active' : ''}" onclick="orgStatusTab='${key}'; resetPage('orders-org'); renderOrdersView(document.getElementById('main-view-container'))">${label}</button>`;
    body = `
      <div class="content-card" style="padding:14px 20px; margin-bottom:16px; font-size:12.5px; color:var(--muted-foreground); line-height:1.7;">
        机构订单由合伙人在合伙人端提交（机构名称、合同编号、合同金额、服务周期、合同扫描件），运营在此<strong style="color:var(--foreground);">审核并核定分成比例</strong>；通过后自动生成机构订单，总佣金 = 合同金额 × 核定比例，财务线下确认回款后到「结算管理 · 待结算机构订单」按订单填写结算金额。
      </div>
      <div class="segmented-tabs" style="margin-bottom:16px;">
        ${subTab('PENDING', '待审核')}
        ${subTab('REJECTED', '已驳回')}
        ${subTab('ALL', '全部')}
      </div>
      <div class="table-container">
        <table class="official-table">
          <thead><tr><th>申请单号</th><th>机构名称</th><th>归属合伙人</th><th>合同金额</th><th>核定比例</th><th>总佣金</th><th>状态</th><th>提交时间</th><th class="col-sticky" style="text-align:right;">操作</th></tr></thead>
          <tbody>${filteredOrgReqs.length === 0 ? '<tr><td colspan="9" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无该状态的机构订单</td></tr>' : pagedOrgReqs.map(r => {
            const st = orgReqState(r);
            const rate = orgReqRate(r);
            const pool = rate != null ? round2(r.amount * rate / 100) : 0;
            return `<tr>
              <td><span class="code-badge">${r.id}</span>${r.order_id ? `<div style="font-size:11px; color:var(--muted-foreground); margin-top:3px;">订单 ${r.order_id}</div>` : ''}</td>
              <td><strong>${esc(r.org)}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">合同 ${esc(r.contract_no)} · ${r.months} 个月</div></td>
              <td><strong>${r.partner_name}</strong><div style="font-size:11.5px; color:var(--muted-foreground);">${r.partner_id}</div></td>
              <td class="num">¥${formatNum(r.amount)}</td>
              <td class="num">${rate != null ? rate + '%' : '<span style="color:var(--muted-foreground);">待核定</span>'}</td>
              <td><strong class="num" style="color:${pool > 0 ? '#15803D' : 'var(--muted-foreground)'};">${pool > 0 ? '¥' + fmtC(pool) : '—'}</strong></td>
              <td><span class="badge ${ORG_STATE_BADGE[st]}">${ORG_STATE_LABEL[st]}</span></td>
              <td class="num" style="color:var(--muted-foreground); font-size:11.5px;">${r.created_at}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                ${st === 'PENDING'
                  ? `<button class="btn btn-primary btn-sm" onclick="openOrgReviewDrawer('${r.id}')">审核</button>`
                  : `<button class="btn btn-outline btn-sm" onclick="openOrgReviewDrawer('${r.id}')">详情</button>`}
              </td></tr>`; }).join('')}
          </tbody>
        </table>
        ${pagerBar('orders-org', filteredOrgReqs.length)}
      </div>`;
  }

  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;">
      <div>
        <h1 style="font-size:24px; font-weight:700; color:var(--foreground); letter-spacing:-0.02em;">订单管理</h1>
      </div>
    </div>
    <div class="segmented-tabs">
      ${tabBtn('user', '个人订单')}
      ${tabBtn('org', '机构订单')}
    </div>
    ${body}
  `;
}

// ==========================================
// 5. 页面：数据报表 (REPORTS - 第二批)

function renderCurrentPage() {
  renderOrdersView(document.getElementById("main-view-container"));
}

function startPage() {
  initAdminNav('nav-orders');
  renderCurrentPage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPage);
} else {
  startPage();
}
  </script>
