<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立理 S1 分销管理系统 — 合伙人管理</title>
<style>
/* 
 * 立理 S1 官方统一设计规范 (Tailwind CSS v4 + shadcn/ui 官方逆向提取版)
 * 来源: https://ali-dev.s1.liliai.cn/admin/
 */
:root {
  --background: #FFFFFF;
  --foreground: #09090B;
  --muted: #F4F4F5;
  --muted-foreground: #71717A;
  --card: #FFFFFF;
  --card-foreground: #09090B;
  --popover: #FFFFFF;
  --popover-foreground: #09090B;
  --border: #E4E4E7;
  --input: #E4E4E7;
  --primary: #09090B;
  --primary-hover: #27272A;
  --primary-foreground: #FAFAFA;
  --secondary: #F4F4F5;
  --secondary-foreground: #18181B;
  --accent: #F4F4F5;
  --accent-foreground: #18181B;
  --destructive: #E11D48;
  --destructive-hover: #BE123C;
  --destructive-foreground: #FFFFFF;
  --ring: #71717A;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 9999px;
  --sidebar-w: 256px;
  --header-h: 56px;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background-color: #FAFAFA;
  color: var(--foreground);
  line-height: 1.5;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* 等宽数字排版 */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* 页面总布局 */
#app-layout { display: flex; min-height: 100vh; }

/* 左侧侧边栏 (1:1 复刻官方) */
aside#app-sidebar {
  width: var(--sidebar-w);
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 50;
}
.sidebar-brand {
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 19px;
  font-weight: 800;
  color: #09090B;
  letter-spacing: -0.02em;
}
.brand-badge {
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid #09090B;
  padding: 1px 5px;
  border-radius: 4px;
  line-height: 1.2;
}
.brand-sub {
  font-size: 11px;
  color: var(--muted-foreground);
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-menu-wrap {
  padding: 12px 12px;
  flex: 1;
  overflow-y: auto;
}
.menu-group-header {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted-foreground);
  padding: 8px 10px 4px;
}
.sidebar-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  color: var(--foreground);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 400;
  margin-bottom: 2px;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.sidebar-menu-item:hover { background-color: var(--muted); }
.sidebar-menu-item.active {
  background-color: var(--muted);
  font-weight: 600;
  color: var(--foreground);
}
.sidebar-menu-item svg {
  width: 16px; height: 16px;
  stroke: var(--foreground);
  flex-shrink: 0;
}
.sidebar-menu-item .menu-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  background: var(--destructive);
  color: #fff;
}
.sidebar-menu-item .menu-tag-pill {
  margin-left: auto;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  background: #E4E4E7;
  color: #52525B;
}

/* 侧边栏底部用户信息 (1:1 复刻官方张博文) */
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.user-profile-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.user-avatar-circle {
  width: 32px; height: 32px;
  border-radius: var(--radius-pill);
  background: #E4E4E7;
  color: #18181B;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
}
.user-meta-texts { min-width: 0; }
.user-meta-name { font-size: 13px; font-weight: 600; color: var(--foreground); line-height: 1.2; }
.user-meta-role { font-size: 11.5px; color: var(--muted-foreground); margin-top: 1px; }

/* 页面内容承载容器 */
main#app-main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* 官方顶栏 (1:1 复刻) */
header#app-header {
  height: var(--header-h);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.btn-icon-square {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--foreground);
}
.btn-icon-square:hover { background: var(--muted); }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.search-pill-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(244, 244, 245, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0 10px;
  height: 32px;
  width: 200px;
  color: var(--muted-foreground);
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.search-pill-box:hover { background: #fff; border-color: #A1A1AA; }
.kbd-badge {
  font-size: 10px;
  border: 1px solid #D4D4D8;
  border-radius: 4px;
  padding: 1px 4px;
  margin-left: auto;
  font-family: inherit;
  color: var(--muted-foreground);
}
.btn-round-icon {
  width: 32px; height: 32px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted-foreground);
}
.btn-round-icon:hover { background: var(--muted); color: var(--foreground); }

/* 主体容器 */
#main-view-container {
  padding: 24px 28px 48px;
  flex: 1;
}

/* 官方按钮组件规范 (Buttons) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  white-space: nowrap;
  text-decoration: none;
  font-family: inherit;
}
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }
/* 纯黑主按钮 (通过、新增、导出) */
.btn-primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  box-shadow: var(--shadow-xs);
}
.btn-primary:hover { background: var(--primary-hover); }

/* 白底细灰轮廓按钮 (详情、改比例、重置) */
.btn-outline {
  background: #FFFFFF;
  color: var(--foreground);
  border-color: var(--border);
  box-shadow: var(--shadow-xs);
}
.btn-outline:hover { background: var(--muted); border-color: #D4D4D8; }

/* 危险红底按钮 (拒绝、删除) */
.btn-destructive {
  background: var(--destructive);
  color: #FFFFFF;
  border-color: var(--destructive);
  box-shadow: var(--shadow-xs);
}
.btn-destructive:hover { background: var(--destructive-hover); }

/* 幽灵无框按钮 */
.btn-ghost {
  background: transparent;
  color: var(--muted-foreground);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--muted); color: var(--foreground); }

/* 状态 Badge 标签 (1:1 官方规范) */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1.5px 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-success { background: #F0FDF4; color: #15803D; border-color: #DCFCE7; }
.badge-warning { background: #FEFCE8; color: #A16207; border-color: #FEF08A; }
.badge-danger { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
.badge-neutral { background: #FFFFFF; color: #3F3F46; border-color: var(--border); }
.badge-blue { background: #EFF6FF; color: #1D4ED8; border-color: #DBEAFE; }

/* 官方卡片容器 (Cards) */
.content-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  margin-bottom: 20px;
  overflow: hidden;
}
.card-header-bar {
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.card-header-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--foreground);
}
.card-body-padding { padding: 18px 20px; }

/* 筛选表单网格 (Filter Box) */
.filter-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  padding: 18px 20px;
  margin-bottom: 20px;
}
.filter-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.filter-title { font-size: 14px; font-weight: 600; color: var(--foreground); }
.filter-inputs-grid {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 140px;
}
.field-label { font-size: 11.5px; font-weight: 500; color: var(--muted-foreground); }
.input-control {
  height: 34px;
  background: #FFFFFF;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 0 10px;
  font-size: 13px;
  color: var(--foreground);
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input-control:focus {
  border-color: #09090B;
  box-shadow: 0 0 0 1px #09090B;
}

/* 官方数据表格 (Data Table) */
.table-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xs);
  overflow-x: auto;
}
.table-toolbar {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table-summary-text { color: var(--muted-foreground); }
.table-summary-text strong { color: var(--foreground); }

/* 表格底部翻页器 */
.table-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  background: var(--card);
}
.pager-total { color: var(--muted-foreground); }
.pager-actions { display: flex; align-items: center; gap: 8px; }
.pager-size {
  height: 28px;
  font-size: 12px;
  padding: 0 8px;
  border-radius: var(--radius-md);
  width: auto;
}
.pager-arrow {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--foreground);
  cursor: pointer;
}
.pager-arrow:hover:not(:disabled) { background: var(--accent); }
.pager-arrow:disabled { color: var(--muted-foreground); opacity: .55; cursor: not-allowed; }

/* 日期区间选择器（shadcn/ui 风格） */
.date-range-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
.date-popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  left: auto;
  z-index: 60;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .14);
  padding: 12px;
}
.cal-wrap { display: flex; gap: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; }
.cal-head span { font-size: 12.5px; font-weight: 600; color: var(--foreground); }
.cal-nav {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; border-radius: 6px;
  color: var(--muted-foreground); cursor: pointer;
}
.cal-nav:hover { background: var(--accent); color: var(--foreground); }
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 30px); }
.cal-weekdays div { text-align: center; font-size: 11px; color: var(--muted-foreground); padding: 4px 0; }
.cal-day {
  height: 30px; width: 30px;
  border: none; background: transparent; border-radius: 6px;
  font-size: 12.5px; color: var(--foreground); cursor: pointer;
}
.cal-day:hover { background: var(--accent); }
.cal-day.muted { color: var(--muted-foreground); opacity: .5; }
.cal-day.in-range { background: var(--accent); border-radius: 0; }
.cal-day.edge { background: var(--primary); color: var(--primary-foreground); border-radius: 6px; }
.cal-day.edge:hover { background: var(--primary); }
.cal-day.today { box-shadow: inset 0 0 0 1px var(--border); }
.cal-footer {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px;
}
.cal-presets { display: flex; gap: 2px; }
.cal-preset {
  border: none; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--muted-foreground); padding: 4px 8px; border-radius: 6px;
}
.cal-preset:hover { background: var(--accent); color: var(--foreground); }

table.official-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
table.official-table th {
  padding: 10px 16px;
  color: var(--muted-foreground);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.official-table td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--foreground);
  vertical-align: middle;
  white-space: nowrap;
}
table.official-table tr:last-child td { border-bottom: none; }
table.official-table tbody tr:hover { background: #FAFAFA; }

/* 黏性固定右侧操作列 */
th.col-sticky, td.col-sticky {
  position: sticky;
  right: 0;
  background: var(--card);
  box-shadow: -4px 0 8px rgba(0, 0, 0, 0.02);
  z-index: 2;
}
tbody tr:hover td.col-sticky { background: #FAFAFA; }

.code-badge {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  background: #F4F4F5;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  color: #18181B;
}

/* 分段选项卡 (Segmented Tabs，如计费/扣费页面) */
.segmented-tabs {
  display: inline-flex;
  background: #F4F4F5;
  padding: 3px;
  border-radius: var(--radius-md);
  gap: 2px;
  margin-bottom: 18px;
}
.seg-tab-btn {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted-foreground);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  background: transparent;
}
.seg-tab-btn:hover { color: var(--foreground); }
.seg-tab-btn.active {
  background: #FFFFFF;
  color: var(--foreground);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* 官方模态弹窗 (Modal) */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(9, 9, 11, 0.4);
  backdrop-filter: blur(2px);
  z-index: 120;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }
.modal-dialog {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px;
  overflow: hidden;
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-mask.show .modal-dialog { transform: translateY(0) scale(1); }
.modal-dialog-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-dialog-header h3 { font-size: 15.5px; font-weight: 600; color: var(--foreground); }
.modal-dialog-body { padding: 20px; max-height: calc(85vh - 120px); overflow-y: auto; }
.modal-dialog-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: #FAFAFA;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 10px;
}

/* 官方右侧抽屉 (Drawer) */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(9, 9, 11, 0.35);
  backdrop-filter: blur(2px);
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer-panel {
  position: fixed; top: 0; bottom: 0; right: 0;
  width: 560px; max-width: 90vw;
  background: #FFFFFF;
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  z-index: 101;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer-mask.show .drawer-panel { transform: translateX(0); }
.drawer-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.drawer-body { padding: 22px; flex: 1; overflow-y: auto; }
.drawer-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  background: #FAFAFA;
  display: flex; align-items: center; justify-content: flex-end;
  gap: 10px;
}

/* 表单控件通用 */
.form-group { margin-bottom: 16px; }
.form-group-label {
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--foreground);
  margin-bottom: 6px;
}
.form-group-label span.req { color: var(--destructive); margin-left: 2px; }
.form-input-full {
  width: 100%;
  height: 36px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 0 12px;
  font-size: 13px;
  color: var(--foreground);
  background: #fff;
  outline: none;
  font-family: inherit;
}
.form-input-full:focus {
  border-color: #09090B;
  box-shadow: 0 0 0 1px #09090B;
}
.form-input-full:disabled {
  background: #F4F4F5;
  color: var(--muted-foreground);
  cursor: not-allowed;
}
.form-textarea-full {
  width: 100%;
  min-height: 80px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  font-size: 13px;
  color: var(--foreground);
  outline: none;
  font-family: inherit;
  resize: vertical;
}
.form-textarea-full:focus {
  border-color: #09090B;

// ==========================================
// 佣金明细引擎：订单 → 分期明细 → 解冻 → 结算
// 月卡 1 期；年卡 12 期；机构订单按合同周期（月）分期；每期在服务月结束 +7 天解冻
// ==========================================
const REF_DATE = '2026-11-06';
const LINE_SETTLED = { 'ORD-20260820-0201#1': 74.98 };      // 明细 key -> 已结算金额（该年卡第 1 期已打款）
const LINE_SETTLE_ID = { 'ORD-20260820-0201#1': 'SETTLE-202609-009' };  // 明细 key -> 最近一次结算单号

function addMonthsDate(dateStr, m, extraDays) {
  const p = dateStr.slice(0, 10).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1 + m, +p[2] + extraDays)).toISOString().slice(0, 10);
}
function orderKind(o) {
  if (o.kind) return o.kind;
  if (o.status === 'VOID_REFUND' || !(o.points > 0)) return 'NONE';
  if (o.is_upgrade) return 'LUMP';
  if (/年卡/.test(o.product)) return 'YEAR';
  return 'MONTH';
}
function orderStart(o) { return o.start || (o.created_at || '').slice(0, 10); }

function rawKind(o) {
  if (o.kind) return o.kind;
  if (o.is_upgrade) return 'LUMP';
  if (/年卡/.test(o.product)) return 'YEAR';
  return 'MONTH';
}
function orderLines(o, p) {
  o._recover = 0; o._refundShort = 0;
  const voided = o.status === 'VOID_REFUND';
  const kind = voided ? rawKind(o) : orderKind(o);
  if (kind === 'NONE') return [];
  // 机构订单：佣金池 = 合同金额 × 核定比例，审核通过后即可结算，按订单整体一笔，不设分期
  if (kind === 'ORG') {
    const pool = round2(o.points || 0);
    const key = o.id + '#1';
    const settled = Math.min(round2(Math.max(o.settled_amount || 0, LINE_SETTLED[key] || 0)), pool);
    const remaining = Math.max(0, round2(pool - settled));
    return [{
      key, order_id: o.id, kind, k: 1, n: 1, amt: pool, settled, remaining,
      unlock: '审核通过即可结算', state: remaining === 0 ? 'SETTLED' : 'ORG',
      source: o.org_name, customer: o.org_name, pay: o.pay_amount, rate: o.rate, order_total: pool,
      period: '合同期 ' + (o.months || 12) + ' 个月'
    }];
  }
  const n = kind === 'YEAR' ? 12 : 1;
  const total = voided ? Math.abs(o.points) : o.points, start = orderStart(o);
  const totalC = Math.round(total * 100);
  const baseC = Math.round(totalC / n);
  const lines = [];
  for (let k = 1; k <= n; k++) {
    const amt = (n === 1 ? totalC : (k < n ? baseC : totalC - baseC * (n - 1))) / 100;
    const unlock = kind === 'LUMP' ? o.unfreeze_at : addMonthsDate(start, k, GLOBAL_CONFIG.unfreeze_days);
    const key = o.id + '#' + k;
    const settled = voided ? 0 : Math.min(LINE_SETTLED[key] || 0, amt);
    const remaining = voided ? 0 : amt - settled;
    let state;
    if (voided) state = 'REFUND';
    else if (remaining === 0) state = 'SETTLED';
    else if (unlock <= REF_DATE) state = 'UNLOCKED';
    else state = 'FROZEN';
    lines.push({
      key, order_id: o.id, kind, k, n, amt, settled, remaining, unlock, state,
      source: kind === 'ORG' ? o.org_name : o.product,
      customer: kind === 'ORG' ? o.org_name : o.customer_phone,
      pay: o.pay_amount, rate: o.rate, order_total: total,
      period: addMonthsDate(start, k - 1, 0) + ' ~ ' + addMonthsDate(start, k, -1)
    });
  }
  // 退款登记：按退款后的实付重算应收佣金，从最后一期往前抵扣尚未解冻的期次；不足部分计入待追回
  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
  if (refunded > 0 && total > 0) {
    const recover = Math.max(0, round2(total - round2((o.pay_amount - refunded) * o.rate / 100)));
    let left = recover;
    // 1) 未解冻期次从最后一期往前扣回
    for (let i = lines.length - 1; i >= 0 && left > 0; i--) {
      const l = lines[i];
      if (l.state !== 'FROZEN') continue;
      const cut = Math.min(left, l.remaining);
      const cutC = Math.round(cut * 100) / 100;
      l.remaining = Math.round((l.remaining - cutC) * 100) / 100;
      l.cut = cutC;
      left = Math.round((left - cutC) * 100) / 100;
      if (l.remaining <= 0) { l.remaining = 0; l.state = 'REFUND'; }
    }
    // 2) 已解冻未结算期次从可结算余额抵扣
    for (let i = lines.length - 1; i >= 0 && left > 0; i--) {
      const l = lines[i];
      if (l.state !== 'UNLOCKED') continue;
      const cut = Math.min(left, l.remaining);
      const cutC = Math.round(cut * 100) / 100;
      l.remaining = Math.round((l.remaining - cutC) * 100) / 100;
      l.cut = (l.cut || 0) + cutC;
      left = Math.round((left - cutC) * 100) / 100;
      if (l.remaining <= 0) { l.remaining = 0; l.state = 'REFUND'; }
    }
    // 3) 已结算打款部分无法扣回，逐期计入待追回
    let short = 0;
    for (let i = lines.length - 1; i >= 0 && left > 0; i--) {
      const l = lines[i];
      if (l.state !== 'SETTLED') continue;
      const cut = Math.min(left, l.amt);
      l.short = Math.round(cut * 100) / 100;
      short = Math.round((short + l.short) * 100) / 100;
      left = Math.round((left - l.short) * 100) / 100;
      l.state = 'SHORT';
    }
    o._recover = recover;
    o._refundShort = short;
  }
  return lines;
}
function partnerLines(p) {
  let all = [];
  p.orders.forEach(o => { all = all.concat(orderLines(o, p)); });
  return all;
}
function recalcPartner(p) {
  let w = 0, f = 0, s = 0, short = 0;
  partnerLines(p).forEach(l => {
    s += l.settled;
    if (l.state === 'UNLOCKED') w += l.remaining;
    else if (l.state === 'FROZEN') f += l.remaining;
  });
  // 退款差额中已解冻/已结算、无法从期次扣回的部分，进入待追回，下次打款扣减
  p.orders.forEach(o => {
    short += (o._refundShort || 0);
    // 机构订单：未结算佣金不计入可提现，单独在「结算管理 · 待结算机构订单」中按订单结算
    if (orderKind(o) === 'ORG') {
      const l = orderLines(o, p)[0];
      if (l && l.remaining > 0) f += l.remaining;
    }
  });
  p.points = { total: round2(w + f + s), withdrawable: round2(w), frozen: round2(f), settled: round2(s), unrecovered: Math.max(0, round2(short - (p._offsetPaid || 0))) };
}
function recalcAll() { PARTNERS.forEach(recalcPartner); }

// 总销售额：该合伙人所带订单的实付合计，扣除已登记退款；kind 传 'user' / 'org' 时按订单类型拆分
function partnerSales(p, kind) {
  let gmv = 0;
  p.orders.forEach(o => {
    const isOrg = orderKind(o) === 'ORG';
    if (kind === 'user' && isOrg) return;
    if (kind === 'org' && !isOrg) return;
    const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
    gmv += Math.max(0, (o.pay_amount || 0) - refunded);
  });
  return gmv;
}

function allocSettled(settleId, keys) {
  const rec = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId);
  const p = PARTNERS.find(x => x.id === rec.partner_id);
  rec.lines = [];
  keys.forEach(key => {
    const l = partnerLines(p).find(x => x.key === key);
    LINE_SETTLED[key] = l.amt;
    LINE_SETTLE_ID[key] = settleId;
    rec.lines.push({ key, order_id: l.order_id, k: l.k, n: l.n, kind: l.kind, source: l.source, amt: l.amt, unlock: l.unlock });
  });
}

function confirmRefund() {
  const hit = findOrder(REFUND_ORDER_ID); if (!hit) return;
  const { p, o } = hit;
  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
  const amount = parseFloat(document.getElementById('rf-amount').value) || 0;
  const date = document.getElementById('rf-date').value;
  const voucher = document.getElementById('rf-voucher').value.trim();
  const reason = document.getElementById('rf-reason').value.trim();
  if (!(amount > 0)) { toast('请填写本次退款金额'); return; }
  if (amount > o.pay_amount - refunded) { toast('退款金额不能超过剩余可退金额 ¥' + formatNum(o.pay_amount - refunded)); return; }
  if (!date) { toast('请选择退款日期'); return; }
  if (!reason) { toast('请填写退款原因'); return; }
  const beforeRecover = o._recover || 0;
  if (!o.refunds) o.refunds = [];
  o.refunds.push({ amount, date, voucher, reason, operator: '运营', time: nowTime() });
  orderLines(o, p);
  recalcPartner(p);
  const delta = o._recover - beforeRecover;
  const vcText = voucher ? ' · 凭证 ' + voucher : '';
  const shortMsg = o._refundShort > 0 ? ' · 差额 ¥' + fmtC(o._refundShort) + ' 计入待追回' : '';

  recalcAll();

}

function executeSettleSheet() {

  const before = p.points.withdrawable;
  const bNo = 'SETTLE-' + REF_DATE.slice(0, 7).replace('-', '') + '-' + Math.floor(100 + Math.random() * 899);
  sel.forEach(l => { LINE_SETTLED[l.key] = (LINE_SETTLED[l.key] || 0) + l.remaining; LINE_SETTLE_ID[l.key] = bNo; });
  const rec = {
    settle_id: bNo, partner_id: p.id, partner_name: p.name, partner_phone: p.phone, channel_type: p.channel_type,
    points: net, gross: total, offset, voucher, operator: op, settle_time: nowTime(), remark: rem,
    lines: sel.map(l => ({ key: l.key, order_id: l.order_id, k: l.k, n: l.n, kind: l.kind, source: l.source, amt: l.remaining, unlock: l.unlock }))
  };

  recalcPartner(p);
  p.logs.unshift({ time: rec.settle_time, operator: op, action: '线下结算打款核销', before: `可结算 ¥${fmtC(before)}`, after: `可结算 ¥${fmtC(p.points.withdrawable)}`, reason: `结算 ${sel.length} 条明细合计 ¥${fmtC(total)}${offset > 0 ? '，扣减退款待追回 ¥' + fmtC(offset) : ''}，实结 ¥${fmtC(net)}，凭证 ${voucher}` });

}

function confirmOrgApprove(reqId) {
  const r = ORG_REQUESTS.find(x => x.id === reqId); if (!r) return;
  const p = PARTNERS.find(x => x.id === r.partner_id);
  if (!p) { toast('归属合伙人不存在，无法生成订单'); return; }
  const rate = parseFloat(document.getElementById('org-review-rate').value);
  if (isNaN(rate) || rate < 0 || rate > 100) { toast('请填写 0~100 之间的核定分成比例'); return; }
  const now = nowTime();
  const orderId = 'ORG-' + r.start.replace(/-/g, '') + '-' + String(allOrgOrders().length + 1).padStart(3, '0');
  const pool = round2(r.amount * rate / 100);
  r.status = 'APPROVED';
  r.rate = rate;
  r.reviewed_at = now;
  r.reviewer = '张博文';
  r.reject_reason = '';
  r.order_id = orderId;
  r.settled_amount = 0;
  p.orders.unshift({ id: orderId, customer_phone: '', org_name: r.org, contract_no: r.contract_no, kind: 'ORG',
    product: '机构版年度合同（线下签约）', pay_amount: r.amount, rate, points: pool,
    status: 'ORG', unfreeze_at: '按结算释放', created_at: now, start: r.start, months: r.months,
    paid_out: 0, settled_amount: 0, received_amount: 0, remark: r.remark, is_upgrade: false, is_cool: false });
  p.flow.unshift({ time: now, order_id: orderId, type: '机构订单审核通过', points: '+¥' + fmtC(pool), status: `合同 ${r.contract_no}，待结算佣金 ¥${fmtC(pool)}` });
  p.logs.unshift({ time: now, operator: '张博文', action: '审核机构订单', before: r.id, after: `${r.org} · ¥${formatNum(r.amount)} × ${rate}%`, reason: `核定比例 ${rate}%，总佣金 ¥${fmtC(pool)}，按订单维度结算` });
  recalcAll();
  closeDrawer('drawer-org-review');
  toast(`审核通过：${r.org}，核定 ${rate}%，总佣金 ¥${fmtC(pool)}`);
  renderOrdersView(document.getElementById('main-view-container'));
}

function confirmOrgReject(reqId) {
  const r = ORG_REQUESTS.find(x => x.id === reqId); if (!r) return;
  const ta = document.getElementById('org-reject-reason');
  const reason = ta ? ta.value.trim() : '';
  if (!reason) { toast('请填写驳回原因'); return; }
  const now = nowTime();
  r.status = 'REJECTED';
  r.reviewed_at = now;
  r.reviewer = '张博文';
  r.reject_reason = reason;
  const p = PARTNERS.find(x => x.id === r.partner_id);
  if (p) p.logs.unshift({ time: now, operator: '张博文', action: '驳回机构订单', before: r.id, after: r.org, reason });
  closeModal('modal-org-reject');
  closeDrawer('drawer-org-review');
  toast(`已驳回：${r.org}`);
  renderOrdersView(document.getElementById('main-view-container'));
}

// 路由控制器 (Router)
// ==========================================
let currentRoute = 'applications';
let routeParams = {};

function initRouter() {
  window.addEventListener('hashchange', parseRoute);
  parseRoute();
}

function parseRoute() {
  const hash = location.hash.replace(/^#/, '') || 'dashboard';
  const parts = hash.split('/');
  currentRoute = parts[0];
  if (parts[0] === 'partner' && parts[1]) {
    routeParams = { partnerId: parts[1], tab: parts[2] || 'orders' };
  } else {
    routeParams = {};
  }
  updateSidebarMenu();
  renderActiveView();
}

function navigate(path) {
  location.hash = path;
}

function updateSidebarMenu() {
  document.querySelectorAll('.sidebar-menu-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.getElementById('nav-' + currentRoute);
  if (activeItem) activeItem.classList.add('active');
}

// 通用列表翻页器
let pageState = {};
function pageMeta(key, total) {
  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });
  const pages = Math.max(1, Math.ceil(total / st.size));
  if (st.page > pages) st.page = pages;
  return { st, pages, start: (st.page - 1) * st.size };
}
function pagedList(key, arr) {
  const m = pageMeta(key, arr.length);
  return arr.slice(m.start, m.start + m.st.size);
}
function resetPage(key) {
  if (pageState[key]) pageState[key].page = 1;
}
function goPage(key, page) {
  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });
  st.page = Math.max(1, page);
  renderActiveView();
}
function setPageSize(key, size) {
  pageState[key] = { page: 1, size: parseInt(size, 10) || 20 };
  renderActiveView();
}
function pagerBar(key, total) {
  const { st, pages } = pageMeta(key, total);
  return `
    <div class="table-pager">
      <div class="pager-total">共 ${total} 条 · 第 ${st.page}/${pages} 页</div>
      <div class="pager-actions">
        <select class="input-control pager-size" onchange="setPageSize('${key}', this.value)">
          <option value="20" ${st.size === 20 ? 'selected' : ''}>20 条/页</option>
          <option value="50" ${st.size === 50 ? 'selected' : ''}>50 条/页</option>
        </select>
        <button class="pager-arrow" ${st.page <= 1 ? 'disabled' : ''} onclick="goPage('${key}', ${st.page - 1})">‹ 上一页</button>
        <button class="pager-arrow" ${st.page >= pages ? 'disabled' : ''} onclick="goPage('${key}', ${st.page + 1})">下一页 ›</button>
      </div>
    </div>`;
}

function renderActiveView() {
  const container = document.getElementById('main-view-container');
  if (currentRoute === 'dashboard') renderDashboardView(container);
  else if (currentRoute === 'applications') renderApplicationsView(container);
  else if (currentRoute === 'list') renderPartnerListView(container);
  else if (currentRoute === 'partner') {
    const p = PARTNERS.find(item => item.id === routeParams.partnerId) || PARTNERS[0];
    renderPartnerDetailView(container, p, routeParams.tab);
  } else if (currentRoute === 'orders') renderOrdersView(container);
  else if (currentRoute === 'settlements') renderSettlementsView(container);
  else if (currentRoute === 'reports') renderReportsView(container);
  else if (currentRoute === 'settings') renderSettingsView(container);
}

// ---------------- 申请时间区间选择器（shadcn/ui 风格） ----------------
function pad2(n) { return String(n).padStart(2, '0'); }
function ymAdd(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function ymLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${y} 年 ${m} 月`;
}
function monthCells(ym) {
  const [y, m] = ym.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m - 1, 0).getDate();
  const prevYm = ymAdd(ym, -1);
  const nextYm = ymAdd(ym, 1);
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    cells.push({ date: `${prevYm}-${pad2(prevDays - i)}`, day: prevDays - i, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: `${ym}-${pad2(d)}`, day: d, muted: false });
  }
  let n = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: `${nextYm}-${pad2(n)}`, day: n, muted: true });
    n++;
  }
  return cells;
}
function calMonthHtml(ym) {
  const chevronL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';
  const chevronR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>';
  return `
    <div>
      <div class="cal-head">
        <button type="button" class="cal-nav" onclick="shiftAppCal(-1)">${chevronL}</button>
        <span>${ymLabel(ym)}</span>
        <button type="button" class="cal-nav" onclick="shiftAppCal(1)">${chevronR}</button>
      </div>
      <div class="cal-weekdays">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">
        ${monthCells(ym).map(c => {
          const isFrom = c.date === appTmpFrom;
          const isTo = c.date === appTmpTo;
          const inRange = appTmpFrom && appTmpTo && c.date > appTmpFrom && c.date < appTmpTo;
          const cls = ['cal-day', c.muted ? 'muted' : '', (isFrom || isTo) ? 'edge' : '', inRange ? 'in-range' : '', c.date === REF_DATE ? 'today' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" onclick="pickAppDate('${c.date}')">${c.day}</button>`;
        }).join('')}
      </div>
    </div>`;
}
function dateRangePickerHtml() {
  return `
    <div class="date-popover" onclick="event.stopPropagation()">
      <div class="cal-wrap">
        ${calMonthHtml(appCalMonth)}
        ${calMonthHtml(ymAdd(appCalMonth, 1))}
      </div>
      <div class="cal-footer">
        <div class="cal-presets">
          <button type="button" class="cal-preset" onclick="setAppRangePreset('7')">近 7 天</button>
          <button type="button" class="cal-preset" onclick="setAppRangePreset('month')">本月</button>
          <button type="button" class="cal-preset" onclick="clearAppDatePicker()">清空</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeAppDatePicker()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="applyAppDatePicker()">确定</button>
        </div>
      </div>
    </div>`;
}
function appDocClick() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function toggleAppDatePicker() {
  appPickerOpen = !appPickerOpen;
  if (appPickerOpen) {
    appTmpFrom = appFrom;
    appTmpTo = appTo;
    setTimeout(() => document.addEventListener('click', appDocClick), 0);
  } else {
    document.removeEventListener('click', appDocClick);
  }
  renderActiveView();
}
function closeAppDatePicker() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function applyAppDatePicker() {
  appFrom = appTmpFrom;
  appTo = appTmpTo;
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  resetPage('apps');
  renderActiveView();
}
function clearAppDatePicker() {
  appTmpFrom = '';
  appTmpTo = '';
  renderActiveView();
}
function shiftAppCal(delta) {
  appCalMonth = ymAdd(appCalMonth, delta);
  renderActiveView();
}
function pickAppDate(date) {
  if (!appTmpFrom || appTmpTo) {
    appTmpFrom = date;
    appTmpTo = '';
  } else if (date < appTmpFrom) {
    appTmpTo = appTmpFrom;
    appTmpFrom = date;
  } else {
    appTmpTo = date;
  }
  renderActiveView();
}
function setAppRangePreset(type) {
  const shift = offset => {
    const d = new Date(REF_DATE + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  };
  if (type === '7') {
    appTmpFrom = shift(-6);
    appTmpTo = REF_DATE;
  } else if (type === 'month') {
    appTmpFrom = REF_DATE.slice(0, 7) + '-01';
    appTmpTo = REF_DATE;
  }
  renderActiveView();
}

// 按维度（个人订单 / 机构订单）汇总合伙人佣金，用于详情页选项卡下方的金额卡片
function partnerTabPoints(p, kind) {
  let w = 0, f = 0, s = 0, short = 0;
  p.orders.forEach(o => {
    const isOrg = orderKind(o) === 'ORG';
    if ((kind === 'org') !== isOrg) return;
    orderLines(o, p).forEach(l => {
      s += l.settled;
      if (kind === 'org') {
        if (l.state !== 'SETTLED') w += l.remaining;
      } else if (l.state === 'UNLOCKED') w += l.remaining;
      else if (l.state === 'FROZEN') f += l.remaining;
    });
    if (kind !== 'org') short += (o._refundShort || 0);
  });
  return {
    total: round2(w + f + s), withdrawable: round2(w), frozen: round2(f), settled: round2(s),
    unrecovered: Math.max(0, round2(short - (p._offsetPaid || 0)))
  };
}

            const lines = orderLines(o, p);
            const netPoints = Math.max(0, o.points - (o._recover || 0));
            const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);
            const pc = netPoints > 0 ? '#15803D' : 'var(--muted-foreground)';
            const isRefund = refunded > 0 || o.status === 'VOID_REFUND';
            const payBadge = isRefund
              ? '<span class="badge badge-danger" style="font-size:10.5px;">已退款</span>'
              : '<span class="badge badge-success" style="font-size:10.5px;">已支付</span>';

            return `<tr>

              <td class="num">${o.rate}%</td>
              <td><strong class="num" style="color:${pc};">${netPoints > 0 ? '+' : ''}¥${fmtC(netPoints)}</strong></td>
              <td class="num" style="color:var(--muted-foreground); font-size:11.5px;">${o.created_at || o.start}</td>
              <td class="col-sticky" style="text-align:right; white-space:nowrap;">
                <button class="btn btn-outline btn-sm" onclick="showOrderDetail('${o.id}')">订单详情</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${pagerBar(key, list.length)}
    `;
  }

  if (tab === 'settlements') {
    const key = 'det-settle-' + p.id;
    const rows = pagedList(key, p.settlements);
    return `
      <table class="official-table">
        <thead>
          <tr>
            <th>结算单号</th>
            <th>结算来源</th>
            <th>结算金额</th>
            <th>财务打款凭证号</th>
            <th>经办人</th>
            <th>核销时间</th>
            <th>打款备注</th>
          </tr>
        </thead>
        <tbody>
          ${p.settlements.length === 0 ? '<tr><td colspan="7" style="text-align:center; padding:32px; color:var(--muted-foreground);">暂无核销记录</td></tr>' :
          rows.map(s => {
            const hist = SETTLEMENT_HISTORY.find(h => h.settle_id === s.batch_no);
            return `
            <tr>
              <td><span class="code-badge">${s.batch_no}</span></td>
              <td>${hist && hist.source === 'ORG' ? '<span class="badge badge-blue">机构订单</span>' : '<span class="badge badge-neutral">用户订单</span>'}</td>

          `; }).join('')}
        </tbody>

      ${pagerBar(key, p.settlements.length)}

  }

  return '';
}

function findOrgOrder(orderId) {
  for (const p of PARTNERS) {
    const o = p.orders.find(x => x.id === orderId && orderKind(x) === 'ORG');
    if (o) return { p, o };
  }
  return null;
}

function openOrgOrderDetail(orderId) {
  const req = ORG_REQUESTS.find(x => x.order_id === orderId);
  if (req) { openOrgReviewDrawer(req.id); return; }
  toast('该机构订单为历史数据，请在合伙人详情中查看');
}

  const found = findOrgOrder(orderId); if (!found) return;
  const { p, o } = found;
  const pool = round2(o.points || 0), settled = orgSettledOf(o), remainPool = orgRemainOf(o);
  const contract = round2(o.pay_amount || 0), received = orgReceivedOf(o);
  const remainContract = Math.max(0, round2(contract - received));
  const today = (typeof REF_DATE === 'string' ? REF_DATE : '2026-11-06');

    <div class="drawer-mask show" id="drawer-org-settle" onclick="if(event.target===this)closeDrawer('drawer-org-settle')">
      <div class="drawer-panel" style="width:760px;">
        <div class="drawer-header">
          <div style="display:flex; align-items:center; gap:8px;">
            <h3 style="font-size:15px; font-weight:600;">结算核对单 · ${esc(o.org_name)}</h3>
            <span class="code-badge">${o.id}</span>

            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">合同金额</div><strong class="num">¥${fmtC(contract)}</strong></div>
            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">累计已回款</div><strong class="num">¥${fmtC(received)}</strong></div>
            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">剩余未回款</div><strong class="num">¥${fmtC(remainContract)}</strong></div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;">
            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">总佣金</div><strong class="num" style="color:#15803D;">¥${fmtC(pool)}</strong></div>
            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">已结算佣金</div><strong class="num">¥${fmtC(settled)}</strong></div>
            <div class="content-card" style="margin:0; padding:10px 12px;"><div style="font-size:11.5px; color:var(--muted-foreground);">待结算佣金</div><strong class="num" style="color:#A16207;">¥${fmtC(remainPool)}</strong></div>
          </div>
          <div class="form-group">
            <label class="form-group-label">本次到账回款金额<span class="req">*</span></label>

            <button class="btn btn-outline" onclick="closeDrawer('drawer-org-settle')">取消</button>

          </div>
        </div>
      </div>
    </div>`;
  calcOrgSettleFee();
}

function calcOrgSettleFee() {
  const el = document.getElementById('org-settle-received'); if (!el) return;
  const amt = Math.max(0, parseFloat(el.value) || 0);
  const rate = parseFloat(el.dataset.rate) || 0;
  const remainPool = parseFloat(el.dataset.remain) || 0;
  const raw = round2(amt * rate / 100);
  const fee = Math.min(raw, remainPool);
  document.getElementById('org-settle-fee').textContent = '¥' + fmtC(fee);
  document.getElementById('org-settle-final').textContent = '¥' + fmtC(fee);
  document.getElementById('org-settle-fee-note').textContent = amt <= 0
    ? ''
    : (raw > remainPool
      ? `按比例应为 ¥${fmtC(raw)}，受总佣金上限限制，本次按 ¥${fmtC(remainPool)} 结算，订单结清。`
      : `本次释放佣金 = ¥${fmtC(amt)} × ${rate}% = ¥${fmtC(raw)}`);
}

function confirmOrgSettle(orderId) {
  const found = findOrgOrder(orderId); if (!found) return;
  const { p, o } = found;
  const received = round2(parseFloat(document.getElementById('org-settle-received').value));
  const remainContract = Math.max(0, round2(round2(o.pay_amount || 0) - orgReceivedOf(o)));
  const remainPool = orgRemainOf(o);
  const fee = Math.min(round2(received * (o.rate || 0) / 100), remainPool);
  const date = (typeof REF_DATE === 'string' ? REF_DATE : '2026-11-06');
  const voucher = document.getElementById('org-settle-voucher').value.trim();
  const operator = document.getElementById('org-settle-operator').value.trim() || '张博文';
  const remark = document.getElementById('org-settle-remark').value.trim();
  if (!(received > 0)) { toast('请输入本次到账回款金额'); return; }
  if (received > remainContract + 0.001) { toast('回款金额不能超过剩余未回款 ¥' + fmtC(remainContract)); return; }
  if (!(fee > 0)) { toast('本次应结算佣金为 0，请核对回款金额'); return; }
  ORG_SETTLE_PENDING = {
    orderId: o.id, partnerId: p.id, org: o.org_name, rate: o.rate, date, received, fee,
    remainAfter: round2(remainPool - fee), voucher, operator, remark
  };
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask show" id="modal-org-settle-confirm">
      <div class="modal-dialog" style="width:460px;">
        <div class="modal-dialog-header"><h3>确认结算 · ${esc(o.org_name)}</h3><button class="btn-ghost" style="padding:4px;" onclick="closeModal('modal-org-settle-confirm')">✕</button></div>
        <div class="modal-dialog-body">

function executeOrgSettle() {
  const d = ORG_SETTLE_PENDING; if (!d) return;
  ORG_SETTLE_PENDING = null;
  closeModal('modal-org-settle-confirm');
  const found = findOrgOrder(d.orderId); if (!found) return;
  const { p, o } = found;
  const { date, received, fee, voucher, operator, remark } = d;
  const ym = date.slice(0, 7).replace('-', '');
  let seq = 1, sid = '';
  do { sid = 'SETTLE-' + ym + '-' + String(seq).padStart(3, '0'); seq++; } while (SETTLEMENT_HISTORY.some(s => s.settle_id === sid));
  SETTLEMENT_HISTORY.unshift({
    settle_id: sid, partner_id: p.id, partner_name: p.name, partner_phone: p.phone,
    channel_type: p.channel_type, points: fee, received, rate: o.rate, org_name: o.org_name, voucher, operator, settle_time: date + ' 10:00',
    remark: remark || (o.org_name + ' 机构订单结算'), source: 'ORG', org_order_id: o.id, lines: []
  });
  o.received_amount = round2(orgReceivedOf(o) + received);
  o.settled_amount = round2(orgSettledOf(o) + fee);
  if (p.logs) p.logs.unshift({ time: date + ' 10:00', operator, action: '机构订单结算', before: o.id, after: `回款 ¥${fmtC(received)} · 结算 ¥${fmtC(fee)}`, reason: remark || '-' });
  recalcAll();
  closeDrawer('drawer-org-settle');
  toast(`已结算 ¥${fmtC(fee)}：${o.org_name}`);
  renderSettlementsView(document.getElementById('main-view-container'));
}

function dashMetrics(list) {
  let userGmv = 0, orgGmv = 0, userFee = 0, orgFee = 0, cust = 0, paying = 0, orgDeals = 0;
  list.forEach(p => {
    cust += p.customers_count || 0;
    (p.orders || []).forEach(o => {
      const refunded = (o.refunds || []).reduce((a, r) => a + (r.amount || 0), 0);
      const net = Math.max(0, round2((o.pay_amount || 0) - refunded));
      const fee = Math.max(0, round2(net * (o.rate || 0) / 100));
      if (orderKind(o) === 'ORG') { orgGmv += net; orgFee += fee; if (net > 0) orgDeals++; }
      else { userGmv += net; userFee += fee; if (net > 0) paying++; }
    });
  });
  userGmv = round2(userGmv); orgGmv = round2(orgGmv);
  userFee = round2(userFee); orgFee = round2(orgFee);
  return {
    gmv: round2(userGmv + orgGmv), userGmv, orgGmv,
    fee: round2(userFee + orgFee), userFee, orgFee,
    cust, paying, orgDeals,
    userAov: paying > 0 ? round2(userGmv / paying) : 0,
    orgAov: orgDeals > 0 ? round2(orgGmv / orgDeals) : 0
  };
}

function pickChannelType(type) {
  const optExt = document.getElementById('opt-ext');
  const optInt = document.getElementById('opt-int');
  const firstIn = document.getElementById('in-approve-first-rate');
  const renewIn = document.getElementById('in-approve-renew-rate');

  if (type === 'EXTERNAL') {
    optExt.classList.add('selected');
    optInt.classList.remove('selected');
    optExt.querySelector('input').checked = true;
    firstIn.value = GLOBAL_CONFIG.external_first_rate;
    renewIn.value = GLOBAL_CONFIG.external_renew_rate;
  } else {
    optInt.classList.add('selected');
    optExt.classList.remove('selected');
    optInt.querySelector('input').checked = true;
    firstIn.value = GLOBAL_CONFIG.internal_first_rate;
    renewIn.value = GLOBAL_CONFIG.internal_renew_rate;
  }
}

function confirmApprovePartner(appId) {
  const app = APPLICATIONS.find(a => a.id === appId);
  if (!app) return;

  const isInt = document.getElementById('opt-int').classList.contains('selected');
  const channel = isInt ? 'INTERNAL' : 'EXTERNAL';
  const unit = document.getElementById('in-approve-unit').value;
  const firstRate = parseFloat(document.getElementById('in-approve-first-rate').value);
  const renewRate = parseFloat(document.getElementById('in-approve-renew-rate').value);
  const code = document.getElementById('in-approve-code').value.trim();

  if (!unit) { alert('请选择归属单位'); return; }
  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100 || !Number.isInteger(firstRate) || !Number.isInteger(renewRate)) { alert('首购与续购比例需为 0~100 的整数'); return; }
  if (!/^\d{4}$/.test(code)) { alert('专属推荐码必须为 4 位纯数字'); return; }
  if (PARTNERS.some(p => p.code === code)) { alert('该推荐码已被其他合伙人占用'); return; }

  const opTime = nowTime();
  app.status = 'APPROVED';
  app.approve_time = opTime;
  app.approve_by = '张博文';
  app.logs.unshift({
    time: opTime,
    operator: '张博文',
    action: '审核通过',
    detail: `设为${channel==='INTERNAL'?'内部渠道':'外部渠道'}，归属单位 ${unit}，首购 ${firstRate}% / 续购 ${renewRate}%，推荐码 ${code}`
  });

  PARTNERS.unshift({
    id: 'PT-' + code,
    name: app.name,
    unit: unit,
    org: app.org,
    role: app.role,
    phone: app.phone,
    wx: app.wx,
    channel_type: channel,
    code: code,
    first_rate: firstRate,
    renew_rate: renewRate,
    customers_count: 0,
    paying_count: 0,
    points: { total: 0, withdrawable: 0, frozen: 0, settled: 0, unrecovered: 0 },
    status: 'NORMAL',
    freeze_reason: '',
    join_time: opTime,
    orders: [], flow: [], settlements: [], customers: [],
    logs: [
      { time: opTime, operator: '张博文', action: '入驻建档', before: '待审核', after: '正常', reason: '资质审核通过' }
    ]
  });

  closeModal('modal-approve');
  toast(`合伙人【${app.name}】审核通过！推荐码：${code}`);
  updateSidebarMenu();
  renderApplicationsView(document.getElementById('main-view-container'));
}

            <div class="form-hint-note">合伙人前台登录凭据，不可更改。</div>
          </div>

            <label class="form-group-label">微信号</label>
            <input class="form-input-full" id="dr-in-wx" value="${app.wx || ''}" placeholder="未填写">
          </div>

          ${app.status === 'REJECTED' && app.reject_reason ? `
            <div style="background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 16px; font-size: 12.5px; color: #991B1B;">
              <strong>历史拒绝原因：</strong>${app.reject_reason}
            </div>
          ` : ''}
        </div>

        <div class="drawer-footer">
          <button class="btn btn-outline" onclick="closeDrawer('drawer-app')">取消</button>
          <button class="btn btn-primary" onclick="saveAppInfo('${app.id}')">保存修改</button>

}

function saveAppInfo(appId) {
  const app = APPLICATIONS.find(a => a.id === appId);
  if (!app) return;
  const name = document.getElementById('dr-in-name').value.trim();
  const org = document.getElementById('dr-in-org').value.trim();
  const wx = document.getElementById('dr-in-wx').value.trim();

  if (!name || !org) { alert('姓名与单位必填'); return; }

  app.name = name; app.org = org; app.wx = wx;
  app.logs.unshift({
    time: nowTime(),
    operator: '张博文',
    action: '资料信息维护',
    detail: `修改为: ${name} / ${org}`
  });

  closeDrawer('drawer-app');
  toast('资料已成功更新');
  renderApplicationsView(document.getElementById('main-view-container'));
}

function confirmModifyRate(partnerId) {
  const p = PARTNERS.find(item => item.id === partnerId);
  if (!p) return;
  const firstRate = parseFloat(document.getElementById('in-new-first-rate').value);
  const renewRate = parseFloat(document.getElementById('in-new-renew-rate').value);

  if (isNaN(firstRate) || firstRate < 0 || firstRate > 100 || isNaN(renewRate) || renewRate < 0 || renewRate > 100 || !Number.isInteger(firstRate) || !Number.isInteger(renewRate)) { alert('首购与续购比例需为 0~100 的整数'); return; }

  const oldFirst = p.first_rate, oldRenew = p.renew_rate;
  p.first_rate = firstRate;
  p.renew_rate = renewRate;
  p.logs.unshift({
    time: nowTime(),
    operator: '张博文',

    before: `首购 ${oldFirst}% / 续购 ${oldRenew}%`,
    after: `首购 ${firstRate}% / 续购 ${renewRate}%`
  });

  closeModal('modal-rate');
  toast(`分成比例已调整为 首购 ${firstRate}% / 续购 ${renewRate}%`);
  renderActiveView();
}

function confirmFreeze(partnerId) {

function unfreezePartner(partnerId) {

  p.status = 'NORMAL';
  p.freeze_reason = '';
  p.logs.unshift({

    operator: '张博文',
    action: '解冻账号',
    before: '已冻结',
    after: '正常',
    reason: '合规核实完毕恢复正常合作'
  });

  toast(`合伙人【${p.name}】已成功解冻`);
  renderActiveView();
}

// 6. 确认结算核销弹窗
// 7. 页面：系统设置 (SETTINGS)
let settingsEditing = { rates: false, freeze: false };
let pendingSettings = null;
let unitEditing = -1;

function renderSettingsView(container) {
  const onR = settingsEditing.rates, onF = settingsEditing.freeze;
  const boxStyle = on => `display: flex; align-items: center; height: 36px; border: 1px solid ${on ? 'var(--input)' : 'var(--border)'}; border-radius: var(--radius-md); background: ${on ? '#fff' : '#F4F4F5'}; padding: 0 12px; gap: 8px;`;

      <span style="flex: none; font-size: 12px; color: var(--muted-foreground);">${label}</span>
      <input class="num" type="number" step="1" min="0" max="100" id="${id}" value="${value}" ${on ? '' : 'disabled'} style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; text-align: right; color: ${on ? 'var(--foreground)' : 'var(--muted-foreground)'};">
    </div>`;

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <button class="btn btn-outline" onclick="cancelSettingsEdit('${key}')">取消</button>
      <button class="btn btn-primary" onclick="${saveFn}">保存</button>
    </div>`;

  container.innerHTML = `
    <div style="margin-bottom: 22px;">
      <h1 style="font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;">系统设置</h1>
    </div>

    <div class="content-card" style="padding: 20px 22px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 14px; font-weight: 600;">默认分成比例</div>
        ${onR ? '' : `<button class="btn btn-outline btn-sm" onclick="startSettingsEdit('rates')">修改</button>`}
      </div>
      <div class="form-hint-note" style="margin: 4px 0 16px;">保存后同步为全系统所有管理者审核、建档时带出的默认比例；仅对后续新合伙人生效，已有合伙人比例保持不变。</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-group-label">内部渠道默认比例（%）</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${numInput('set-in-first', '首购', GLOBAL_CONFIG.internal_first_rate, onR)}
            ${numInput('set-in-renew', '续购', GLOBAL_CONFIG.internal_renew_rate, onR)}
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-group-label">外部渠道默认比例（%）</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            ${numInput('set-ext-first', '首购', GLOBAL_CONFIG.external_first_rate, onR)}
            ${numInput('set-ext-renew', '续购', GLOBAL_CONFIG.external_renew_rate, onR)}
          </div>
        </div>
      </div>
      ${onR ? editActions('rates', 'requestSaveRates()') : ''}
    </div>

    <div class="content-card" style="padding: 20px 22px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 14px; font-weight: 600;">冻结规则</div>
        ${onF ? '' : `<button class="btn btn-outline btn-sm" onclick="startSettingsEdit('freeze')">修改</button>`}
      </div>
      <div class="form-hint-note" style="margin: 4px 0 16px;">推广币解冻日 = 服务期结束日 + N 天（防退款观察期）。修改并保存后，全系统按新规则重算解冻日与冻结中金额。</div>
      <div class="form-group" style="max-width: 280px; margin-bottom: 0;">
        <label class="form-group-label">冻结观察期 T+N（天）</label>
        <input class="form-input-full num" type="number" step="1" min="0" max="60" id="set-unfreeze-days" value="${GLOBAL_CONFIG.unfreeze_days}" ${onF ? '' : 'disabled'}>
        <div class="form-hint-note">当前规则：T+${GLOBAL_CONFIG.unfreeze_days} 天。默认 7 天，可调整 0-60 天。</div>
      </div>
      ${onF ? editActions('freeze', 'requestSaveFreeze()') : ''}
    </div>

    <div class="content-card" style="padding: 20px 22px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <div style="font-size: 14px; font-weight: 600;">单位配置</div>
        <button class="btn btn-outline btn-sm" onclick="openAddUnitModal()">新增单位</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        ${UNITS.map((u, i) => {
          if (unitEditing === i) {
            return `<div style="display: flex; gap: 8px; align-items: center;">
              <input class="form-input-full" id="set-unit-name-${i}" value="${u}" style="flex: 1;">
              <button class="btn btn-outline btn-sm" style="flex: none;" onclick="cancelUnitEdit()">取消</button>
              <button class="btn btn-primary btn-sm" style="flex: none;" onclick="saveUnitName(${i})">保存</button>
            </div>`;
          }
          return `<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px;">
            <div style="font-size: 13px;">${u}</div>
            <button class="btn btn-ghost btn-sm" onclick="startUnitEdit(${i})">修改</button>
          </div>`;
        }).join('')}
      </div>
      ${PARTNERS.some(p => UNITS.indexOf(p.unit) < 0) ? `<div class="form-hint-note" style="color: var(--destructive); margin-top: 12px;">有 ${PARTNERS.filter(p => UNITS.indexOf(p.unit) < 0).length} 位合伙人的归属单位不在配置中，需在审核建档时重新指定。</div>` : ''}
    </div>
  `;
}

function startSettingsEdit(key) {
  settingsEditing[key] = true;
  renderActiveView();
}

function cancelSettingsEdit(key) {
  settingsEditing[key] = false;
  pendingSettings = null;
  renderActiveView();
}

function startUnitEdit(i) {
  unitEditing = i;
  renderActiveView();
}

function cancelUnitEdit() {
  unitEditing = -1;
  renderActiveView();
}

function saveUnitName(i) {
  const v = (document.getElementById('set-unit-name-' + i).value || '').trim();
  const old = UNITS[i];
  if (!v) { alert('单位名称不能为空'); return; }
  if (UNITS.some((u, k) => u === v && k !== i)) { alert('该单位名称已存在'); return; }
  if (v === old) { unitEditing = -1; renderActiveView(); return; }

  UNITS[i] = v;
  PARTNERS.forEach(p => { if (p.unit === old) p.unit = v; });
  CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `单位改名：${old} → ${v}` });
  unitEditing = -1;
  toast(`单位已更名为「${v}」`);
  renderActiveView();
}

function openAddUnitModal() {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask show" id="modal-add-unit">
      <div class="modal-dialog" style="max-width: 420px;">
        <div class="modal-dialog-header">
          <h3>新增单位</h3>
          <button class="btn-ghost" style="padding: 4px;" onclick="closeModal('modal-add-unit')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-dialog-body">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-group-label">单位名称 <span class="req">*</span></label>
            <input class="form-input-full" id="set-new-unit" placeholder="请输入单位名称" maxlength="20">
          </div>
        </div>
        <div class="modal-dialog-footer">
          <button class="btn btn-outline" onclick="closeModal('modal-add-unit')">取消</button>
          <button class="btn btn-primary" onclick="addUnit()">确认新增</button>
        </div>
      </div>
    </div>`;
  const el = document.getElementById('set-new-unit');
  if (el) el.focus();
}

function addUnit() {
  const el = document.getElementById('set-new-unit');
  const v = (el.value || '').trim();
  if (!v) { alert('请输入单位名称'); return; }
  if (UNITS.indexOf(v) >= 0) { alert('该单位已存在'); return; }

  UNITS.push(v);
  CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `新增单位：${v}` });
  closeModal('modal-add-unit');
  toast(`已新增单位「${v}」`);
  renderActiveView();
}

function requestSaveRates() {
  const iF = parseFloat(document.getElementById('set-in-first').value);
  const iR = parseFloat(document.getElementById('set-in-renew').value);
  const eF = parseFloat(document.getElementById('set-ext-first').value);
  const eR = parseFloat(document.getElementById('set-ext-renew').value);
  if ([iF, iR, eF, eR].some(v => isNaN(v) || v < 0 || v > 100 || !Number.isInteger(v))) { alert('首购与续购比例需为 0~100 的整数'); return; }

  const diffs = [];
  if (iF !== GLOBAL_CONFIG.internal_first_rate) diffs.push(`内部 首购 ${GLOBAL_CONFIG.internal_first_rate}% → ${iF}%`);
  if (iR !== GLOBAL_CONFIG.internal_renew_rate) diffs.push(`内部 续购 ${GLOBAL_CONFIG.internal_renew_rate}% → ${iR}%`);
  if (eF !== GLOBAL_CONFIG.external_first_rate) diffs.push(`外部 首购 ${GLOBAL_CONFIG.external_first_rate}% → ${eF}%`);
  if (eR !== GLOBAL_CONFIG.external_renew_rate) diffs.push(`外部 续购 ${GLOBAL_CONFIG.external_renew_rate}% → ${eR}%`);
  if (!diffs.length) { settingsEditing.rates = false; toast('未修改任何配置'); renderActiveView(); return; }

  pendingSettings = { type: 'rates', values: { iF, iR, eF, eR }, diffs };
  openSettingsConfirm('默认分成比例', diffs);
}

function requestSaveFreeze() {
  const days = parseInt(document.getElementById('set-unfreeze-days').value, 10);
  if (isNaN(days) || days < 0 || days > 60) { alert('请输入有效的冻结观察期天数 (0~60 天)'); return; }

  const diffs = [];
  if (days !== GLOBAL_CONFIG.unfreeze_days) diffs.push(`冻结观察期 T+${GLOBAL_CONFIG.unfreeze_days} → T+${days}`);
  if (!diffs.length) { settingsEditing.freeze = false; toast('未修改任何配置'); renderActiveView(); return; }

  pendingSettings = { type: 'freeze', values: { days }, oldDays: GLOBAL_CONFIG.unfreeze_days, diffs };
  openSettingsConfirm('冻结规则', diffs);
}

function openSettingsConfirm(title, diffs) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask show" id="modal-set-confirm">
      <div class="modal-dialog" style="max-width: 440px;">
        <div class="modal-dialog-header">
          <h3>确认修改 · ${title}</h3>
          <button class="btn-ghost" style="padding: 4px;" onclick="closeModal('modal-set-confirm')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-dialog-body">
          <p style="font-size: 13px; color: var(--muted-foreground); margin-bottom: 12px;">以下配置将被变更，请确认无误后保存：</p>
          ${diffs.map(d => `<div style="font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;">${d}</div>`).join('')}
        </div>
        <div class="modal-dialog-footer">
          <button class="btn btn-outline" onclick="closeModal('modal-set-confirm')">取消</button>
          <button class="btn btn-primary" onclick="applySettingsChanges()">确认保存</button>
        </div>
      </div>
    </div>`;
}

function applySettingsChanges() {
  const p = pendingSettings;
  if (!p) return;
  if (p.type === 'rates') {
    const { iF, iR, eF, eR } = p.values;
    GLOBAL_CONFIG.internal_first_rate = iF;
    GLOBAL_CONFIG.internal_renew_rate = iR;
    GLOBAL_CONFIG.external_first_rate = eF;
    GLOBAL_CONFIG.external_renew_rate = eR;
    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整默认比例：${p.diffs.join('；')}` });
    toast(`默认比例已更新：内部 ${iF}% / ${iR}%，外部 ${eF}% / ${eR}%`);
  } else {
    GLOBAL_CONFIG.unfreeze_days = p.values.days;
    CONFIG_LOGS.unshift({ time: nowTime(), operator: '张博文', text: `调整冻结规则：T+${p.oldDays} → T+${p.values.days}` });
    toast(`冻结规则已更新：T+${p.values.days} 天`);
  }
  settingsEditing[p.type] = false;
  pendingSettings = null;
  closeModal('modal-set-confirm');
  recalcAll();
  renderActiveView();
}

// 通用助手函数
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
function closeDrawer(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
function toast(msg) {
  const el = document.getElementById('app-toast');
  const txt = document.getElementById('toast-text');
  if (!el || !txt) return;
  txt.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function nowTime() {
  const d = new Date();
  const pad = n => n < 10 ? '0' + n : n;
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatNum(n) {
  if (n === null || n === undefined) return '0';
  const v = Math.round(n * 100) / 100;
  return v.toLocaleString(undefined, Number.isInteger(v) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// 佣金一律按分取整（保留两位小数）
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmtC(n) {
  if (n === null || n === undefined) return '0.00';
  return round2(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

window.onload = function() {
  initRouter();
};
</script>
