<script id="doc-ops" type="application/json">"<!DOCTYPE html>\r\n<html lang=\"zh-CN\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n<title>立理 S1 平台管理后台 — 合伙人管理</title>\r\n<style>\r\n/* \r\n * 立理 S1 官方统一设计规范 (Tailwind CSS v4 + shadcn/ui 官方逆向提取版)\r\n * 来源: https://ali-dev.s1.liliai.cn/admin/\r\n */\r\n:root {\r\n  --background: #FFFFFF;\r\n  --foreground: #09090B;\r\n  --muted: #F4F4F5;\r\n  --muted-foreground: #71717A;\r\n  --card: #FFFFFF;\r\n  --card-foreground: #09090B;\r\n  --popover: #FFFFFF;\r\n  --popover-foreground: #09090B;\r\n  --border: #E4E4E7;\r\n  --input: #E4E4E7;\r\n  --primary: #09090B;\r\n  --primary-hover: #27272A;\r\n  --primary-foreground: #FAFAFA;\r\n  --secondary: #F4F4F5;\r\n  --secondary-foreground: #18181B;\r\n  --accent: #F4F4F5;\r\n  --accent-foreground: #18181B;\r\n  --destructive: #E11D48;\r\n  --destructive-hover: #BE123C;\r\n  --destructive-foreground: #FFFFFF;\r\n  --ring: #71717A;\r\n  --radius-sm: 6px;\r\n  --radius-md: 8px;\r\n  --radius-lg: 12px;\r\n  --radius-xl: 16px;\r\n  --radius-pill: 9999px;\r\n  --sidebar-w: 256px;\r\n  --header-h: 56px;\r\n  --font-sans: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", sans-serif;\r\n  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);\r\n  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.08);\r\n  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);\r\n  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.08);\r\n}\r\n\r\n* { box-sizing: border-box; margin: 0; padding: 0; }\r\nbody {\r\n  font-family: var(--font-sans);\r\n  background-color: #FAFAFA;\r\n  color: var(--foreground);\r\n  line-height: 1.5;\r\n  font-size: 14px;\r\n  -webkit-font-smoothing: antialiased;\r\n}\r\n\r\n/* 等宽数字排版 */\r\n.num { font-variant-numeric: tabular-nums; font-feature-settings: \"tnum\"; }\r\n\r\n/* 页面总布局 */\r\n#app-layout { display: flex; min-height: 100vh; }\r\n\r\n/* 左侧侧边栏 (1:1 复刻官方) */\r\naside#app-sidebar {\r\n  width: var(--sidebar-w);\r\n  background: var(--card);\r\n  border-right: 1px solid var(--border);\r\n  display: flex;\r\n  flex-direction: column;\r\n  position: fixed;\r\n  top: 0; bottom: 0; left: 0;\r\n  z-index: 50;\r\n}\r\n.sidebar-brand {\r\n  padding: 18px 20px 14px;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.brand-title {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  font-size: 19px;\r\n  font-weight: 800;\r\n  color: #09090B;\r\n  letter-spacing: -0.02em;\r\n}\r\n.brand-badge {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  border: 1.5px solid #09090B;\r\n  padding: 1px 5px;\r\n  border-radius: 4px;\r\n  line-height: 1.2;\r\n}\r\n.brand-sub {\r\n  font-size: 11px;\r\n  color: var(--muted-foreground);\r\n  margin-top: 2px;\r\n  font-weight: 400;\r\n}\r\n\r\n.sidebar-menu-wrap {\r\n  padding: 12px 12px;\r\n  flex: 1;\r\n  overflow-y: auto;\r\n}\r\n.menu-group-header {\r\n  font-size: 11px;\r\n  font-weight: 500;\r\n  color: var(--muted-foreground);\r\n  padding: 8px 10px 4px;\r\n}\r\n.sidebar-menu-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 8px 12px;\r\n  border-radius: var(--radius-md);\r\n  color: var(--foreground);\r\n  text-decoration: none;\r\n  font-size: 13.5px;\r\n  font-weight: 400;\r\n  margin-bottom: 2px;\r\n  cursor: pointer;\r\n  transition: background-color 0.15s ease, color 0.15s ease;\r\n}\r\n.sidebar-menu-item:hover { background-color: var(--muted); }\r\n.sidebar-menu-item.active {\r\n  background-color: var(--muted);\r\n  font-weight: 600;\r\n  color: var(--foreground);\r\n}\r\n.sidebar-menu-item svg {\r\n  width: 16px; height: 16px;\r\n  stroke: var(--foreground);\r\n  flex-shrink: 0;\r\n}\r\n.sidebar-menu-item .menu-badge {\r\n  margin-left: auto;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  padding: 1px 6px;\r\n  border-radius: var(--radius-pill);\r\n  background: var(--destructive);\r\n  color: #fff;\r\n}\r\n.sidebar-menu-item .menu-tag-pill {\r\n  margin-left: auto;\r\n  font-size: 10.5px;\r\n  padding: 1px 6px;\r\n  border-radius: var(--radius-sm);\r\n  background: #E4E4E7;\r\n  color: #52525B;\r\n}\r\n\r\n/* 侧边栏底部用户信息 (1:1 复刻官方张博文) */\r\n.sidebar-footer {\r\n  padding: 14px 16px;\r\n  border-top: 1px solid var(--border);\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n}\r\n.user-profile-summary {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  min-width: 0;\r\n}\r\n.user-avatar-circle {\r\n  width: 32px; height: 32px;\r\n  border-radius: var(--radius-pill);\r\n  background: #E4E4E7;\r\n  color: #18181B;\r\n  display: flex; align-items: center; justify-content: center;\r\n  font-weight: 600; font-size: 13px;\r\n}\r\n.user-meta-texts { min-width: 0; }\r\n.user-meta-name { font-size: 13px; font-weight: 600; color: var(--foreground); line-height: 1.2; }\r\n.user-meta-role { font-size: 11.5px; color: var(--muted-foreground); margin-top: 1px; }\r\n\r\n/* 页面内容承载容器 */\r\nmain#app-main {\r\n  margin-left: var(--sidebar-w);\r\n  flex: 1;\r\n  display: flex;\r\n  flex-direction: column;\r\n  min-width: 0;\r\n}\r\n\r\n/* 官方顶栏 (1:1 复刻) */\r\nheader#app-header {\r\n  height: var(--header-h);\r\n  background: var(--card);\r\n  border-bottom: 1px solid var(--border);\r\n  position: sticky; top: 0;\r\n  z-index: 40;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 0 24px;\r\n}\r\n.header-left {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n}\r\n.btn-icon-square {\r\n  width: 32px; height: 32px;\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  background: var(--card);\r\n  display: flex; align-items: center; justify-content: center;\r\n  cursor: pointer;\r\n  color: var(--foreground);\r\n}\r\n.btn-icon-square:hover { background: var(--muted); }\r\n\r\n.header-right {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n}\r\n.search-pill-box {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  background: rgba(244, 244, 245, 0.6);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-md);\r\n  padding: 0 10px;\r\n  height: 32px;\r\n  width: 200px;\r\n  color: var(--muted-foreground);\r\n  font-size: 12.5px;\r\n  cursor: pointer;\r\n  transition: all 0.15s ease;\r\n}\r\n.search-pill-box:hover { background: #fff; border-color: #A1A1AA; }\r\n.kbd-badge {\r\n  font-size: 10px;\r\n  border: 1px solid #D4D4D8;\r\n  border-radius: 4px;\r\n  padding: 1px 4px;\r\n  margin-left: auto;\r\n  font-family: inherit;\r\n  color: var(--muted-foreground);\r\n}\r\n.btn-round-icon {\r\n  width: 32px; height: 32px;\r\n  border-radius: var(--radius-pill);\r\n  border: 1px solid transparent;\r\n  background: transparent;\r\n  display: flex; align-items: center; justify-content: center;\r\n  cursor: pointer;\r\n  color: var(--muted-foreground);\r\n}\r\n.btn-round-icon:hover { background: var(--muted); color: var(--foreground); }\r\n\r\n/* 主体容器 */\r\n#main-view-container {\r\n  padding: 24px 28px 48px;\r\n  flex: 1;\r\n}\r\n\r\n/* 官方按钮组件规范 (Buttons) */\r\n.btn {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  gap: 6px;\r\n  height: 34px;\r\n  padding: 0 14px;\r\n  border-radius: var(--radius-md);\r\n  font-size: 13px;\r\n  font-weight: 500;\r\n  cursor: pointer;\r\n  border: 1px solid transparent;\r\n  transition: all 0.15s ease;\r\n  white-space: nowrap;\r\n  text-decoration: none;\r\n  font-family: inherit;\r\n}\r\n.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }\r\n/* 纯黑主按钮 (通过、新增、导出) */\r\n.btn-primary {\r\n  background: var(--primary);\r\n  color: var(--primary-foreground);\r\n  border-color: var(--primary);\r\n  box-shadow: var(--shadow-xs);\r\n}\r\n.btn-primary:hover { background: var(--primary-hover); }\r\n\r\n/* 白底细灰轮廓按钮 (详情、改比例、重置) */\r\n.btn-outline {\r\n  background: #FFFFFF;\r\n  color: var(--foreground);\r\n  border-color: var(--border);\r\n  box-shadow: var(--shadow-xs);\r\n}\r\n.btn-outline:hover { background: var(--muted); border-color: #D4D4D8; }\r\n\r\n/* 危险红底按钮 (拒绝、删除) */\r\n.btn-destructive {\r\n  background: var(--destructive);\r\n  color: #FFFFFF;\r\n  border-color: var(--destructive);\r\n  box-shadow: var(--shadow-xs);\r\n}\r\n.btn-destructive:hover { background: var(--destructive-hover); }\r\n\r\n/* 幽灵无框按钮 */\r\n.btn-ghost {\r\n  background: transparent;\r\n  color: var(--muted-foreground);\r\n  border-color: transparent;\r\n}\r\n.btn-ghost:hover { background: var(--muted); color: var(--foreground); }\r\n\r\n/* 状态 Badge 标签 (1:1 官方规范) */\r\n.badge {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 4px;\r\n  padding: 1.5px 8px;\r\n  border-radius: var(--radius-pill);\r\n  font-size: 12px;\r\n  font-weight: 500;\r\n  line-height: 1.4;\r\n  white-space: nowrap;\r\n  border: 1px solid transparent;\r\n}\r\n.badge-success { background: #F0FDF4; color: #15803D; border-color: #DCFCE7; }\r\n.badge-warning { background: #FEFCE8; color: #A16207; border-color: #FEF08A; }\r\n.badge-danger { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }\r\n.badge-neutral { background: #FFFFFF; color: #3F3F46; border-color: var(--border); }\r\n.badge-blue { background: #EFF6FF; color: #1D4ED8; border-color: #DBEAFE; }\r\n\r\n/* 官方卡片容器 (Cards) */\r\n.content-card {\r\n  background: var(--card);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-xl);\r\n  box-shadow: var(--shadow-xs);\r\n  margin-bottom: 20px;\r\n  overflow: hidden;\r\n}\r\n.card-header-bar {\r\n  padding: 16px 20px 14px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  border-bottom: 1px solid var(--border);\r\n}\r\n.card-header-title {\r\n  font-size: 14.5px;\r\n  font-weight: 600;\r\n  color: var(--foreground);\r\n}\r\n.card-body-padding { padding: 18px 20px; }\r\n\r\n/* 筛选表单网格 (Filter Box) */\r\n.filter-card {\r\n  background: var(--card);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-xl);\r\n  box-shadow: var(--shadow-xs);\r\n  padding: 18px 20px;\r\n  margin-bottom: 20px;\r\n}\r\n.filter-title-row {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  margin-bottom: 14px;\r\n}\r\n.filter-title { font-size: 14px; font-weight: 600; color: var(--foreground); }\r\n.filter-inputs-grid {\r\n  display: flex;\r\n  gap: 12px;\r\n  flex-wrap: wrap;\r\n  align-items: flex-end;\r\n}\r\n.filter-field {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n  min-width: 140px;\r\n}\r\n.field-label { font-size: 11.5px; font-weight: 500; color: var(--muted-foreground); }\r\n.input-control {\r\n  height: 34px;\r\n  background: #FFFFFF;\r\n  border: 1px solid var(--input);\r\n  border-radius: var(--radius-md);\r\n  padding: 0 10px;\r\n  font-size: 13px;\r\n  color: var(--foreground);\r\n  outline: none;\r\n  font-family: inherit;\r\n  transition: border-color 0.15s ease, box-shadow 0.15s ease;\r\n}\r\n.input-control:focus {\r\n  border-color: #09090B;\r\n  box-shadow: 0 0 0 1px #09090B;\r\n}\r\n\r\n/* 官方数据表格 (Data Table) */\r\n.table-container {\r\n  background: var(--card);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-xl);\r\n  box-shadow: var(--shadow-xs);\r\n  overflow-x: auto;\r\n}\r\n.table-toolbar {\r\n  padding: 14px 20px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  border-bottom: 1px solid var(--border);\r\n  font-size: 13px;\r\n}\r\n.table-summary-text { color: var(--muted-foreground); }\r\n.table-summary-text strong { color: var(--foreground); }\r\n\r\n/* 表格底部翻页器 */\r\n.table-pager {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 14px 20px;\r\n  border-top: 1px solid var(--border);\r\n  font-size: 12.5px;\r\n  background: var(--card);\r\n}\r\n.pager-total { color: var(--muted-foreground); }\r\n.pager-actions { display: flex; align-items: center; gap: 8px; }\r\n.pager-size {\r\n  height: 28px;\r\n  font-size: 12px;\r\n  padding: 0 8px;\r\n  border-radius: var(--radius-md);\r\n  width: auto;\r\n}\r\n.pager-arrow {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  gap: 4px;\r\n  height: 28px;\r\n  padding: 0 10px;\r\n  font-size: 12px;\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-md);\r\n  background: var(--card);\r\n  color: var(--foreground);\r\n  cursor: pointer;\r\n}\r\n.pager-arrow:hover:not(:disabled) { background: var(--accent); }\r\n.pager-arrow:disabled { color: var(--muted-foreground); opacity: .55; cursor: not-allowed; }\r\n\r\n/* 日期区间选择器（shadcn/ui 风格） */\r\n.date-range-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }\r\n.date-popover {\r\n  position: absolute;\r\n  top: calc(100% + 6px);\r\n  right: 0;\r\n  left: auto;\r\n  z-index: 60;\r\n  max-width: calc(100vw - 32px);\r\n  background: var(--card);\r\n  border: 1px solid var(--border);\r\n  border-radius: 12px;\r\n  box-shadow: 0 12px 32px rgba(0, 0, 0, .14);\r\n  padding: 12px;\r\n}\r\n.cal-wrap { display: flex; gap: 16px; }\r\n.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; }\r\n.cal-head span { font-size: 12.5px; font-weight: 600; color: var(--foreground); }\r\n.cal-nav {\r\n  width: 24px; height: 24px;\r\n  display: flex; align-items: center; justify-content: center;\r\n  border: none; background: transparent; border-radius: 6px;\r\n  color: var(--muted-foreground); cursor: pointer;\r\n}\r\n.cal-nav:hover { background: var(--accent); color: var(--foreground); }\r\n.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 30px); }\r\n.cal-weekdays div { text-align: center; font-size: 11px; color: var(--muted-foreground); padding: 4px 0; }\r\n.cal-day {\r\n  height: 30px; width: 30px;\r\n  border: none; background: transparent; border-radius: 6px;\r\n  font-size: 12.5px; color: var(--foreground); cursor: pointer;\r\n}\r\n.cal-day:hover { background: var(--accent); }\r\n.cal-day.muted { color: var(--muted-foreground); opacity: .5; }\r\n.cal-day.in-range { background: var(--accent); border-radius: 0; }\r\n.cal-day.edge { background: var(--primary); color: var(--primary-foreground); border-radius: 6px; }\r\n.cal-day.edge:hover { background: var(--primary); }\r\n.cal-day.today { box-shadow: inset 0 0 0 1px var(--border); }\r\n.cal-footer {\r\n  display: flex; align-items: center; justify-content: space-between;\r\n  border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px;\r\n}\r\n.cal-presets { display: flex; gap: 2px; }\r\n.cal-preset {\r\n  border: none; background: transparent; cursor: pointer;\r\n  font-size: 12px; color: var(--muted-foreground); padding: 4px 8px; border-radius: 6px;\r\n}\r\n.cal-preset:hover { background: var(--accent); color: var(--foreground); }\r\n\r\ntable.official-table {\r\n  width: 100%;\r\n  border-collapse: collapse;\r\n  font-size: 13px;\r\n  text-align: left;\r\n}\r\ntable.official-table th {\r\n  padding: 10px 16px;\r\n  color: var(--muted-foreground);\r\n  font-weight: 500;\r\n  font-size: 12px;\r\n  border-bottom: 1px solid var(--border);\r\n  white-space: nowrap;\r\n}\r\ntable.official-table td {\r\n  padding: 13px 16px;\r\n  border-bottom: 1px solid var(--border);\r\n  color: var(--foreground);\r\n  vertical-align: middle;\r\n  white-space: nowrap;\r\n}\r\ntable.official-table tr:last-child td { border-bottom: none; }\r\ntable.official-table tbody tr:hover { background: #FAFAFA; }\r\n\r\n/* 黏性固定右侧操作列 */\r\nth.col-sticky, td.col-sticky {\r\n  position: sticky;\r\n  right: 0;\r\n  background: var(--card);\r\n  box-shadow: -4px 0 8px rgba(0, 0, 0, 0.02);\r\n  z-index: 2;\r\n}\r\ntbody tr:hover td.col-sticky { background: #FAFAFA; }\r\n\r\n.code-badge {\r\n  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\r\n  font-size: 12px;\r\n  background: #F4F4F5;\r\n  padding: 2px 6px;\r\n  border-radius: 4px;\r\n  font-weight: 600;\r\n  color: #18181B;\r\n}\r\n\r\n/* 分段选项卡 (Segmented Tabs，如计费/扣费页面) */\r\n.segmented-tabs {\r\n  display: inline-flex;\r\n  background: #F4F4F5;\r\n  padding: 3px;\r\n  border-radius: var(--radius-md);\r\n  gap: 2px;\r\n  margin-bottom: 18px;\r\n}\r\n.seg-tab-btn {\r\n  padding: 6px 14px;\r\n  font-size: 13px;\r\n  font-weight: 500;\r\n  color: var(--muted-foreground);\r\n  border-radius: var(--radius-sm);\r\n  cursor: pointer;\r\n  transition: all 0.15s ease;\r\n  border: none;\r\n  background: transparent;\r\n}\r\n.seg-tab-btn:hover { color: var(--foreground); }\r\n.seg-tab-btn.active {\r\n  background: #FFFFFF;\r\n  color: var(--foreground);\r\n  font-weight: 600;\r\n  box-shadow: var(--shadow-xs);\r\n}\r\n\r\n/* 官方模态弹窗 (Modal) */\r\n.modal-mask {\r\n  position: fixed; inset: 0;\r\n  background: rgba(9, 9, 11, 0.4);\r\n  backdrop-filter: blur(2px);\r\n  z-index: 120;\r\n  display: flex; align-items: center; justify-content: center;\r\n  padding: 20px;\r\n  opacity: 0; pointer-events: none;\r\n  transition: opacity 0.2s ease;\r\n}\r\n.modal-mask.show { opacity: 1; pointer-events: auto; }\r\n.modal-dialog {\r\n  background: #FFFFFF;\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-xl);\r\n  box-shadow: var(--shadow-lg);\r\n  width: 100%; max-width: 520px;\r\n  overflow: hidden;\r\n  transform: translateY(10px) scale(0.98);\r\n  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);\r\n}\r\n.modal-mask.show .modal-dialog { transform: translateY(0) scale(1); }\r\n.modal-dialog-header {\r\n  padding: 16px 20px;\r\n  border-bottom: 1px solid var(--border);\r\n  display: flex; align-items: center; justify-content: space-between;\r\n}\r\n.modal-dialog-header h3 { font-size: 15.5px; font-weight: 600; color: var(--foreground); }\r\n.modal-dialog-body { padding: 20px; max-height: calc(85vh - 120px); overflow-y: auto; }\r\n.modal-dialog-footer {\r\n  padding: 12px 20px;\r\n  border-top: 1px solid var(--border);\r\n  background: #FAFAFA;\r\n  display: flex; align-items: center; justify-content: flex-end;\r\n  gap: 10px;\r\n}\r\n\r\n/* 官方右侧抽屉 (Drawer) */\r\n.drawer-mask {\r\n  position: fixed; inset: 0;\r\n  background: rgba(9, 9, 11, 0.35);\r\n  backdrop-filter: blur(2px);\r\n  z-index: 100;\r\n  opacity: 0; pointer-events: none;\r\n  transition: opacity 0.2s ease;\r\n}\r\n.drawer-mask.show { opacity: 1; pointer-events: auto; }\r\n.drawer-panel {\r\n  position: fixed; top: 0; bottom: 0; right: 0;\r\n  width: 560px; max-width: 90vw;\r\n  background: #FFFFFF;\r\n  border-left: 1px solid var(--border);\r\n  box-shadow: var(--shadow-lg);\r\n  z-index: 101;\r\n  display: flex; flex-direction: column;\r\n  transform: translateX(100%);\r\n  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);\r\n}\r\n.drawer-mask.show .drawer-panel { transform: translateX(0); }\r\n.drawer-header {\r\n  padding: 18px 22px;\r\n  border-bottom: 1px solid var(--border);\r\n  display: flex; align-items: center; justify-content: space-between;\r\n}\r\n.drawer-body { padding: 22px; flex: 1; overflow-y: auto; }\r\n.drawer-footer {\r\n  padding: 14px 22px;\r\n  border-top: 1px solid var(--border);\r\n  background: #FAFAFA;\r\n  display: flex; align-items: center; justify-content: flex-end;\r\n  gap: 10px;\r\n}\r\n\r\n/* 表单控件通用 */\r\n.form-group { margin-bottom: 16px; }\r\n.form-group-label {\r\n  display: block;\r\n  font-size: 12.5px;\r\n  font-weight: 500;\r\n  color: var(--foreground);\r\n  margin-bottom: 6px;\r\n}\r\n.form-group-label span.req { color: var(--destructive); margin-left: 2px; }\r\n.form-input-full {\r\n  width: 100%;\r\n  height: 36px;\r\n  border: 1px solid var(--input);\r\n  border-radius: var(--radius-md);\r\n  padding: 0 12px;\r\n  font-size: 13px;\r\n  color: var(--foreground);\r\n  background: #fff;\r\n  outline: none;\r\n  font-family: inherit;\r\n}\r\n.form-input-full:focus {\r\n  border-color: #09090B;\r\n  box-shadow: 0 0 0 1px #09090B;\r\n}\r\n.form-input-full:disabled {\r\n  background: #F4F4F5;\r\n  color: var(--muted-foreground);\r\n  cursor: not-allowed;\r\n}\r\n.form-textarea-full {\r\n  width: 100%;\r\n  min-height: 80px;\r\n  border: 1px solid var(--input);\r\n  border-radius: var(--radius-md);\r\n  padding: 8px 12px;\r\n  font-size: 13px;\r\n  color: var(--foreground);\r\n  outline: none;\r\n  font-family: inherit;\r\n  resize: vertical;\r\n}\r\n.form-textarea-full:focus {\r\n  border-color: #09090B;\r\n  box-shadow: 0 0 0 1px #09090B;\r\n}\r\n.form-hint-note { font-size: 11.5px; color: var(--muted-foreground); margin-top: 4px; }\r\n\r\n/* 单选选项卡片 */\r\n.choice-cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\r\n.choice-card-item {\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-md);\r\n  padding: 8px 12px;\r\n  height: 38px;\r\n  cursor: pointer;\r\n  background: #FAFAFA;\r\n  transition: all 0.15s ease;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n.choice-card-item:hover { border-color: #A1A1AA; }\r\n.choice-card-item.selected {\r\n  border-color: #09090B;\r\n  background: #FFFFFF;\r\n  box-shadow: 0 0 0 1px #09090B;\r\n}\r\n.choice-card-item input { accent-color: #09090B; margin: 0; }\r\n.choice-title { font-weight: 500; font-size: 13px; }\r\n\r\n/* Toast 轻提示 */\r\n#app-toast {\r\n  position: fixed;\r\n  bottom: 24px; right: 24px;\r\n  background: #09090B;\r\n  color: #FFFFFF;\r\n  padding: 10px 18px;\r\n  border-radius: var(--radius-md);\r\n  font-size: 13px;\r\n  font-weight: 500;\r\n  box-shadow: var(--shadow-lg);\r\n  display: flex; align-items: center; gap: 8px;\r\n  z-index: 200;\r\n  opacity: 0; transform: translateY(8px);\r\n  pointer-events: none;\r\n  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);\r\n}\r\n#app-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }\r\n</style>\r\n</head>\r\n<body>\r\n\r\n<div id=\"app-layout\">\r\n  <!-- 官方侧边栏 (1:1 复刻) -->\r\n  <aside id=\"app-sidebar\">\r\n    <div class=\"sidebar-brand\">\r\n      <div>\r\n        <div class=\"brand-title\">\r\n          立理 <span class=\"brand-badge\">S1</span>\r\n        </div>\r\n        <div class=\"brand-sub\">平台管理后台</div>\r\n      </div>\r\n    </div>\r\n\r\n    <div class=\"sidebar-menu-wrap\">\r\n      <div class=\"menu-group-header\">管理后台</div>\r\n      <a class=\"sidebar-menu-item\" onclick=\"navigate('applications')\" id=\"nav-applications\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"/><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"/><polyline points=\"10 9 9 9 8 9\"/></svg>\r\n        申请审核\r\n      </a>\r\n      <a class=\"sidebar-menu-item\" onclick=\"navigate('list')\" id=\"nav-list\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/></svg>\r\n        合伙人管理\r\n      </a>\r\n      <a class=\"sidebar-menu-item\" onclick=\"navigate('orders')\" id=\"nav-orders\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z\"/><path d=\"M3 6h18\"/><path d=\"M16 10a4 4 0 0 1-8 0\"/></svg>\r\n        订单管理\r\n      </a>\r\n      <a class=\"sidebar-menu-item\" onclick=\"navigate('settlements')\" id=\"nav-settlements\">\r\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"4\" widt ettle_time: '2026-09-30 11:20',\r\n    remark: '合作终止全额结清'\r\n  }\r\n];\r\n\r\n// ==========================================\r\n// 佣金明细引擎：订单 → 分期明细 → 解冻 → 结算\r\n// 月卡 1 期；年卡 12 期；机构订单按合同周期（月）分期；每期在服务月结束 +7 天解冻\r\n// ==========================================\r\nconst REF_DATE = '2026-11-06';\r\nconst LINE_SETTLED = { 'ORD-20260820-0201#1': 74.98 };      // 明细 key -> 已结算金额（该年卡第 1 期已打款）\r\nconst LINE_SETTLE_ID = { 'ORD-20260820-0201#1': 'SETTLE-202609-009' };  // 明细 key -> 最近一次结算单号\r\n\r\nfunction addMonthsDate(dateStr, m, extraDays) {\r\n  const p = dateStr.slice(0, 10).split('-');\r\n  return new Date(Date.UTC(+p[0], +p[1] - 1 + m, +p[2] + extraDays)).toISOString().slice(0, 10);\r\n}\r\nfunction orderKind(o) {\r\n  if (o.kind) return o.kind;\r\n  if (o.status === 'VOID_REFUND' || !(o.points > 0)) return 'NONE';\r\n  if (o.is_upgrade) return 'LUMP';\r\n  if (/年卡/.test(o.product)) return 'YEAR';\r\n  return 'MONTH';\r\n}\r\nfunction orderStart(o) { return o.start || (o.created_at || '').slice(0, 10); }\r\n\r\nfunction rawKind(o) {\r\n  if (o.kind) return o.kind;\r\n  if (o.is_upgrade) return 'LUMP';\r\n  if (/年卡/.test(o.product)) return 'YEAR';\r\n  return 'MONTH';\r\n}\r\nfunction orderLines(o, p) {\r\n  o._recover = 0; o._refundShort = 0;\r\n  const voided = o.status === 'VOID_REFUND';\r\n  const kind = voided ? rawKind(o) : orderKind(o);\r\n  if (kind === 'NONE') return [];\r\n  const n = kind === 'YEAR' ? 12 : (kind === 'ORG' ? o.months : 1);\r\n  const total = voided ? Math.abs(o.points) : o.points, start = orderStart(o);\r\n  const totalC = Math.round(total * 100);\r\n  const baseC = Math.round(totalC / n);\r\n  const lines = [];\r\n  for (let k = 1; k <= n; k++) {\r\n    const amt = (n === 1 ? totalC : (k < n ? baseC : totalC - baseC * (n - 1))) / 100;\r\n    const unlock = kind === 'LUMP' ? o.unfreeze_at : addMonthsDate(start, k, GLOBAL_CONFIG.unfreeze_days);\r\n    const key = o.id + '#' + k;\r\n    const settled = voided ? 0 : Math.min(LINE_SETTLED[key] || 0, n  });\r\n}\r\nfunction seqKeys(orderId, from, to) { const r = []; for (let k = from; k <= to; k++) r.push(orderId + '#' + k); return r; }\r\n\r\nallocSettled('SETTLE-202610-008', seqKeys('ORG-20260810-001', 1, 2).concat(seqKeys('ORD-20260820-0066', 1, 1)));\r\nallocSettled('SETTLE-202609-002', seqKeys('ORD-20260410-0155', 1, 5));\r\nrecalcAll();\r\n\r\nconst KIND_LABEL = { MONTH: '月卡', YEAR: '年卡', ORG: '机构订单', LUMP: '升级补差' };\r\nfunction kindBadge(k) {\r\n  const cls = k === 'ORG' ? 'badge-blue' : (k === 'YEAR' ? 'badge-success' : 'badge-neutral');\r\n  return `<span class=\"badge ${cls}\" style=\"font-size:10.5px;\">${KIND_LABEL[k] || k}</span>`;\r\n}\r\n// 套餐名：去掉数据里携带的 (首购)/(续购)/(补差价) 等括号后缀\r\nfunction productName(o) {\r\n  if (orderKind(o) === 'ORG') return '机构版年度合同';\r\n  return o.product.replace(/\\s*[（(][^）)]*[）)]\\s*/g, '').trim();\r\n}\r\n// 首购 / 续购 以该客户最早一笔订单为准\r\nfunction isFirstPurchase(o) {\r\n  if (!o.customer_phone) return false;\r\n  let first = o;\r\n  PARTNERS.forEach(p => p.orders.forEach(x => {\r\n    if (x.customer_phone !== o.customer_phone) return;\r\n    if (x.created_at < first.created_at) first = x;\r\n  }));\r\n  return first.id === o.id;\r\n}\r\nfunction productTags(o) {\r\n  if (orderKind(o) === 'ORG') return [{ t: '机构', cls: 'badge-blue' }];\r\n  if (o.is_upgrade) return [{ t: '升级补差', cls: 'badge-blue' }];\r\n  return isFirstPurchase(o) ? [{ t: '首购', cls: 'badge-blue' }] : [{ t: '续购', cls: 'badge-neutral' }];\r\n}\r\nfunction productTagHtml(o, extra) {\r\n  return productTags(o).map(x => `<span class=\"badge ${x.cls}\" style=\"font-size:10.5px;\">${x.t}</span>`).join(' ') + (extra || '');\r\n}\r\nfunction lineStateBadge(l) {\r\n  if (l.state === 'SETTLED') return '<span class=\"badge badge-neutral\">已结算</span>';\r\n  if (l.state === 'SHORT') return `<span class=\"badge badge-danger\">待追回</span>${l.short ? `<div style=\"font-size:10px; color:var(--destructive); margin-top:2px;\">¥${fmtC(l.short)}</div>` : ''}`;\r\n  if (l.state === 'UNLOCKED') return '<span class=\"badge badge-success\">可结算</span>';\r\n  if (l.state === 'FROZEN') return '<span class=\"badge badge-warning\">冻结中</span>';\r\n  if (l.state === 'REFUND') return '<span class=\"badge badge-danger\">退款扣除</span>';\r\n  return '';\r\n}\r\n\r\nfunction findOrder(orderId) {\r\n  for (const p of PARTNERS) { const o = p.orders.find(x => x.id === orderId); if (o) return { p, o }; }\r\n  return null;\r\n}\r\nfunction showOrderLines(orderId) {\r\n  const f = findOrder(orderId); if (!f) return;\r\n  const { p, o } = f;\r\n  const ls = orderLines(o, p);\r\n  const sum = st => ls.filter(l => l.state === st).reduce((a, l) => a + l.remaining, 0);\r\n  const settled = ls.reduce((a, l) => a + l.settled, 0);\r\n  const netPts = Math.max(0, o.points - (o._recover || 0));\r\n  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n  document.getElementById('drawer-root').innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-lines\" onclick=\"if(event.target===this)closeDrawer('drawer-lines')\">\r\n      <div class=\"drawer-panel\" style=\"width:680px;\">\r\n        <div class=\"drawer-header\">\r\n          <div><h3 style=\"font-size:15px; font-weight:600;\">分期明细 · ${o.id}</h3>\r\n            <div style=\"font-size:12px; color:var(--muted-foreground); margin-top:2px;\">${p.name} · ${o.kind === 'ORG' ? o.org_name : o.product} · 总佣金 ¥${fmtC(Math.abs(o.points))}</div></div>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-lines')\">✕</button>\r\n        </div>\r\n        <div class=\"drawer-body\">\r\n          <div class=\"content-card\" style=\"margin:0 0 12px; padding:12px 16px;\">\r\n            ${o.kind === 'ORG' ? `<div style=\"display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--border);\">\r\n              <span style=\"font-size:12px; color:var(--muted-foreground);\">合同编号</span><span class=\"code-badge\">${o.contract_no}</span>\r\n            </div>` : ''}\r\n            <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px;\">\r\n              <div><div style=\"font-size:11.5px; color:var(--muted-foreground);\">订单金额</div><strong class=\"num\">¥${formatNum(o.pay_amount - refunded)}</strong>${refunded > 0 ? `<div style=\"font-size:10.5px; color:var(--muted-foreground); margin-top:2px;\">已退 ¥${formatNum(refunded)}</div>` : ''}</div>\r\n              <div><div style=\"font-size:11.5px; color:var(--muted-foreground);\">分成比例</div><div><strong class=\"num\">${o.rate}%</strong><span style=\"margin-left:6px;\">${productTagHtml(o)}</span></div></div>\r\n              <div><div style=\"font-size:11.5px; color:var(--muted-foreground);\">本单佣金${refunded > 0 ? '（退款后）' : ''}</div><div><strong class=\"num\" style=\"color:${netPts > 0 ? '#15803D' : 'var(--muted-foreground)'};\">¥${fmtC(netPts)}</strong></div></div>\r\n            </div>\r\n            ${refunded > 0 ? `<div style=\"margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--destructive);\">\r\n              <strong>${(o.refunds || []).map(r => r.date).filter(Boolean).join('、')}${(o.refunds || []).some(r => r.date) ? ' · ' : ''}${refunded >= o.pay_amount ? '已全额退款' : '部分退款'} ¥${formatNum(refunded)}</strong>\r\n            </div>` : ''}\r\n          </div>\r\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;\">\r\n            <div class=\"content-card\" style=\"margin:0; padding:10px 14px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">可结算（已解冻未结算）</div><strong class=\"num\" style=\"color:#15803D;\">¥${fmtC(sum('UNLOCKED'))}</strong></div>\r\n            <div class=\"content-card\" style=\"margin:0; padding:10px 14px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">冻结中</div><strong class=\"num\" style=\"color:#A16207;\">¥${fmtC(sum('FROZEN'))}</strong></div>\r\n            <div class=\"content-card\" style=\"margin:0; padding:10px 14px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">已结算</div><strong class=\"num\">¥${fmtC(settled)}</strong></div>\r\n          </div>\r\n          <div class=\"table-container\"><table class=\"official-table\">\r\n            <thead><tr><th>期次</th><th>服务期间</th><th>解冻日</th><th>金额</th><th>状态</th></tr></thead>\r\n            <tbody>${ls.map(l => `<tr><td>第 ${l.k}/${l.n} 期</td><td style=\"font-size:12px; color:var(--muted-foreground);\">${l.period}</td><td>${l.unlock}</td><td class=\"num\">${l.cut > 0 && l.remaining > 0 ? `¥${fmtC(l.remaining)}<div style=\"font-size:10.5px; color:var(--destructive); margin-top:2px;\">已扣 ¥${fmtC(l.cut)}</div>` : `¥${fmtC(l.amt)}`}</td><td>${lineStateBadge(l)}</td></tr>`).join('')}</tbody>\r\n          </table></div>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n}\r\n\r\n// ==========================================\r\n// 退款登记（当前无退款接口，由运营手工登记并扣回佣金）\r\n// ==========================================\r\nlet REFUND_ORDER_ID = null;\r\n\r\nfunction openRefundDrawer(orderId) {\r\n  const hit = findOrder(orderId); if (!hit) return;\r\n  const { p, o } = hit;\r\n  const kind = orderKind(o);\r\n  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n  REFUND_ORDER_ID = orderId;\r\n  document.getElementById('drawer-root').innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-refund\" onclick=\"if(event.target===this)closeDrawer('drawer-refund')\">\r\n      <div class=\"drawer-panel\" style=\"width:860px;\">\r\n        <div class=\"drawer-header\">\r\n          <div style=\"display:flex; align-items:center; gap:8px;\">\r\n            <h3 style=\"font-size:15px; font-weight:600;\">退款登记 · ${o.id}</h3>\r\n            ${kindBadge(kind)}\r\n            ${refunded > 0 ? `<span class=\"badge badge-danger\">已退 ¥${formatNum(refunded)}</span>` : ''}\r\n          </div>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-refund')\">✕</button>\r\n        </div>\r\n        <div class=\"drawer-body\">\r\n          <div style=\"background:#FAFAFA; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:12.5px; line-height:1.7; margin-bottom:14px;\">\r\n            当前无退款接口，退款需在此<strong>手工登记</strong>：按「退款后实付 × 分成比例」重算本单佣金，从<strong>最后一期往前抵扣尚未解冻的期次</strong>；已解冻或已结算、无法扣回的差额计入该合伙人<strong>待追回金额</strong>，下次打款时扣减。\r\n          </div>\r\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0 14px;\">\r\n            <div class=\"form-group\"><label class=\"form-group-label\">归属合伙人</label><div class=\"form-input-full\" style=\"background:#FAFAFA;\">${p.name} · ${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道</div></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">订单实付 / 剩余可退</label><div class=\"form-input-full num\" style=\"background:#FAFAFA;\">¥${formatNum(o.pay_amount)} / ¥${formatNum(o.pay_amount - refunded)}</div></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">本次退款金额（元）<span class=\"req\">*</span></label><input class=\"form-input-full num\" type=\"number\" id=\"rf-amount\" min=\"0\" max=\"${o.pay_amount - refunded}\" placeholder=\"如 ${formatNum(o.pay_amount - refunded)}\" oninput=\"refreshRefundPreview()\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">退款日期 <span class=\"req\">*</span></label><input class=\"form-input-full\" type=\"date\" id=\"rf-date\" value=\"${REF_DATE}\" max=\"${REF_DATE}\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">退款凭证号</label><input class=\"form-input-full\" id=\"rf-voucher\" placeholder=\"财务退款流水号 / 商户退款单号（选填）\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">退款原因 <span class=\"req\">*</span></label><input class=\"form-input-full\" id=\"rf-reason\" placeholder=\"如：客户申请退费、机构合同变更\"></div>\r\n          </div>\r\n          <div id=\"rf-preview\"></div>\r\n          ${refunded > 0 ? `<div style=\"margin-top:14px; font-size:12.5px; color:var(--muted-foreground);\">历史退款登记：${(o.refunds || []).map(r => `${r.date} · ¥${formatNum(r.amount)}${r.voucher ? ' · 凭证 ' + r.voucher : ''}`).join('；')}</div>` : ''}\r\n        </div>\r\n        <div class=\"drawer-footer\" style=\"justify-content:space-between;\">\r\n          <div>${refunded > 0 ? `<button class=\"btn btn-outline\" onclick=\"undoRefund('${o.id}')\">撤销全部退款登记</button>` : '<span></span>'}</div>\r\n          <div style=\"display:flex; gap:10px;\">\r\n            <button class=\"btn btn-outline\" onclick=\"closeDrawer('drawer-refund')\">取消</button>\r\n            <button class=\"btn btn-primary\" style=\"background:#DC2626; border-color:#DC2626;\" onclick=\"confirmRefund()\">确认退款登记</button>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n  refreshRefundPreview();\r\n}\r\n\r\nfunction refreshRefundPreview() {\r\n  const hit = findOrder(REFUND_ORDER_ID); if (!hit) return;\r\n  const { p, o } = hit;\r\n  const box = document.getElementById('rf-preview'); if (!box) return;\r\n  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n  const amount = parseFloat(document.getElementById('rf-amount').value) || 0;\r\n  const max = o.pay_amount - refunded;\r\n  if (!(amount > 0)) { box.innerHTML = '<div style=\"margin-top:14px; font-size:12.5px; color:var(--muted-foreground);\">填写退款金额后，这里会预览佣金扣回结果。</div>'; return; }\r\n  if (amount > max) { box.innerHTML = `<div style=\"margin-top:14px; font-size:12.5px; color:#DC2626;\">退款金额不能超过剩余可退金额 ¥${formatNum(max)}。</div>`; return; }\r\n  const preview = Object.assign({}, o);\r\n  preview.refunds = (o.refunds || []).concat([{ amount }]);\r\n  const lines = orderLines(preview, p);\r\n  const cuts = lines.filter(l => l.cut > 0);\r\n  const applied = cuts.reduce((a, l) => a + l.cut, 0);\r\n  const short = preview._refundShort || 0;\r\n  box.innerHTML = `\r\n    <div style=\"margin-top:14px; background:#FFF7ED; border:1px solid #FDBA74; border-radius:8px; padding:12px 14px; font-size:12.5px; line-height:1.9;\">\r\n      应扣回佣金 <strong class=\"num\">¥${fmtC(preview._recover)}</strong>\r\n      · 可从冻结 / 可结算期次扣回 <strong class=\"num\" style=\"color:#15803D;\">¥${fmtC(applied)}</strong>\r\n      · 计入待追回 <strong class=\"num\" style=\"color:#DC2626;\">¥${fmtC(short)}</strong>\r\n      ${cuts.length ? `<div style=\"margin-top:6px; color:var(--muted-foreground);\">扣回期次：${cuts.map(l => `第 ${l.k}/${l.n} 期 −¥${fmtC(l.cut)}`).join('、')}</div>` : ''}\r\n      ${short > 0 ? '<div style=\"margin-top:6px; color:#B45309;\">该差额对应已结算打款的佣金，无法从余额抵扣，将挂入该合伙人的待追回金额，下次打款时扣减。</div>' : ''}\r\n      <div style=\"margin-top:6px; color:var(--muted-foreground);\">退款后本单佣金：¥${fmtC(Math.max(0, o.points - preview._recover))}</div>\r\n    </div>`;\r\n}\r\n\r\nfunction confirmRefund() {\r\n  const hit = findOrder(REFUND_ORDER_ID); if (!hit) return;\r\n  const { p, o } = hit;\r\n  const refunded = (o.refunds || []).reduce((a, r) => a + r.amount, 0);\r\n  const amount = parseFloat(document.getElementById('rf-amount').value) || 0;\r\n  const date = document.getElementById('rf-date').value;\r\n  const voucher = document.getElementById('rf-voucher').value.trim();\r\n  const reason = document.getElementById('rf-reason').value.trim();\r\n  if (!(amount > 0)) { toast('请填写本次退款金额'); return; }\r\n  if (amount > o.pay_amount - refunded) { toast('退款金额不能超过剩余可退金额 ¥' + formatNum(o.pay_amount - refunded)); return; }\r\n  if (!date) { toast('请选择退款日期'); return; }\r\n  if (!reason) { toast('请填写退款原因'); return; }\r\n  const beforeRecover = o._recover || 0;\r\n  if (!o.refunds) o.refunds = [];\r\n  o.refunds.push({ amount, date, voucher, reason, operator: '运营', time: nowTime() });\r\n  orderLines(o, p);\r\n  recalcPartner(p);\r\n  const delta = o._recover - beforeRecover;\r\n  const vcText = voucher ? ' · 凭证 ' + voucher : '';\r\n  const shortMsg = o._refundShort > 0 ? ' · 差额 ¥' + fmtC(o._refundShort) + ' 计入待追回' : '';\r\n  p.flow.unshift({ time: nowTime(), order_id: o.id, type: '退款扣除', points: delta > 0 ? '-¥' + fmtC(delta) : '¥0', status: `退款 ¥${formatNum(amount)}${vcText}${shortMsg}` });\r\n  p.logs.unshift({ time: nowTime(), operator: '运营', action: '手工退款登记', before: `本单佣金 ¥${fmtC(Math.max(0, o.points - beforeRecover))}`, after: `本单佣金 ¥${fmtC(Math.max(0, o.points - o._recover))}`, reason: `退款 ¥${formatNum(amount)}${vcText}，扣回 ¥${fmtC(delta)}${shortMsg}` });\r\n  recalcAll();\r\n  closeDrawer('drawer-refund');\r\n  toast(`退款登记成功：扣回佣金 ¥${fmtC(delta)}，合伙人端佣金已同步`);\r\n  renderOrdersView(document.getElementById('main-view-container'));\r\n}\r\n\r\nfunction undoRefund(orderId) {\r\n  const hit = findOrder(orderId); if (!hit) return;\r\n  const { p, o } = hit;\r\n  if (!confirm('确定撤销该订单的全部退款登记？撤销后将恢复原佣金与可结算金额。')) return;\r\n  const before = o._recover || 0;\r\n  o.refunds = [];\r\n  orderLines(o, p);\r\n  recalcPartner(p);\r\n  p.flow.unshift({ time: nowTime(), order_id: o.id, type: '退款撤销', points: before > 0 ? '+¥' + fmtC(before) : '¥0', status: '撤销退款登记，恢复原订单佣金' });\r\n  p.logs.unshift({ time: nowTime(), operator: '运营', action: '撤销退款登记', before: `本单佣金 ¥${fmtC(o.points - before)}`, after: `本单佣金 ¥${fmtC(o.points)}`, reason: '撤销手工退款登记' });\r\n  recalcAll();\r\n  closeDrawer('drawer-refund');\r\n  toast('已撤销退款登记，佣金与可结算金额已恢复');\r\n  renderOrdersView(document.getElementById('main-view-container'));\r\n}\r\n\r\n// ==========================================\r\n// 结算核对单（按明细勾选结算）\r\n// ==========================================\r\nlet SHEET = null;\r\n\r\nfunction prevMonthEnd(dateStr) {\r\n  const d = new Date(dateStr + 'T00:00:00');\r\n  d.setDate(1); d.setMonth(d.getMonth() - 1);\r\n  const y = d.getFullYear(), m = d.getMonth();\r\n  const last = new Date(y, m + 1, 0).getDate();\r\n  return `${y}-${String(m + 1).padStart(2, '0')}-${String(last).padStart(2, '0')}`;\r\n}\r\n\r\nfunction openSettleSheet(pid) {\r\n  const p = PARTNERS.find(x => x.id === pid); if (!p) return;\r\n  if (p.status === 'FROZEN') { toast('该合伙人账号已冻结，请先在合伙人档案解冻账号后再进行结算核算'); return; }\r\n  const cutoff = prevMonthEnd(REF_DATE);\r\n  const all = partnerLines(p);\r\n  const lines = all.filter(l => l.state === 'UNLOCKED' && l.unlock <= cutoff).sort((a, b) => a.order_id.localeCompare(b.order_id) || a.k - b.k);\r\n  SHEET = { pid, lines, checked: new Set(lines.map(l => l.key)) };\r\n  const autoVoucher = 'BCM' + REF_DATE.replace(/-/g, '') + Math.floor(1000 + Math.random() * 8999);\r\n  const total = lines.reduce((a, l) => a + l.remaining, 0);\r\n  const dueOffset = Math.min(p.points.unrecovered || 0, total);\r\n  document.getElementById('drawer-root').innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-settle\" onclick=\"if(event.target===this)closeDrawer('drawer-settle')\">\r\n      <div class=\"drawer-panel\" style=\"width:1020px;\">\r\n        <div class=\"drawer-header\">\r\n          <div style=\"display:flex; align-items:center; gap:8px;\">\r\n            <h3 style=\"font-size:15px; font-weight:600;\">结算核对单 · ${p.name}</h3>\r\n            ${p.channel_type === 'INTERNAL' ? '<span class=\"badge badge-blue\">内部渠道</span>' : '<span class=\"badge badge-neutral\">外部渠道</span>'}\r\n            ${p.status === 'FROZEN' ? '<span class=\"badge badge-warning\">账号已冻结</span>' : ''}\r\n          </div>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-settle')\">✕</button>\r\n        </div>\r\n        <div class=\"drawer-body\">\r\n          <div style=\"font-size:12.5px; color:var(--muted-foreground); margin-bottom:10px;\">${p.org} · ${p.phone}${p.wx ? ' · 微信 ' + p.wx : ''}</div>\r\n          ${dueOffset > 0 ? `<div style=\"background:#FEF2F2; border:1px solid #FCA5A5; border-radius:8px; padding:8px 12px; font-size:12.5px; color:#B91C1C; margin-bottom:12px;\">该合伙人存在退款待追回 <strong class=\"num\">¥${fmtC(p.points.unrecovered)}</strong>，本次结算自动扣减 <strong class=\"num\">¥${fmtC(dueOffset)}</strong>${p.points.unrecovered > total ? '，剩余 ¥' + fmtC(p.points.unrecovered - total) + ' 结转下次扣减' : ''}。</div>` : ''}\r\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;\">\r\n            <span>本期可结算范围：<strong>${cutoff}（含）</strong>之前解冻的佣金</span>\r\n            <span style=\"flex:1;\"></span>\r\n            <button class=\"btn btn-outline btn-sm\" onclick=\"sheetSelectAll(true)\">全选</button>\r\n            <button class=\"btn btn-outline btn-sm\" onclick=\"sheetSelectAll(false)\">清空</button>\r\n          </div>\r\n          <div class=\"table-container\"><table class=\"official-table\">\r\n            <thead><tr><th style=\"width:36px;\"></th><th>商品名称</th><th>订单号</th><th>客户 / 机构</th><th>期次 / 服务期间</th><th>解冻日</th><th style=\"text-align:right;\">本次可结算</th></tr></thead>\r\n            <tbody>${lines.map(l => `\r\n              <tr>\r\n                <td><input type=\"checkbox\" class=\"sheet-chk\" data-key=\"${l.key}\" data-unlock=\"${l.unlock}\" checked onchange=\"toggleSheetLine(this)\"></td>\r\n                <td>${kindBadge(l.kind)} ${l.kind === 'ORG' ? '机构版合同' : l.source}</td>\r\n                <td><span class=\"code-badge\">${l.order_id}</span></td>\r\n                <td class=\"num\">${l.customer || '-'}</td>\r\n                <td>${l.n > 1 ? '第 ' + l.k + '/' + l.n + ' 期' : '一次性'}<div style=\"font-size:11.5px; color:var(--muted-foreground);\">${l.period}</div></td>\r\n                <td>${l.unlock}</td>\r\n                <td class=\"num\" style=\"text-align:right;\"><strong>¥${fmtC(l.remaining)}</strong>${l.settled > 0 ? `<div style=\"font-size:11px; color:var(--muted-foreground);\">已结算 ¥${fmtC(l.settled)}（原 ¥${fmtC(l.amt)}）</div>` : ''}</td>\r\n              </tr>`).join('')}</tbody>\r\n          </table></div>\r\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\r\n            <div class=\"form-group\"><label class=\"form-group-label\">财务打款凭证流水单号 <span class=\"req\">*</span></label><input class=\"form-input-full num\" id=\"sheet-voucher\" value=\"${autoVoucher}\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">结算经办人</label><input class=\"form-input-full\" id=\"sheet-op\" value=\"财务王敏\"></div>\r\n          </div>\r\n          <div class=\"form-group\"><label class=\"form-group-label\">打款备注说明</label><input class=\"form-input-full\" id=\"sheet-rem\" value=\"2026年11月度推广服务费，公对私转账付清\"></div>\r\n        </div>\r\n        <div class=\"drawer-footer\" style=\"justify-content:space-between;\">\r\n          <div style=\"font-size:13px;\">本次实结 <strong id=\"sheet-total\" class=\"num\" style=\"font-size:20px; color:#15803D;\">¥${fmtC(total - dueOffset)}</strong> <span id=\"sheet-count\" style=\"color:var(--muted-foreground); font-size:12px;\">（已选 ${lines.length}/${lines.length} 条明细）</span><div id=\"sheet-offset\" style=\"font-size:11.5px; color:#B91C1C; margin-top:2px;\">${dueOffset > 0 ? `明细合计 ¥${fmtC(total)} · 扣减待追回 ¥${fmtC(dueOffset)}` : ''}</div></div>\r\n          <div style=\"display:flex; gap:10px;\">\r\n            <button class=\"btn btn-outline\" onclick=\"closeDrawer('drawer-settle')\">取消</button>\r\n            <button class=\"btn btn-primary\" onclick=\"confirmSettleSheet()\">确认结算并同步</button>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction updateSheetTotal() {\r\n  const sel = SHEET.lines.filter(l => SHEET.checked.has(l.key));\r\n  const gross = sel.reduce((a, l) => a + l.remaining, 0);\r\n  const p = PARTNERS.find(x => x.id === SHEET.pid);\r\n  const offset = p ? Math.min(p.points.unrecovered || 0, gross) : 0;\r\n  document.getElementById('sheet-total').textContent = '¥' + fmtC(gross - offset);\r\n  document.getElementById('sheet-offset').textContent = offset > 0 ? `明细合计 ¥${fmtC(gross)} · 扣减待追回 ¥${fmtC(offset)}` : '';\r\n  document.getElementById('sheet-count').textContent = `（已选 ${sel.length}/${SHEET.lines.length} 条明细）`;\r\n}\r\nfunction toggleSheetLine(el) {\r\n  if (el.checked) SHEET.checked.add(el.dataset.key); else SHEET.checked.delete(el.dataset.key);\r\n  updateSheetTotal();\r\n}\r\nfunction sheetSelectAll(on) {\r\n  document.querySelectorAll('.sheet-chk').forEach(el => {\r\n    el.checked = on;\r\n    if (on) SHEET.checked.add(el.dataset.key); else SHEET.checked.delete(el.dataset.key);\r\n  });\r\n  updateSheetTotal();\r\n}\r\nlet SETTLE_PENDING = null;\r\nfunction confirmSettleSheet() {\r\n  const p = PARTNERS.find(x => x.id === SHEET.pid); if (!p) return;\r\n  const sel = SHEET.lines.filter(l => SHEET.checked.has(l.key));\r\n  if (!sel.length) { toast('请至少勾选一条结算明细'); return; }\r\n  const voucher = document.getElementById('sheet-voucher').value.trim();\r\n  if (!voucher) { toast('请填写财务打款凭证流水号'); return; }\r\n  const op = document.getElementById('sheet-op').value.trim() || '财务';\r\n  const rem = document.getElementById('sheet-rem').value.trim();\r\n  const total = sel.reduce((a, l) => a + l.remaining, 0);\r\n  const offset = Math.min(p.points.unrecovered || 0, total);\r\n  const net = total - offset;\r\n  SETTLE_PENDING = { pid: p.id, sel, voucher, op, rem, total, offset, net };\r\n  document.getElementById('modal-root').innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-settle-confirm\">\r\n      <div class=\"modal-dialog\" style=\"width:440px;\">\r\n        <div class=\"modal-dialog-header\"><h3>确认结算 · ${p.name}</h3><button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-settle-confirm')\">✕</button></div>\r\n        <div class=\"modal-dialog-body\">\r\n          <div style=\"display:grid; gap:10px; font-size:13px;\">\r\n            <div style=\"display:flex; justify-content:space-between;\"><span style=\"color:var(--muted-foreground);\">已选结算明细</span><span>${sel.length} 条</span></div>\r\n            <div style=\"display:flex; justify-content:space-between;\"><span style=\"color:var(--muted-foreground);\">明细合计</span><span class=\"num\">¥${fmtC(total)}</span></div>\r\n            ${offset > 0 ? `<div style=\"display:flex; justify-content:space-between; color:#B91C1C;\"><span>扣减退款待追回</span><span class=\"num\">−¥${fmtC(offset)}</span></div>` : ''}\r\n            <div style=\"display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:10px;\"><span style=\"color:var(--muted-foreground);\">本次实结</span><strong class=\"num\" style=\"font-size:18px; color:#15803D;\">¥${fmtC(net)}</strong></div>\r\n          </div>\r\n          <div style=\"margin-top:12px; font-size:12px; color:var(--muted-foreground);\">确认后明细将标记为已结算，并实时同步合伙人端，可在结算历史中查看。</div>\r\n        </div>\r\n        <div class=\"modal-dialog-footer\"><button class=\"btn btn-outline\" onclick=\"closeModal('modal-settle-confirm')\">取消</button><button class=\"btn btn-primary\" onclick=\"executeSettleSheet()\">确认结算并同步</button></div>\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction executeSettleSheet() {\r\n  const d = SETTLE_PENDING; if (!d) return;\r\n  const p = PARTNERS.find(x => x.id === d.pid); if (!p) return;\r\n  closeModal('modal-settle-confirm');\r\n  SETTLE_PENDING = null;\r\n  const { sel, voucher, op, rem, total, offset, net } = d;\r\n  const before = p.points.withdrawable;\r\n  const bNo = 'SETTLE-' + REF_DATE.slice(0, 7).replace('-', '') + '-' + Math.floor(100 + Math.random() * 899);\r\n  sel.forEach(l => { LINE_SETTLED[l.key] = (LINE_SETTLED[l.key] || 0) + l.remaining; LINE_SETTLE_ID[l.key] = bNo; });\r\n  const rec = {\r\n    settle_id: bNo, partner_id: p.id, partner_name: p.name, partner_phone: p.phone, channel_type: p.channel_type,\r\n    points: net, gross: total, offset, voucher, operator: op, settle_time: nowTime(), remark: rem,\r\n    lines: sel.map(l => ({ key: l.key, order_id: l.order_id, k: l.k, n: l.n, kind: l.kind, source: l.source, amt: l.remaining, unlock: l.unlock }))\r\n  };\r\n  SETTLEMENT_HISTORY.unshift(rec);\r\n  p._offsetPaid = (p._offsetPaid || 0) + offset;\r\n  p.settlements.unshift({ batch_no: bNo, points: net, gross: total, offset, voucher, operator: op, time: rec.settle_time, remark: rem });\r\n  p.flow.unshift({ time: rec.settle_time, order_id: bNo, type: '线下结算核销', points: '-¥' + fmtC(net), status: `凭证 ${voucher} 已完成打款（${sel.length} 条明细）${offset > 0 ? ' · 扣减退款待追回 ¥' + fmtC(offset) : ''}` });\r\n  recalcPartner(p);\r\n  p.logs.unshift({ time: rec.settle_time, operator: op, action: '线下结算打款核销', before: `可结算 ¥${fmtC(before)}`, after: `可结算 ¥${fmtC(p.points.withdrawable)}`, reason: `结算 ${sel.length} 条明细合计 ¥${fmtC(total)}${offset > 0 ? '，扣减退款待追回 ¥' + fmtC(offset) : ''}，实结 ¥${fmtC(net)}，凭证 ${voucher}` });\r\n  closeDrawer('drawer-settle');\r\n  toast(`结算成功：${sel.length} 条明细，实结 ¥${fmtC(net)}${offset > 0 ? '（已扣减退款待追回 ¥' + fmtC(offset) + '）' : ''}，已同步合伙人端`);\r\n  renderSettlementsView(document.getElementById('main-view-container'));\r\n}\r\n\r\nfunction openSettleDetail(settleId) {\r\n  const s = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId); if (!s) return;\r\n  const ls = s.lines || [];\r\n  document.getElementById('drawer-root').innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-sd\" onclick=\"if(event.target===this)closeDrawer('drawer-sd')\">\r\n      <div class=\"drawer-panel\" style=\"width:680px;\">\r\n        <div class=\"drawer-header\">\r\n          <div><h3 style=\"font-size:15px; font-weight:600;\">结算明细 · ${s.settle_id}</h3>\r\n            <div style=\"font-size:12px; color:var(--muted-foreground); margin-top:2px;\">${s.partner_name} · ${s.settle_time} · 凭证 ${s.voucher}</div></div>\r\n          <button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-sd')\">✕</button>\r\n        </div>\r\n        <div class=\"drawer-body\">\r\n          <div class=\"table-container\"><table class=\"official-table\">\r\n            <thead><tr><th>来源订单</th><th>期次</th><th>解冻日</th><th style=\"text-align:right;\">结算金额</th></tr></thead>\r\n            <tbody>${ls.map(l => `<tr><td>${kindBadge(l.kind)} <span class=\"code-badge\">${l.order_id}</span><div style=\"font-size:11.5px; color:var(--muted-foreground);\">${l.source}</div></td><td>${l.n > 1 ? '第 ' + l.k + '/' + l.n + ' 期' : '一次性'}</td><td>${l.unlock}</td><td class=\"num\" style=\"text-align:right;\">¥${fmtC(l.amt)}</td></tr>`).join('')}\r\n            <tr><td colspan=\"3\" style=\"text-align:right; font-weight:600;\">合计</td><td class=\"num\" style=\"text-align:right; font-weight:700;\">¥${fmtC(s.points)}</td></tr></tbody>\r\n          </table></div>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction openEditVoucherModal(settleId) {\r\n  const s = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId); if (!s) return;\r\n  document.getElementById('modal-root').innerHTML = `\r\n    <div class=\"modal-mask show\" id=\"modal-rem\">\r\n      <div class=\"modal-dialog\">\r\n        <div class=\"modal-dialog-header\"><h3>修改打款备注 · ${s.settle_id}</h3><button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeModal('modal-rem')\">✕</button></div>\r\n        <div class=\"modal-dialog-body\">\r\n          <div class=\"form-group\"><label class=\"form-group-label\">打款备注说明</label><input class=\"form-input-full\" id=\"in-rem-edit\" value=\"${esc(s.remark)}\"></div>\r\n          <div class=\"form-hint-note\">仅可修改备注；金额、凭证号和结算明细不可修改。</div>\r\n        </div>\r\n        <div class=\"modal-dialog-footer\"><button class=\"btn btn-outline\" onclick=\"closeModal('modal-rem')\">取消</button><button class=\"btn btn-primary\" onclick=\"saveVoucherRemark('${s.settle_id}')\">保存</button></div>\r\n      </div>\r\n    </div>`;\r\n}\r\nfunction saveVoucherRemark(settleId) {\r\n  const s = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId); if (!s) return;\r\n  s.remark = document.getElementById('in-rem-edit').value.trim();\r\n  const p = PARTNERS.find(x => x.id === s.partner_id);\r\n  const r = p && p.settlements.find(x => x.batch_no === settleId); if (r) r.remark = s.remark;\r\n  closeModal('modal-rem'); toast('备注已更新');\r\n  renderSettlementsView(document.getElementById('main-view-container'));\r\n}\r\nfunction revokeSettlement(settleId) {\r\n  const s = SETTLEMENT_HISTORY.find(x => x.settle_id === settleId); if (!s) return;\r\n  if (s.imported) { toast('该结算单为机构订单录入时已发放，不支持撤销'); return; }\r\n  const p = PARTNERS.find(x => x.id === s.partner_id); if (!p) return;\r\n  const cnt = (s.lines || []).length;\r\n  if (!confirm(`确认撤销结算单 ${settleId}？\\n撤销后所选 ${cnt} 条明细将恢复为「可结算」，合伙人端同步回滚该笔已结算记录。`)) return;\r\n  const before = p.points.withdrawable;\r\n  (s.lines || []).forEach(l => {\r\n    const rest = Math.max(0, (LINE_SETTLED[l.key] || 0) - l.amt);\r\n    if (rest > 0) LINE_SETTLED[l.key] = rest;\r\n    else { delete LINE_SETTLED[l.key]; delete LINE_SETTLE_ID[l.key]; }\r\n  });\r\n  SETTLEMENT_HISTORY.splice(SETTLEMENT_HISTORY.indexOf(s), 1);\r\n  if (s.offset) p._offsetPaid = Math.max(0, (p._offsetPaid || 0) - s.offset);\r\n  p.settlements = p.settlements.filter(x => x.batch_no !== settleId);\r\n  p.flow = p.flow.filter(x => x.order_id !== settleId);\r\n  recalcPartner(p);\r\n  p.logs.unshift({ time: nowTime(), operator: s.operator || '财务', action: '撤销线下结算', before: `可结算 ¥${fmtC(before)}`, after: `可结算 ¥${fmtC(p.points.withdrawable)}`, reason: `撤销结算单 ${settleId}，恢复 ${cnt} 条明细为可结算` });\r\n  toast(`已撤销结算单 ${settleId}：${cnt} 条明细恢复为可结算，合伙人端已同步回滚`);\r\n  renderSettlementsView(document.getElementById('main-view-container'));\r\n}\r\nfunction esc(s) { return String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c])); }\r\n\r\n// ==========================================\r\n// 机构订单录入\r\n// ==========================================\r\nfunction allOrgOrders() {\r\n  const r = [];\r\n  PARTNERS.forEach(p => p.orders.forEach(o => { if (o.kind === 'ORG') r.push({ p, o, lines: orderLines(o, p) }); }));\r\n  return r.sort((a, b) => b.o.start.localeCompare(a.o.start));\r\n}\r\nfunction openOrgEntryDrawer() {\r\n  const cand = PARTNERS;\r\n  document.getElementById('drawer-root').innerHTML = `\r\n    <div class=\"drawer-mask show\" id=\"drawer-org\" onclick=\"if(event.target===this)closeDrawer('drawer-org')\">\r\n      <div class=\"drawer-panel\" style=\"width:700px;\">\r\n        <div class=\"drawer-header\"><h3 style=\"font-size:15px; font-weight:600;\">录入机构订单</h3><button class=\"btn-ghost\" style=\"padding:4px;\" onclick=\"closeDrawer('drawer-org')\">✕</button></div>\r\n        <div class=\"drawer-body\">\r\n          <div style=\"background:#FAFAFA; border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:14px;\">\r\n            机构版为线下签合同，无法在线上自动打通，由运营按合同手动录入。解冻规则与年卡一致：<strong>按合同周期逐月分期，每期在服务月结束 +7 天后解冻</strong>；与年卡不同的是，金额、比例、周期均按合同填写。\r\n          </div>\r\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0 14px;\">\r\n            <div class=\"form-group\" style=\"grid-column:1/3;\"><label class=\"form-group-label\">归属合伙人 <span class=\"req\">*</span></label>\r\n              <select class=\"form-input-full\" id=\"org-partner\" onchange=\"onOrgPartnerChange()\">${cand.map(p => `<option value=\"${p.id}\">${p.name} · ${p.org} · ${p.channel_type === 'INTERNAL' ? '内部' : '外部'}渠道（续购比例 ${p.renew_rate}%）${p.status === 'FROZEN' ? ' · 已冻结' : ''}</option>`).join('')}</select></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">机构名称 <span class=\"req\">*</span></label><input class=\"form-input-full\" id=\"org-name\" placeholder=\"如：某某大学某某实验室\" oninput=\"refreshOrgPreview()\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">合同编号 <span class=\"req\">*</span></label><input class=\"form-input-full\" id=\"org-contract\" placeholder=\"线下合同编号\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">合同金额（元）<span class=\"req\">*</span></label><input class=\"form-input-full num\" type=\"number\" id=\"org-amount\" placeholder=\"如 40000\" oninput=\"refreshOrgPreview()\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">分成比例（%）<span class=\"req\">*</span></label><input class=\"form-input-full num\" type=\"number\" step=\"1\" id=\"org-rate\" value=\"${cand[0].renew_rate}\" oninput=\"refreshOrgPreview()\"><div class=\"form-hint-note\">默认带出合伙人续购比例，可按合同调整；录入后锁定，不随后续比例调整变化。</div></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">服务起始日 <span class=\"req\">*</span></label><input class=\"form-input-full\" type=\"date\" id=\"org-start\" value=\"${REF_DATE}\" oninput=\"refreshOrgPreview()\"></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">服务周期（月）<span class=\"req\">*</span></label><input class=\"form-input-full num\" type=\"number\" id=\"org-months\" value=\"12\" min=\"1\" max=\"60\" oninput=\"refreshOrgPreview()\"><div class=\"form-hint-note\" id=\"org-end-hint\"></div></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">已发放金额（元）</label><input class=\"form-input-full num\" type=\"number\" id=\"org-paid\" value=\"0\" min=\"0\" oninput=\"refreshOrgPreview()\"><div class=\"form-hint-note\">录入前已线下发给合伙人的佣金，系统按期次从前往后抵扣，并生成一条「录入时已发放」结算记录。</div></div>\r\n            <div class=\"form-group\"><label class=\"form-group-label\">备注</label><input class=\"form-input-full\" id=\"org-remark\" placeholder=\"选填\"></div>\r\n          </div>\r\n          <div id=\"org-preview\"></div>\r\n        </div>\r\n        <div class=\"drawer-footer\">\r\n          <button class=\"btn btn-outline\" onclick=\"closeDrawer('drawer-org')\">取消</button>\r\n          <button class=\"btn btn-primary\" onclick=\"confirmOrgEntry()\">确认录入</button>\r\n        </div>\r\n      </div>\r\n    </div>`;\r\n  refreshOrgPreview();\r\n}\r\nfunction onOrgPartnerChange() {\r\n  const p = PARTNERS.find(x => x.id === document.getElementById('org-partner').value);\r\n  if (p) document.getElementById('org-rate').value = p.renew_rate;\r\n  refreshOrgPreview();\r\n}\r\nfunction readOrgForm() {\r\n  const g = id => document.getElementById(id).value;\r\n  return { pid: g('org-partner'), name: g('org-name').trim(), contract: g('org-contract').trim(), amount: parseFloat(g('org-amount')),\r\n    rate: parseFloat(g('org-rate')), start: g('org-start'), months: parseInt(g('org-months'), 10), paid: parseFloat(g('org-paid')) || 0, remark: g('org-remark').trim() };\r\n}\r\nfunction computeOrgPreview(f) {\r\n  const res = { ok: false, msg: '', lines: [], total: 0, alloc: [] };\r\n  if (!(f.amount > 0) || isNaN(f.rate) || f.rate < 0 || f.rate > 100 || !f.start || !(f.months >= 1 && f.months <= 60)) { res.msg = '填写合同金额、分成比例、服务起始日和周期后，这里会预览分期明细'; return res; }\r\n  const total = round2(f.amount * f.rate / 100);\r\n  const n = f.months;\r\n  const totalC = Math.round(total * 100), baseC = Math.round(totalC / n);\r\n  res.total = total;\r\n  let left = f.paid, unlockedSum = 0;\r\n  for (let k = 1; k <= n; k++) {\r\n    const amt = (k < n ? baseC : totalC - baseC * (n - 1)) / 100;\r\n    const unlock = addMonthsDate(f.start, k, GLOBAL_CONFIG.unfreeze_days);\r\n    const done = unlock <= REF_DATE;\r\n    if (done) unlockedSum += amt;\r\n    let a = 0;\r\n    if (left > 0) { a = Math.min(left, amt); left -= a; }\r\n    res.lines.push({ k, n, amt, unlock, done, alloc: a, period: addMonthsDate(f.start, k - 1, 0) + ' ~ ' + addMonthsDate(f.start, k, -1) });\r\n  }\r\n  res.unlockedSum = unlockedSum;\r\n  if (f.paid > total) res.msg = `已发放金额不能超过应分佣金总额 ¥${fmtC(total)}`;\r\n  else if (f.paid > unlockedSum) res.msg = `已发放金额不能超过截至今日已解冻金额 ¥${fmtC(unlockedSum)}`;\r\n  else res.ok = true;\r\n  return res;\r\n}\r\nfunction refreshOrgPreview() {\r\n  const f = readOrgForm();\r\n  const el = document.getElementById('org-preview'); if (!el) return;\r\n  const end = (f.start && f.months >= 1) ? addMonthsDate(f.start, f.months, -1) : '';\r\n  const hint = document.getElementById('org-end-hint'); if (hint) hint.textContent = end ? `服务期间：${f.start} ~ ${end}` : '';\r\n  const r = computeOrgPreview(f);\r\n  if (!r.lines.length) { el.innerHTML = `<div style=\"font-size:12.5px; color:var(--muted-foreground); border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center;\">${r.msg}</div>`; return; }\r\n  const unlockedUnsettled = r.unlockedSum - Math.min(f.paid, r.unlockedSum);\r\n  const frozen = r.total - r.unlockedSum;\r\n  el.innerHTML = `\r\n    <div style=\"font-size:13px; font-weight:600; margin:4px 0 8px;\">分期预览</div>\r\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;\">\r\n      <div class=\"content-card\" style=\"margin:0; padding:10px 12px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">应分佣金总额</div><strong class=\"num\">¥${fmtC(r.total)}</strong></div>\r\n      <div class=\"content-card\" style=\"margin:0; padding:10px 12px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">已发放</div><strong class=\"num\">¥${fmtC(Math.min(f.paid, r.total))}</strong></div>\r\n      <div class=\"content-card\" style=\"margin:0; padding:10px 12px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">可结算（已解冻未结算）</div><strong class=\"num\" style=\"color:#15803D;\">¥${fmtC(Math.max(unlockedUnsettled, 0))}</strong></div>\r\n      <div class=\"content-card\" style=\"margin:0; padding:10px 12px;\"><div style=\"font-size:11.5px; color:var(--muted-foreground);\">冻结中</div><strong class=\"num\" style=\"color:#A16207;\">¥${fmtC(frozen)}</strong></div>\r\n    </div>\r\n    ${r.msg && !r.ok ? `<div style=\"background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C; border-radius:8px; padding:8px 12px; font-size:12.5px; margin-bottom:10px;\">${r.msg}</div>` : ''}\r\n    <div class=\"table-container\" style=\"max-height:260px; overflow-y:auto;\"><table class=\"official-table\">\r\n      <thead><tr><th>期次</th><th>服务期间</th><th>解冻日</th><th style=\"text-align:right;\">金额</th><th>状态</th></tr></thead>\r\n      <tbody>${r.lines.map(l => `<tr><td>第 ${l.k}/${l.n} 期</td><td style=\"font-size:12px; color:var(--muted-foreground);\">${l.period}</td><td>${l.unlock}</td><td class=\"num\" style=\"text-align:right;\">¥${fmtC(l.amt)}</td><td>${\r\n        l.alloc >= l.amt ? '<span class=\"badge badge-neutral\">已发放</span>' : (l.alloc > 0 ? `<span class=\"badge badge-neutral\">已发放 ¥${fmtC(l.alloc)}，剩余 ¥${fmtC(l.amt - l.alloc)}</span>` : (l.done ? '<span class=\"badge badge-success\">可结算</span>' : '<span class=\"badge badge-warning\">冻结中</span>'))}</td></tr>`).join('')}</tbody>\r\n    </table></div>`;\r\n}\r\nfunction confirmOrgEntry() {\r\n  const f = readOrgForm();\r\n  const p = PARTNERS.find(x => x.id === f.pid);\r\n  if (!p) { toast('请选择归属合伙人'); return; }\r\n  if (!f.name) { toast('请填写机构名称'); return; }\r\n  if (!f.contract) { toast('请填写合同编号'); return; }\r\n  if (allOrgOrders().some(x => x.o.contract_no === f.contract)) { toast('该合同编号已录入，请勿重复'); return; }\r\n  const r = computeOrgPreview(f);\r\n  if (!r.lines.length) { toast('请完整填写合同金额、比例、起始日和周期'); return; }\r\n  if (!r.ok) { toast(r.msg); return; }\r\n  const seq = allOrgOrders().length + 1;\r\n  const id = 'ORG-' + f.start.replace(/-/g, '') + '-' + String(seq).padStart(3, '0');\r\n  const now = nowTime();\r\n  p.orders.unshift({ id, customer_phone: '', org_name: f.name, contract_no: f.contract, kind: 'ORG', product: '机构版年度合同（线下签约）',\r\n    pay_amount: f.amount, rate: f.rate, points: r.total, status: 'ORG', unfreeze_at: '按月分期', created_at: now, start: f.start, months: f.months,\r\n    paid_out: f.paid, remark: f.remark, is_upgrade: false, is_cool: false });\r\n  p.flow.unshift({ time: now, order_id: id, type: '机构订单录入', points: '+¥' + fmtC(r.total), status: `合同 ${f.contract}，${f.months} 期分期解冻` });\r\n  p.logs.unshift({ time: now, operator: '张博文', action: '录入机构订单', before: '-', after: `${f.name} · ¥${formatNum(f.amount)} × ${f.rate}%`, reason: `应分佣金 ¥${fmtC(r.total)}，周期 ${f.months} 个月，已发放 ¥${fmtC(f.paid)}` });\r\n  if (f.paid > 0) {\r\n    const sid = 'IMPORT-' + REF_DATE.slice(0, 7).replace('-', '') + '-' + Math.floor(100 + Math.random() * 899);\r\n    const lines = [];\r\n    r.lines.forEach(l => { if (l.alloc > 0) { const key = id + '#' + l.k; LINE_SETTLED[key] = l.alloc; LINE_SETTLE_ID[key] = sid; lines.push({ key, order_id: id, k: l.k, n: l.n, kind: 'ORG', source: f.name, amt: l.alloc, unlock: l.unlock }); } });\r\n    SETTLEMENT_HISTORY.unshift({ settle_id: sid, partner_id: p.id, partner_name: p.name, partner_phone: p.phone, channel_type: p.channel_type, points: f.paid,\r\n      voucher: '录入时登记', operator: '张博文', settle_time: now, remark: `机构订单录入时登记的已发放金额（合同 ${f.contract}）`, lines, imported: true });\r\n    p.settlements.unshift({ batch_no: sid, points: f.paid, voucher: '录入时登记', operator: '张博文', time: now, remark: `机构订单录入时登记的已发放金额（合同 ${f.contract}）` });\r\n  }\r\n  recalcAll();\r\n  closeDrawer('drawer-org');\r\n  toast(`机构订单已录入：应分佣金 ¥${fmtC(r.total)}，共 ${f.months} 期`);\r\n  orderSubTab = 'org';\r\n  if (currentRoute === 'orders') renderOrdersView(document.getElementById('main-view-container'));\r\n  else navigate('orders');\r\n}\r\n\r\n// ==========================================\r\n// 路由控制器 (Router)\r\n// ==========================================\r\nlet currentRoute = 'applications';\r\nlet routeParams = {};\r\n\r\nfunction initRouter() {\r\n  window.addEventListener('hashchange', parseRoute);\r\n  parseRoute();\r\n}\r\n\r\nfunction parseRoute() {\r\n  const hash = location.hash.replace(/^#/, '') || 'applications';\r\n  const parts = hash.split('/');\r\n  currentRoute = parts[0];\r\n  if (parts[0] === 'partner' && parts[1]) {\r\n    routeParams = { partnerId: parts[1], tab: parts[2] || 'orders' };\r\n  } else {\r\n    routeParams = {};\r\n  }\r\n  updateSidebarMenu();\r\n  renderActiveView();\r\n}\r\n\r\nfunction navigate(path) {\r\n  location.hash = path;\r\n}\r\n\r\nfunction updateSidebarMenu() {\r\n  document.querySelectorAll('.sidebar-menu-item').forEach(el => el.classList.remove('active'));\r\n  const activeItem = document.getElementById('nav-' + currentRoute);\r\n  if (activeItem) activeItem.classList.add('active');\r\n}\r\n\r\n// 通用列表翻页器\r\nlet pageState = {};\r\nfunction pageMeta(key, total) {\r\n  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });\r\n  const pages = Math.max(1, Math.ceil(total / st.size));\r\n  if (st.page > pages) st.page = pages;\r\n  return { st, pages, start: (st.page - 1) * st.size };\r\n}\r\nfunction pagedList(key, arr) {\r\n  const m = pageMeta(key, arr.length);\r\n  return arr.slice(m.start, m.start + m.st.size);\r\n}\r\nfunction resetPage(key) {\r\n  if (pageState[key]) pageState[key].page = 1;\r\n}\r\nfunction goPage(key, page) {\r\n  const st = pageState[key] || (pageState[key] = { page: 1, size: 20 });\r\n  st.page = Math.max(1, page);\r\n  renderActiveView();\r\n}\r\nfunction setPageSize(key, size) {\r\n  pageState[key] = { page: 1, size: parseInt(size, 10) || 20 };\r\n  renderActiveView();\r\n}\r\nfunction pagerBar(key, total) {\r\n  const { st, pages } = pageMeta(key, total);\r\n  return `\r\n    <div class=\"table-pager\">\r\n      <div class=\"pager-total\">共 ${total} 条 · 第 ${st.page}/${pages} 页</div>\r\n      <div class=\"pager-actions\">\r\n        <select class=\"input-control pager-size\" onchange=\"setPageSize('${key}', this.value)\">\r\n          <option value=\"20\" ${st.size === 20 ? 'selected' : ''}>20 条/页</option>\r\n          <option value=\"50\" ${st.size === 50 ? 'selected' : ''}>50 条/页</option>\r\n        </select>\r\n        <button class=\"pager-arrow\" ${st.page <= 1 ? 'disabled' : ''} onclick=\"goPage('${key}', ${st.page - 1})\">‹ 上一页</button>\r\n        <button class=\"pager-arrow\" ${st.page >= pages ? 'disabled' : ''} onclick=\"goPage('${key}', ${st.page + 1})\">下一页 ›</button>\r\n      </div>\r\n    </div>`;\r\n}\r\n\r\nfunction renderActiveView() {\r\n  const container = document.getElementById('main-view-container');\r\n  if (currentRoute === 'applications') renderApplicationsView(container);\r\n  else if (currentRoute === 'list') renderPartnerListView(container);\r\n  else if (currentRoute === 'partner') {\r\n    const p = PARTNERS.find(item => item.id === routeParams.partnerId) || PARTNERS[0];\r\n    renderPartnerDetailView(container, p, routeParams.tab);\r\n  } else if (currentRoute === 'orders') renderOrdersView(container);\r\n  else if (currentRoute === 'settlements') renderSettlementsView(container);\r\n  else if (currentRoute === 'reports') renderReportsView(container);\r\n  else if (currentRoute === 'settings') renderSettingsView(container);\r\n}\r\n\r\n// ==========================================\r\n// 1. 页面：申请审核 (APPLICATIONS)\r\n// ==========================================\r\nlet appStatusTab = 'PENDING';\r\nlet appKw = '';\r\nlet appFrom = '';\r\nlet appTo = '';\r\nlet appPickerOpen = false;\r\nlet appTmpFrom = '';\r\nlet appTmpTo = '';\r\nlet appCalMonth = '2026-11';\r\n\r\nfunction renderApplicationsView(container) {\r\n  let filtered = APPLICATIONS.filter(a => {\r\n    if (appStatusTab !== 'ALL' && a.status !== appStatusTab) return false;\r\n    const applyDate = a.apply_time.slice(0, 10);\r\n    if (appFrom && applyDate < appFrom) return false;\r\n    if (appTo && applyDate > appTo) return false;\r\n    if (appKw) {\r\n      const kw = appKw.toLowerCase();\r\n      return a.name.toLowerCase().includes(kw) || a.phone.includes(kw) || a.org.toLowerCase().includes(kw);\r\n    }\r\n    return true;\r\n  });\r\n\r\n  const showTimeCol = appStatusTab === 'APPROVED' || appStatusTab === 'REJECTED';\r\n  const timeColLabel = appStatusTab === 'APPROVED' ? '入驻时间' : '拒绝时间';\r\n  const showOperatorCol = appStatusTab !== 'PENDING';\r\n  const colCount = 7 + (showTimeCol ? 1 : 0) + (showOperatorCol ? 1 : 0);\r\n  const pagedRows = pagedList('apps', filtered);\r\n\r\n  container.innerHTML = `\r\n    <!-- 页面标题区 (1:1 官方规范) -->\r\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;\">\r\n      <div>\r\n        <h1 style=\"font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;\">申请审核</h1>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 筛选卡片 (1:1 官方筛选用户样式) -->\r\n    <div class=\"filter-card\">\r\n      <div class=\"filter-title-row\">\r\n        <span class=\"filter-title\">筛选申请</span>\r\n        <button class=\"btn btn-outline btn-sm\" onclick=\"appKw=''; renderApplicationsView(document.getElementById('main-view-container'))\">\r\n          <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3\"/></svg>\r\n          重置\r\n        </button>\r\n      </div>\r\n      <div class=\"filter-inputs-grid\">\r\n        <div class=\"filter-field\" style=\"flex: 2; min-width: 260px;\">\r\n          <span class=\"field-label\">关键词</span>\r\n          <input class=\"input-control\" type=\"text\" placeholder=\"申请 ID、姓名、完整手机号、机构单位\" value=\"${appKw}\" oninput=\"appKw=this.value; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n        </div>\r\n        <div class=\"filter-field\" style=\"flex: 1;\">\r\n          <span class=\"field-label\">审核状态</span>\r\n          <select class=\"input-control\" onchange=\"appStatusTab=this.value; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n            <option value=\"PENDING\" ${appStatusTab==='PENDING'?'selected':''}>待审核 (默认)</option>\r\n            <option value=\"APPROVED\" ${appStatusTab==='APPROVED'?'selected':''}>已通过</option>\r\n            <option value=\"REJECTED\" ${appStatusTab==='REJECTED'?'selected':''}>已拒绝</option>\r\n            <option value=\"ALL\" ${appStatusTab==='ALL'?'selected':''}>全部状态</option>\r\n          </select>\r\n        </div>\r\n        <div class=\"filter-field\" style=\"flex: 1; min-width: 230px; position: relative;\">\r\n          <span class=\"field-label\">申请时间</span>\r\n          <button type=\"button\" class=\"input-control date-range-trigger\" onclick=\"toggleAppDatePicker()\">\r\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color: var(--muted-foreground); flex-shrink:0;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"></rect><path d=\"M16 2v4\"></path><path d=\"M8 2v4\"></path><path d=\"M3 10h18\"></path></svg>\r\n            <span style=\"flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; ${appFrom || appTo ? '' : 'color: var(--muted-foreground);'}\">\r\n              ${appFrom || appTo ? `${appFrom || '不限'} — ${appTo || '不限'}` : '选择日期区间'}\r\n            </span>\r\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color: var(--muted-foreground); flex-shrink:0;\"><path d=\"m6 9 6 6 6-6\"></path></svg>\r\n          </button>\r\n          ${appPickerOpen ? dateRangePickerHtml() : ''}\r\n        </div>\r\n      </div>\r\n    </div>\r\n\r\n    <!-- 分段标签页 (Segmented Controls) -->\r\n    <div class=\"segmented-tabs\">\r\n      <button class=\"seg-tab-btn ${appStatusTab==='PENDING'?'active':''}\" onclick=\"appStatusTab='PENDING'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n        待审核\r\n      </button>\r\n      <button class=\"seg-tab-btn ${appStatusTab==='APPROVED'?'active':''}\" onclick=\"appStatusTab='APPROVED'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n        已通过\r\n      </button>\r\n      <button class=\"seg-tab-btn ${appStatusTab==='REJECTED'?'active':''}\" onclick=\"appStatusTab='REJECTED'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n        已拒绝\r\n      </button>\r\n      <button class=\"seg-tab-btn ${appStatusTab==='ALL'?'active':''}\" onclick=\"appStatusTab='ALL'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))\">\r\n        全部申请\r\n      </button>\r\n    </div>\r\n\r\n    <!-- 数据表格卡片 (1:1 官方表格规范) -->\r\n    <div class=\"table-container\">\r\n      <table class=\"official-table\">\r\n        <thead>\r\n          <tr>\r\n            <th>申请人</th>\r\n            <th>手机号</th>\r\n            <th>所属单位 / 学术机构</th>\r\n            <th>微信号</th>\r\n            <th>申请时间</th>\r\n            ${showTimeCol ? `<th>${timeColLabel}</th>` : ''}\r\n            <th>审核状态</th>\r\n            ${showOperatorCol ? '<th>操作人</th>' : ''}\r\n            <th class=\"col-sticky\" style=\"text-align: right;\">操作</th>\r\n          </tr>\r\n        </thead>\r\n        <tbody>\r\n          ${filtered.length === 0 ? `\r\n            <tr><td colspan=\"${colCount}\" style=\"text-align:center; padding:48px; color:var(--muted-foreground);\">暂无符合筛选条件的申请记录</td></tr>\r\n          ` : pagedRows.map(item => `\r\n            <tr>\r\n              <td style=\"font-weight: 600;\">${item.name}</td>\r\n              <td class=\"num font-semibold\" style=\"color: var(--foreground);\">${item.phone}</td>\r\n              <td>\r\n                <div style=\"max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">\r\n                  ${item.org}\r\n                </div>\r\n              </td>\r\n              <td style=\"color: var(--muted-foreground);\">${item.wx || '-'}</td>\r\n              <td style=\"color: var(--muted-foreground); font-size: 12px;\">${item.apply_time}</td>\r\n              ${showTimeCol ? `<td style=\"color: var(--muted-foreground); font-size: 12px;\">${(appStatusTab === 'APPROVED' ? item.approve_time : item.reject_time) || '-'}</td>` : ''}\r\n              <td>\r\n                ${item.status === 'PENDING' ? '<span class=\"badge badge-warning\">待审核</span>' : ''}\r\n                ${item.status === 'APPROVED' ? '<span class=\"badge badge-success
