function renderIcons() {
  if (window.lucide && typeof lucide.createIcons === 'function') {
    try { lucide.createIcons(); return; } catch(e) {}
  }
  var els = document.querySelectorAll('[data-lucide]');
  els.forEach(function(el) {
    var name = el.getAttribute('data-lucide');
    var path = ICON_PATHS[name] || '';
    if (!path) return;
    var cls = el.getAttribute('class') || '';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('class', cls);
    svg.innerHTML = path;
    el.parentNode.replaceChild(svg, el);
  });
}

  if (typeof force === 'boolean') {

  } else {
    demoToolkitOpen = !demoToolkitOpen;
  }
  var panel = $('demo-toolkit-panel');
  var btn = $('demo-toolkit-btn');
  if (panel && btn) {
    if (demoToolkitOpen) {
      panel.style.display = 'block';
      btn.style.display = 'none';
    } else {
      panel.style.display = 'none';
      btn.style.display = 'flex';
    }
  }
}

function demoSwitchAccount(phone) {
  var st = PHONES[phone];
  if (!st) return;

  if (st === 'FROZEN') {
    toast('账号 ' + phone + ' 权限已被冻结（演示用例）');
    return;
  }

  // 设置当前登录用户
  S.user = { phone: phone, st: st };
  
  // 若在登录页，同步回填表单
  var pInput = $('l_phone'); if (pInput) pInput.value = phone;
  var pwdInput = $('l_pwd'); if (pwdInput) pwdInput.value = 'Test1234';
  var codeInput = $('l_code'); if (codeInput) codeInput.value = '888888';

  toast('已切换为账号 ' + phone + ' (' + (st === 'APPROVED' ? '已通过' : st === 'PENDING' ? '审核中' : '已拒绝') + ')');
  
  if (st === 'APPROVED') {
    go('promotion');
  } else {
    go('status');
  }
}

function demoFillOps() {
  S.lmode = 'pwd'; S.user = null;

function fmt(n) { return Number(n).toLocaleString('en-US'); }
function fmt2(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function addMonthsDate(dateStr, m, extraDays) {
  var p = dateStr.slice(0, 10).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1 + m, +p[2] + extraDays)).toISOString().slice(0, 10);
}

// 以订单为维度核算：月卡/加油包一期，年卡 12 期，机构订单按服务周期分期；每期在服务月结束 + 7 天后解冻
// 退款扣回顺序：先扣退款时尚未解冻的期次（从最后一期往前），再扣已解冻但未结算的期次；已结算打款部分计入待追回
function calcOrder(o) {
  var pts = function(amt) { return round2(amt * o.rate / 100); };
  var total0 = pts(o.paid), eff = pts(o.paid - o.refund), deduct = round2(total0 - eff);
  var n = o.kind === 'year' ? 12 : (o.kind === 'org' ? (o.months || 12) : 1), ins = [], k;
  var base = n === 1 ? total0 : round2(total0 / n);
  for (k = 1; k <= n; k++) {
    var amt = n === 1 ? total0 : (k < n ? base : round2(total0 - base * (n - 1)));
    var ud = addMonthsDate(o.time, k, 7);
    ins.push({ k: k, orig: amt, amt: amt, unlock: ud, done: ud <= REF_DATE, sAmt: 0, recoup: 0 });
  }
  // 已结算与录入时已发放金额，均按解冻日从早到晚依次核销到期次
  var leftS = round2((o.settled || 0) + (o.prepaid || 0));
  for (k = 0; k < n && leftS > 0; k++) {
    if (ins[k].done) {
      var sa = Math.min(leftS, ins[k].amt);
      ins[k].sAmt = round2(sa);
      leftS = round2(leftS - sa);
    }
  }
  var left = deduct;
  // 第一轮：退款时尚未解冻的期次
  for (var j = n - 1; j >= 0 && left > 0; j--) {
    if (ins[j].unlock > (o.refundAt || '')) {
      var cut = Math.min(left, ins[j].amt);
      ins[j].amt = round2(ins[j].amt - cut);
      left = round2(left - cut);
    }
  }
  // 第二轮：已解冻但尚未结算的期次
  for (j = n - 1; j >= 0 && left > 0; j--) {
    if (ins[j].unlock <= (o.refundAt || '')) {
      var avail = round2(ins[j].amt - ins[j].sAmt);
      if (avail > 0) {
        var cut2 = Math.min(left, avail);
        ins[j].amt = round2(ins[j].amt - cut2);
        left = round2(left - cut2);
      }
    }
  }
  // 仍无法扣回的部分，从最近已结算期次往前标记「待追回」
  var leftT = left;
  for (var t = n - 1; t >= 0 && leftT > 0; t--) {
    if (ins[t].sAmt > 0) {
      var rc = Math.min(leftT, ins[t].sAmt);
      ins[t].recoup = round2(rc);
      leftT = round2(leftT - rc);
    }
  }
  var unlocked = 0, frozen = 0, doneCnt = 0, settled = 0, remain = 0;
  ins.forEach(function(x) {
    if (x.done) { unlocked = round2(unlocked + x.amt); if (x.amt > 0) doneCnt++; }
    else frozen = round2(frozen + x.amt);
    settled = round2(settled + x.sAmt);
    remain = round2(remain + x.amt);
  });
  var cutTotal = round2(total0 - remain);
  return { o: o, total0: total0, eff: eff, deduct: deduct, cut: cutTotal, short: left, ins: ins,
           unlocked: unlocked, settled: settled, settleable: round2(unlocked - settled),
           frozen: frozen, doneCnt: doneCnt, n: n,
           full: o.refund >= o.paid, part: o.refund > 0 && o.refund < o.paid };
}

function getSum() {
  var u = 0, f = 0, st = 0, shortTotal = 0, offset = 0;
  ORDERS.forEach(function(o) { var c = calcOrder(o); u += c.unlocked; f += c.frozen; st += c.settled; shortTotal += c.short; });
  SETTLE.forEach(function(r) { offset += (r.offset || 0); });
  u = round2(u); f = round2(f); st = round2(st); shortTotal = round2(shortTotal);
  var unrecovered = Math.max(0, round2(shortTotal - offset));
  return { total: Math.max(0, round2(u + f - shortTotal)), settleable: round2(u - st), frozen: f, settled: st, unrecovered: unrecovered,
           payable: Math.max(0, round2(u - st - unrecovered)) };
}

function doLogin() {
  var p = $('l_phone').value.trim(), c = $('l_code').value.trim();
  if (isOpsAccount(p)) {
    S.lmode = 'pwd'; pLogin();
    toast('运营账号不支持验证码登录，请使用账号登录');
    return;
  }
  if (!phoneOk(p)) { err('e_lp', '请输入有效的 11 位手机号'); return; }
  err('e_lp', '');
  if (!/^\d{6}$/.test(c)) { err('e_lc', '请输入 6 位数字验证码'); return; }
  err('e_lc', '');
  finishLogin(p);
}

function isOpsAccount(v) { return /^[A-Za-z]/.test(v); }

function doPwdLogin() {
  var id = $('l_phone').value.trim(), w = $('l_pwd').value;
  if (!id) { err('e_lp', '请输入手机号或运营账号'); return; }
  if (isOpsAccount(id)) {
    if (!/^[A-Za-z][A-Za-z0-9_]{3,19}$/.test(id)) { err('e_lp', '运营账号为字母开头，4-20 位字母、数字或下划线'); return; }
  } else if (!phoneOk(id)) { err('e_lp', '请输入有效的 11 位手机号或运营账号'); return; }
  err('e_lp', '');
  if (!w) { err('e_lc', '请输入登录密码'); return; }
  err('e_lc', '');
  if (isOpsAccount(id)) {
    var o = OPS[id];
    if (!o || o.pwd !== w) { err('e_lc', '账号或密码错误'); return; }
    loginOps(id, o);
    return;
  }
  if (!PHONES[id]) return finishLogin(id);
  if (!PWD[id]) { err('e_lc', '该账号尚未设置密码，请通过“忘记密码”重设密码或使用验证码登录'); return; }
  if (PWD[id] !== w) { err('e_lc', '账号或密码错误'); return; }
  finishLogin(id);
}

function loginOps(id, o) {
  S.user = { account: id, ops: true, name: o.name, role: o.role };
  toast('登录成功，正在进入运营工作台...');
  setTimeout(function(){ window.location.href = encodeURI('立理 S1 运营后台 Demo.html'); }, 700);
}

function forgotEntry() {
  var v = $('l_phone') ? $('l_phone').value.trim() : '';
  if (isOpsAccount(v)) { toast('运营账号请联系超级管理员重置密码'); return; }
  go('forgot');
}

function finishLogin(p) {
  var st = PHONES[p];
  if (!st) {
    showUnappliedModal(p);
    return;
  }
  if (st === 'FROZEN') {
    err('e_lc', '您的合伙人合作权限已被暂停，如有疑问请联系官方客服人员');
    toast('账号权限已被冻结');
    return;
  }
  S.user = { phone: p, st: st };
  toast('登录成功！正在进入合伙人中心...');
  go(st === 'APPROVED' ? 'promotion' : 'status');
}

function submitApply() {
  var ok = true, v = function(id){ return ($(id).value || '').trim(); };
  function chk(cond, errId, msg) { if (cond) { err(errId, ''); } else { err(errId, msg); ok = false; } }
  chk(v('a_name').length >= 2 && v('a_name').length <= 20, 'e_name', '请输入 2–20 个字符的真实姓名');
  chk(v('a_org').length >= 2 && v('a_org').length <= 50, 'e_org', '请输入 2–50 个字符的所属单位');
  chk(phoneOk(v('a_phone')), 'e_phone', '请输入有效的 11 位大陆手机号码');
  chk(/^\d{6}$/.test(v('a_code')), 'e_code', '请输入 6 位数字验证码');
  chk(pwdOk($('a_pwd').value), 'e_pwd', '密码需 8–20 位，且包含英文字母与数字组合');
  chk(!v('a_wx') || /^[A-Za-z0-9_-]{6,30}$/.test(v('a_wx')), 'e_wx', '微信号 6–30 位，仅限字母数字下划线减号');

  if (!ok) return;

  var phone = v('a_phone');
  if (PHONES[phone]) {
    err('e_phone', '该手机号已有申请记录，请登录查看状态');
    toast('该手机号已有申请记录');
    return;
  }

  APP[phone] = { name: v('a_name'), org: v('a_org'), wx: v('a_wx'), time: nowStr() };
  PHONES[phone] = 'PENDING';
  PWD[phone] = $('a_pwd').value;
  S.done = true;
  toast('申请提交成功！');
  pApply();
}

    var matchStatus = (S.filter === 'all' || c[3] === S.filter);

      var cStr = (c[0] + ' ' + (c[5]||'') + ' ' + (c[6]||'')).toLowerCase();
      matchQuery = cStr.indexOf(q) >= 0;
    }
    return matchStatus && matchTag && matchQuery;
  });

  list.sort(function(a, b) {
    var x = a[k], y = b[k];
    if (!x && !y) return 0;
    if (!x) return 1;
    if (!y) return -1;

          '<i data-lucide="pencil" class="w-3 h-3 text-slate-muted group-hover:text-brand-500 opacity-60"></i>',
        '</div>'
      ].join('');

    var tagHtml = [
      '<button type="button" onclick="openTag(' + originalIndex + ')" class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs transition-all ' + tagBadge(c[6]) + '">',
        '<span>' + esc(c[6]) + '</span>',
        '<i data-lucide="chevron-down" class="w-3 h-3 opacity-70"></i>',
      '</button>'
    ].join('');

    return [

        '<td class="py-3.5 pl-4 max-w-[190px]">' + remarkHtml + '</td>',
        '<td class="py-3.5">' + tagHtml + '</td>',

        '<td class="py-3.5 text-slate-muted tabular-nums">' + c[2] + '</td>',
        '<td class="py-3.5 pr-4 text-slate-muted tabular-nums">' + c[1] + '</td>',
      '</tr>'
    ].join('');
  }).join('');

  var contentHtml = [

      '<div class="rounded-[20px] bg-surface-card border border-surface-border p-5 shadow-card">',
        '<div class="flex items-center justify-between">',
          '<span class="text-xs font-semibold text-slate-body">客户总数</span>',
          '<div class="w-8 h-8 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center"><i data-lucide="users" class="w-4 h-4"></i></div>',
        '</div>',
        '<div class="mt-2 text-3xl font-extrabold tracking-tight text-slate-title tabular-nums">' + CUST.length + '</div>',
      '</div>',
      '<div class="rounded-[20px] bg-surface-card border border-surface-border p-5 shadow-card">',
        '<div class="flex items-center justify-between">',
          '<span class="text-xs font-semibold text-slate-body">本月新增客户</span>',
          '<div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center"><i data-lucide="user-plus" class="w-4 h-4"></i></div>',
        '</div>',

        '<p class="text-xs text-slate-muted mt-1">通过扫码新增</p>',

    '</div>',

    '<div class="rounded-[20px] bg-surface-card border border-surface-border p-6 shadow-card">',
      '<div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">',
        '<div>',
          '<h3 class="font-bold text-base text-slate-title">客户跟进明细</h3>',
          '<p class="text-xs text-slate-muted mt-0.5">支持就地编辑备注（仅本人可见）、客户标签管理及多维排序</p>',

        '<div class="flex flex-wrap items-center gap-2.5">',

            '<i data-lucide="search" class="w-3.5 h-3.5 text-slate-muted absolute left-3 top-1/2 -translate-y-1/2"></i>',

          '</div>',

          '<div class="flex items-center bg-surface-subtle border border-surface-border rounded-full p-0.5 text-xs">',
            '<select onchange="S.sort=this.value;S.cp=1;pCust()" class="bg-transparent text-slate-title text-xs font-medium pl-3 pr-2 py-1 focus:outline-none cursor-pointer">',
              sorts.map(function(s){ return '<option value="' + s[0] + '"' + (S.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join(''),
            '</select>',
            '<button onclick="S.dir=S.dir===\'asc\'?\'desc\':\'asc\';S.cp=1;pCust()" class="px-2 py-1 rounded-full bg-white text-slate-body hover:text-slate-title font-semibold shadow-2xs flex items-center space-x-1" title="切换升降序">',
              '<span>' + (S.dir === 'asc' ? '↑ 升序' : '↓ 降序') + '</span>',
            '</button>',
          '</div>',

          '<select onchange="S.filter=this.value;S.cp=1;pCust()" class="bg-surface-subtle border border-surface-border rounded-full px-3 py-1.5 text-xs text-slate-title font-medium focus:outline-none cursor-pointer">',
            f.map(function(s){ return '<option value="' + s[0] + '"' + (S.filter === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join(''),
          '</select>',

          '<select onchange="S.tf=this.value;S.cp=1;pCust()" class="bg-surface-subtle border border-surface-border rounded-full px-3 py-1.5 text-xs text-slate-title font-medium focus:outline-none cursor-pointer">',
            '<option value="all">全部标签</option>',
            allTags().map(function(t){ return '<option value="' + esc(t) + '"' + (S.tf === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join(''),
          '</select>',

          ((S.filter !== 'all' || (S.tf && S.tf !== 'all') || S.query) ? [
            '<button onclick="S.filter=\'all\';S.tf=\'all\';S.query=\'\';S.cp=1;pCust()" class="text-xs font-bold text-brand-600 hover:text-brand-700 px-2 py-1">清除筛选</button>'
          ].join('') : ''),
        '</div>',
      '</div>',

      '<div class="overflow-x-auto">',
        '<table class="w-full text-left text-xs">',
          '<thead>',
            '<tr class="text-slate-muted font-bold border-b border-surface-border-subtle pb-3">',
              '<th class="pb-3 pl-4">备注 (仅本人可见)</th>',

              '<th class="pb-3">会员状态</th>',
              '<th class="pb-3">到期时间</th>',

          '</thead>',
          '<tbody class="divide-y divide-surface-border-subtle font-medium text-slate-body">',

          '</tbody>',
        '</table>',
      '</div>',

      pagerHtml(pg, 'goCustPage'),

  ].join('');

  $('app').innerHTML = renderDashboardLayout('customers', '我的客户', '客户看板', contentHtml);
  renderIcons();

  if (S.edit >= 0) {

function editRem(i) {
  S.edit = i;
  pCust();
}

function saveRem(i) {
  if (S.edit !== i) return;
  var rmInput = $('rm');
  if (!rmInput) return;
  var val = rmInput.value.trim().slice(0, 50);
  S.edit = -1;
  if (val !== (CUST[i][5] || '')) {
    CUST[i][5] = val;
    toast('客户备注已保存');
  }
  pCust();
}

function openTag(i) {
  S.tagFor = i;
  showTagModal('');
}

function showTagModal(errMsg) {
  var old = $('tag-modal'); if (old) old.remove();
  var c = CUST[S.tagFor];
  if (!c) return;
  var customCount = TAGS.custom.length;

  var chipsHtml = allTags().map(function(t, idx) {
    var isSelected = c[6] === t;
    var isCustom = idx >= 3;
    return [
      '<span class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all ' + 
        (isSelected ? 'bg-brand-500 text-white shadow-xs' : 'bg-surface-subtle text-slate-body hover:bg-surface-border/50 border border-surface-border') + '" onclick="pickTag(' + idx + ')">',
        '<span>' + esc(t) + '</span>',
        (isCustom ? '<b onclick="event.stopPropagation();delTag(' + idx + ')" class="hover:text-rose-500 ml-1 p-0.5" title="删除自定义标签">×</b>' : ''),
      '</span>'
    ].join('');
  }).join('');

  var m = document.createElement('div');
  m.id = 'tag-modal';
  m.className = 'fixed inset-0 bg-slate-title/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in';
  m.innerHTML = [
    '<div class="bg-surface-card rounded-[24px] border border-surface-border p-6 max-w-sm w-full shadow-dropdown text-left">',
      '<div class="flex items-center justify-between mb-2">',
        '<h3 class="font-bold text-base text-slate-title">设置客户标签</h3>',
        '<button type="button" onclick="$(\'tag-modal\').remove()" class="text-slate-muted hover:text-slate-title p-1 rounded-lg">✕</button>',
      '</div>',
      '<p class="text-xs text-slate-muted mb-4">为 <span class="font-bold text-slate-title">' + esc(c[0]) + '</span> 标记客情阶段（单选，仅本人可见）</p>',
      
      '<div class="flex flex-wrap gap-2 mb-4">' + chipsHtml + '</div>',

      '<div class="text-xs text-slate-muted mb-3 flex items-center justify-between">',
        '<span>自定义标签使用量: ' + customCount + ' / 10</span>',
        '<span>删除自定义标签后客户将恢复为一般</span>',
      '</div>',

      (customCount < 10 ? [
        '<div class="flex space-x-2">',
          '<input id="nt" maxlength="8" placeholder="新建标签（最多8字）" class="flex-1 bg-surface-subtle text-slate-title text-xs rounded-xl px-3 py-2 border border-surface-border focus:outline-none focus:border-brand-500">',
          '<button type="button" onclick="addTag()" class="px-3 py-2 rounded-xl bg-slate-title text-white text-xs font-bold hover:bg-slate-800 transition-all">添加</button>',
        '</div>'
      ].join('') : '<div class="text-xs text-amber-600">已达 10 个自定义标签上限</div>'),

      (errMsg ? '<div class="text-xs text-rose-600 mt-2">' + errMsg + '</div>' : ''),

      '<div class="mt-5 pt-3 border-t border-surface-border-subtle text-right">',
        '<button type="button" onclick="$(\'tag-modal\').remove()" class="px-4 py-1.5 rounded-full border border-surface-border text-xs font-semibold text-slate-body hover:bg-surface-subtle">完成</button>',
      '</div>',
    '</div>'
  ].join('');

  document.body.appendChild(m);
  renderIcons();
}

function pickTag(idx) {
  var tag = allTags()[idx];
  CUST[S.tagFor][6] = tag;
  var m = $('tag-modal'); if (m) m.remove();
  toast('已设置标签为：' + tag);
  pCust();
}

function addTag() {
  var nt = $('nt'); if (!nt) return;
  var val = nt.value.trim();
  if (!val) { showTagModal('请输入标签名称'); return; }
  if (allTags().indexOf(val) >= 0) { showTagModal('该标签已存在'); return; }
  TAGS.custom.push(val);
  CUST[S.tagFor][6] = val;
  var m = $('tag-modal'); if (m) m.remove();
  toast('已新建标签并应用');
  pCust();
}

function delTag(idx) {
  var tag = allTags()[idx];
  TAGS.custom.splice(idx - 3, 1);
  CUST.forEach(function(c){ if (c[6] === tag) c[6] = '一般'; });
  if (S.tf === tag) S.tf = 'all';
  toast('标签已删除');
  showTagModal('');
  pCust();
}

// ==================== 全局路由系统 (ROUTER) ====================
function route() {
  var h = (location.hash || '#login').slice(1);
  var authenticatedRoutes = ['promotion', 'customers', 'commission', 'profile'];

  if (authenticatedRoutes.indexOf(h) >= 0) {
    if (!S.user) {
      go('login');
      return;
    }
    if (S.user.st !== 'APPROVED') {
      go('status');
      return;
    }
  }

  if (h === 'status') {
    if (!S.user) {
      go('login');
      return;
    }
    if (S.user.st === 'APPROVED') {
      go('promotion');
      return;
    }
  }

  window.scrollTo(0, 0);

  var routes = {
    login: pLogin,
    apply: pApply,
    forgot: pForgot,
    status: pStatus,
    promotion: pPromo,
    customers: pCust,
    commission: pComm,
    profile: pProfile
  };

  var handler = routes[h] || pLogin;
  handler();
}

window.addEventListener('hashchange', route);
route();
</script>
