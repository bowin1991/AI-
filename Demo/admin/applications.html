  <script>
function renderApplicationsView(container) {
  let filtered = APPLICATIONS.filter(a => {
    if (appStatusTab !== 'ALL' && a.status !== appStatusTab) return false;
    const applyDate = a.apply_time.slice(0, 10);
    if (appFrom && applyDate < appFrom) return false;
    if (appTo && applyDate > appTo) return false;
    if (appKw) {
      const kw = appKw.toLowerCase();
      return a.name.toLowerCase().includes(kw) || a.phone.includes(kw) || a.org.toLowerCase().includes(kw);
    }
    return true;
  });

  const showTimeCol = appStatusTab === 'APPROVED' || appStatusTab === 'REJECTED';
  const timeColLabel = appStatusTab === 'APPROVED' ? '入驻时间' : '拒绝时间';
  const showOperatorCol = appStatusTab !== 'PENDING';
  const colCount = 7 + (showTimeCol ? 1 : 0) + (showOperatorCol ? 1 : 0);
  const pagedRows = pagedList('apps', filtered);

  container.innerHTML = `
    <!-- 页面标题区 (1:1 官方规范) -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px;">
      <div>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--foreground); letter-spacing: -0.02em;">申请审核</h1>
      </div>
    </div>

    <!-- 筛选卡片 (1:1 官方筛选用户样式) -->
    <div class="filter-card">
      <div class="filter-title-row">
        <span class="filter-title">筛选申请</span>
        <button class="btn btn-outline btn-sm" onclick="appKw=''; renderApplicationsView(document.getElementById('main-view-container'))">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          重置
        </button>
      </div>
      <div class="filter-inputs-grid">
        <div class="filter-field" style="flex: 2; min-width: 260px;">
          <span class="field-label">关键词</span>
          <input class="input-control" type="text" placeholder="申请 ID、姓名、完整手机号、机构单位" value="${appKw}" oninput="appKw=this.value; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
        </div>
        <div class="filter-field" style="flex: 1;">
          <span class="field-label">审核状态</span>
          <select class="input-control" onchange="appStatusTab=this.value; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
            <option value="PENDING" ${appStatusTab==='PENDING'?'selected':''}>待审核 (默认)</option>
            <option value="APPROVED" ${appStatusTab==='APPROVED'?'selected':''}>已通过</option>
            <option value="REJECTED" ${appStatusTab==='REJECTED'?'selected':''}>已拒绝</option>
            <option value="ALL" ${appStatusTab==='ALL'?'selected':''}>全部状态</option>
          </select>
        </div>
        <div class="filter-field" style="flex: 1; min-width: 230px; position: relative;">
          <span class="field-label">申请时间</span>
          <button type="button" class="input-control date-range-trigger" onclick="toggleAppDatePicker()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted-foreground); flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
            <span style="flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; ${appFrom || appTo ? '' : 'color: var(--muted-foreground);'}">
              ${appFrom || appTo ? `${appFrom || '不限'} — ${appTo || '不限'}` : '选择日期区间'}
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted-foreground); flex-shrink:0;"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          ${appPickerOpen ? dateRangePickerHtml() : ''}
        </div>
      </div>
    </div>

    <!-- 分段标签页 (Segmented Controls) -->
    <div class="segmented-tabs">
      <button class="seg-tab-btn ${appStatusTab==='PENDING'?'active':''}" onclick="appStatusTab='PENDING'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
        待审核
      </button>
      <button class="seg-tab-btn ${appStatusTab==='APPROVED'?'active':''}" onclick="appStatusTab='APPROVED'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
        已通过
      </button>
      <button class="seg-tab-btn ${appStatusTab==='REJECTED'?'active':''}" onclick="appStatusTab='REJECTED'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
        已拒绝
      </button>
      <button class="seg-tab-btn ${appStatusTab==='ALL'?'active':''}" onclick="appStatusTab='ALL'; resetPage('apps'); renderApplicationsView(document.getElementById('main-view-container'))">
        全部申请
      </button>
    </div>

    <!-- 数据表格卡片 (1:1 官方表格规范) -->
    <div class="table-container">
      <table class="official-table">
        <thead>
          <tr>
            <th>申请人</th>
            <th>手机号</th>
            <th>所属单位</th>
            <th>微信号</th>
            <th>申请时间</th>
            ${showTimeCol ? `<th>${timeColLabel}</th>` : ''}
            <th>审核状态</th>
            ${showOperatorCol ? '<th>操作人</th>' : ''}
            <th class="col-sticky" style="text-align: right;">操作</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length === 0 ? `
            <tr><td colspan="${colCount}" style="text-align:center; padding:48px; color:var(--muted-foreground);">暂无符合筛选条件的申请记录</td></tr>
          ` : pagedRows.map(item => `
            <tr>
              <td style="font-weight: 600;">${item.name}</td>
              <td class="num font-semibold" style="color: var(--foreground);">${item.phone}</td>
              <td>
                <div style="max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  ${item.org}
                </div>
              </td>
              <td style="color: var(--muted-foreground);">${item.wx || '-'}</td>
              <td style="color: var(--muted-foreground); font-size: 12px;">${item.apply_time}</td>
              ${showTimeCol ? `<td style="color: var(--muted-foreground); font-size: 12px;">${(appStatusTab === 'APPROVED' ? item.approve_time : item.reject_time) || '-'}</td>` : ''}
              <td>
                ${item.status === 'PENDING' ? '<span class="badge badge-warning">待审核</span>' : ''}
                ${item.status === 'APPROVED' ? '<span class="badge badge-success">已通过</span>' : ''}
                ${item.status === 'REJECTED' ? '<span class="badge badge-danger">已拒绝</span>' : ''}
              </td>
              ${showOperatorCol ? `<td>${item.status === 'APPROVED' ? (item.approve_by || '-') : item.status === 'REJECTED' ? (item.reject_by || '-') : ''}</td>` : ''}
              <td class="col-sticky" style="text-align: right;">
                <button class="btn btn-outline btn-sm" onclick="openAppDetailDrawer('${item.id}')">${item.status === 'PENDING' ? '审核' : '查看'}</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${pagerBar('apps', filtered.length)}
    </div>
  `;
}

// ---------------- 申请时间区间选择器（shadcn/ui 风格） ----------------
function pad2(n) { return String(n).padStart(2, '0'); }
function ymAdd(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function ymLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${y} 年 ${m} 月`;
}
function monthCells(ym) {
  const [y, m] = ym.split('-').map(Number);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m - 1, 0).getDate();
  const prevYm = ymAdd(ym, -1);
  const nextYm = ymAdd(ym, 1);
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    cells.push({ date: `${prevYm}-${pad2(prevDays - i)}`, day: prevDays - i, muted: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ date: `${ym}-${pad2(d)}`, day: d, muted: false });
  }
  let n = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ date: `${nextYm}-${pad2(n)}`, day: n, muted: true });
    n++;
  }
  return cells;
}
function calMonthHtml(ym) {
  const chevronL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>';
  const chevronR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>';
  return `
    <div>
      <div class="cal-head">
        <button type="button" class="cal-nav" onclick="shiftAppCal(-1)">${chevronL}</button>
        <span>${ymLabel(ym)}</span>
        <button type="button" class="cal-nav" onclick="shiftAppCal(1)">${chevronR}</button>
      </div>
      <div class="cal-weekdays">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">
        ${monthCells(ym).map(c => {
          const isFrom = c.date === appTmpFrom;
          const isTo = c.date === appTmpTo;
          const inRange = appTmpFrom && appTmpTo && c.date > appTmpFrom && c.date < appTmpTo;
          const cls = ['cal-day', c.muted ? 'muted' : '', (isFrom || isTo) ? 'edge' : '', inRange ? 'in-range' : '', c.date === REF_DATE ? 'today' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" onclick="pickAppDate('${c.date}')">${c.day}</button>`;
        }).join('')}
      </div>
    </div>`;
}
function dateRangePickerHtml() {
  return `
    <div class="date-popover" onclick="event.stopPropagation()">
      <div class="cal-wrap">
        ${calMonthHtml(appCalMonth)}
        ${calMonthHtml(ymAdd(appCalMonth, 1))}
      </div>
      <div class="cal-footer">
        <div class="cal-presets">
          <button type="button" class="cal-preset" onclick="setAppRangePreset('7')">近 7 天</button>
          <button type="button" class="cal-preset" onclick="setAppRangePreset('month')">本月</button>
          <button type="button" class="cal-preset" onclick="clearAppDatePicker()">清空</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeAppDatePicker()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="applyAppDatePicker()">确定</button>
        </div>
      </div>
    </div>`;
}
function appDocClick() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function toggleAppDatePicker() {
  appPickerOpen = !appPickerOpen;
  if (appPickerOpen) {
    appTmpFrom = appFrom;
    appTmpTo = appTo;
    setTimeout(() => document.addEventListener('click', appDocClick), 0);
  } else {
    document.removeEventListener('click', appDocClick);
  }
  renderActiveView();
}
function closeAppDatePicker() {
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  renderActiveView();
}
function applyAppDatePicker() {
  appFrom = appTmpFrom;
  appTo = appTmpTo;
  appPickerOpen = false;
  document.removeEventListener('click', appDocClick);
  resetPage('apps');
  renderActiveView();
}
function clearAppDatePicker() {
  appTmpFrom = '';
  appTmpTo = '';
  renderActiveView();
}
function shiftAppCal(delta) {
  appCalMonth = ymAdd(appCalMonth, delta);
  renderActiveView();
}
function pickAppDate(date) {
  if (!appTmpFrom || appTmpTo) {
    appTmpFrom = date;
    appTmpTo = '';
  } else if (date < appTmpFrom) {
    appTmpTo = appTmpFrom;
    appTmpFrom = date;
  } else {
    appTmpTo = date;
  }
  renderActiveView();
}
function setAppRangePreset(type) {
  const shift = offset => {
    const d = new Date(REF_DATE + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  };
  if (type === '7') {
    appTmpFrom = shift(-6);
    appTmpTo = REF_DATE;
  } else if (type === 'month') {
    appTmpFrom = REF_DATE.slice(0, 7) + '-01';
    appTmpTo = REF_DATE;
  }
  renderActiveView();
}

// ==========================================
// 2. 页面：合伙人管理 (PARTNER MANAGEMENT)

function renderCurrentPage() {
  renderApplicationsView(document.getElementById("main-view-container"));
}

function startPage() {
  initAdminNav('nav-applications');
  renderCurrentPage();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPage);
} else {
  startPage();
}
  </script>
